         <label class="opt" style="width:100%;justify-content:flex-start" onclick="Export.matrixCSV()"><span class="ov">⊞</span><span class="ol">Matriz final de importancias <span class="muted small">(CSV)</span></span></label>
         <label class="opt" style="width:100%;justify-content:flex-start" onclick="Export.impactsCSV()"><span class="ov">◈</span><span class="ol">Impactos con criterios y justificaciones <span class="muted small">(CSV)</span></span></label>
         <label class="opt" style="width:100%;justify-content:flex-start" onclick="Export.interactionCSV()"><span class="ov">▦</span><span class="ol">Matriz de interacción actividad×factor <span class="muted small">(CSV)</span></span></label>
         <label class="opt" style="width:100%;justify-content:flex-start" onclick="Persist.save();Modal.close()"><span class="ov">{ }</span><span class="ol">Proyecto completo <span class="muted small">(JSON · .valia)</span></span></label>
       </div>`);
  },
  chartPng(key){
    const f=Results.figures().find(x=>x.key===key);
    if(!f){Toast.show('Gráfica no disponible','warn');return;}
    ImgExport.downloadSvgAsPng(f.svg, Export._base()+'_'+key+'.png');
  },
  async imagesZip(){
    if(!DB.impacts.some(i=>{const as=Data.initialAssess(i.id);return as&&as.complete;})){Toast.show('Aún no hay gráficas: valora algún impacto','warn');return;}
    Toast.show('Generando imágenes…','info');
    try{
      const figs=Results.figures(); const files=[];
      for(let i=0;i<figs.length;i++){
        const blob=await ImgExport.svgToPngBlob(figs[i].svg);
        const buf=new Uint8Array(await blob.arrayBuffer());
        files.push({name:('0'+(i+1)).slice(-2)+'_'+figs[i].key+'.png', data:buf});
      }
      ImgExport.downloadBlob(Zip.build(files), Export._base()+'_graficas.zip');
      Toast.show('Paquete de imágenes descargado ('+files.length+' PNG)');
    }catch(e){ Toast.show('No se pudieron generar las imágenes','err'); }
  },
  _dl(name,content,mime='text/csv;charset=utf-8'){
    const blob=new Blob(['\ufeff'+content],{type:mime});
    const a=el('a',{href:URL.createObjectURL(blob),download:name});
    document.body.appendChild(a);a.click();a.remove();
    Toast.show('Archivo exportado: '+name);
  },
  _csv(rows){ return rows.map(r=>r.map(c=>{const s=(c==null?'':String(c));return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n'); },
  _base(){ return (DB.project.code||DB.project.name||'valia').replace(/[^\w\-]+/g,'_'); },
  matrixCSV(){
    const M=getMethod();
    const head=['ID','Impacto','Etapa','Actividad','Factor','Medio','Componente','Naturaleza',...M.criteria.map(c=>c.code),'I','|I|','Clasificacion'];
    const rows=[head];
    DB.impacts.forEach(i=>{const as=Data.initialAssess(i.id);if(!as||!as.complete)return;
      const a=Data.activity(i.activity_id),f=Data.factor(i.factor_id),st=a?Data.stageOf(a):null;
      const medio=f?(Catalog.medioLabel(f.medium)||''):''; const comp=f?(f.component||''):'';
      rows.push([i.id,i.name,st?st.name:'',a?a.name:'',f?f.name:'',medio,comp,i.nature==='POS'?'Positivo':'Negativo',
        ...M.criteria.map(c=>{const e=as.criteria[c.code]||{};return (e.value||0)+(e.modifier||0);}),
        as.score,as.abs,M.clsInfo(as.cls).label]);
    });
    this._dl(this._base()+'_matriz.csv',this._csv(rows)); Modal.close();
  },
  impactsCSV(){
    const M=getMethod();
    const rows=[['ID','Impacto','Naturaleza','Criterio','Valor','Modificador','Categoria','Justificacion','Fuente','Confianza']];
    DB.impacts.forEach(i=>{const as=Data.initialAssess(i.id);if(!as)return;
      M.criteria.forEach(c=>{const e=as.criteria[c.code]||{};
        rows.push([i.id,i.name,i.nature==='POS'?'Positivo':'Negativo',c.code,e.value==null?'':e.value,e.modifier||0,e.category||'',e.justification||'',e.source||'',e.confidence||'']);
      });
    });
    this._dl(this._base()+'_impactos_criterios.csv',this._csv(rows)); Modal.close();
  },
  interactionCSV(){
    const rows=[['Factor \\ Actividad',...DB.activities.map(a=>a.name)]];
    DB.factors.forEach(f=>{
      rows.push([Data.factorLabel(f),...DB.activities.map(a=>{const it=Data.interaction(a.id,f.id);const n=Data.impactsOf(a.id,f.id).length;return it&&it.exists?(n||'X'):'';})]);
    });
    this._dl(this._base()+'_interaccion.csv',this._csv(rows)); Modal.close();
  },
  /* ---- Exportación de la matriz de interacción completa (PNG alta calidad / Excel con colores) ---- */
  _matrixData(){
    const acts=Data.activitiesOrdered(); const facts=DB.factors.slice();
    const runsBy=(keyFn,labelFn)=>{const r=[];acts.forEach(a=>{const k=keyFn(a);const last=r[r.length-1];if(last&&last.k===k)last.span++;else r.push({k,span:1,label:labelFn(a)});});return r;};
    const stageRuns=runsBy(a=>{const s=Data.stageOf(a);return s?s.id:'__';},a=>{const s=Data.stageOf(a);return s?s.name:'(sin etapa)';});
    const compRuns=runsBy(a=>{const c=Data.componentOf(a);return c?c.id:'__';},a=>{const c=Data.componentOf(a);return c?c.name:'(sin componente)';});
    const colSum={}; acts.forEach(a=>colSum[a.id]=0); let grand=0;
    const rows=facts.map(f=>{ let rowSum=0;
      const cells=acts.map(a=>{const it=Data.interaction(a.id,f.id);const on=it&&it.exists;const imps=Data.impactsOf(a.id,f.id);
        rowSum+=imps.length;colSum[a.id]+=imps.length;let hasN=false,hasP=false;imps.forEach(im=>{im.nature==='POS'?hasP=true:hasN=true;});
        const kind=imps.length?(hasN&&hasP?'mix':hasP?'pos':'neg'):(on?'on':'');
        return {kind,val:imps.length?String(imps.length):(on?'✓':'')};});
      grand+=rowSum; return {label:Data.factorLabel(f),cells,rowSum};});
    return {acts,facts,stageRuns,compRuns,rows,colSum,grand};
  },
  matrixSVGFull(){
    const {acts,facts,stageRuns,compRuns,rows,colSum,grand}=this._matrixData();
    const kind={neg:{bg:'#F1D7D7',fg:'#9E2A2A'},pos:{bg:'#D7E3EF',fg:'#1F5A82'},mix:{bg:'#E1D8EC',fg:'#5B3E86'},on:{bg:'#E7E3DA',fg:'#4A4F56'}};
    const padL=232,colW=34,sumW=42,rowH=22,grpH=22,pad=14,titleH=26;
    const maxAct=Math.max(6,...acts.map(a=>String(a.name).length));
    const actH=Math.min(220,Math.round(maxAct*6.0))+14;
    const nC=acts.length, gridW=padL+nC*colW+sumW, headTop=titleH+pad, actY=headTop+grpH*2, bodyTop=actY+actH;
    const W=pad*2+gridW, H=bodyTop+(facts.length+1)*rowH+pad, X0=pad;
    const colX=i=>X0+padL+i*colW;
    const trunc=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s;};
    let g=`<rect width="${W}" height="${H}" fill="#ffffff"/><text x="${X0}" y="18" style="font-family:Georgia,serif;font-size:15px;font-weight:700;fill:#0A4744">Matriz de interacción actividad × factor</text>`;
    const drawRuns=(runs,y,corner,bg)=>{let out=`<rect x="${X0}" y="${y}" width="${padL}" height="${grpH}" fill="${bg}" stroke="#E5E2DB"/><text x="${X0+8}" y="${y+grpH/2+3}" style="font-size:10px;font-weight:700;fill:#6B7280;font-family:system-ui,Arial">${esc(corner)}</text>`;
      let cx=X0+padL; runs.forEach(r=>{const w=r.span*colW;out+=`<rect x="${cx}" y="${y}" width="${w}" height="${grpH}" fill="${bg}" stroke="#E5E2DB"/><text x="${cx+w/2}" y="${y+grpH/2+3}" text-anchor="middle" style="font-size:9.5px;font-weight:700;fill:#4A4F56;font-family:system-ui,Arial">${esc(trunc(r.label,Math.max(3,Math.floor(w/6.2))))}</text>`;cx+=w;});
      out+=`<rect x="${cx}" y="${y}" width="${sumW}" height="${grpH}" fill="${bg}" stroke="#E5E2DB"/>`; return out;};
    g+=drawRuns(stageRuns,headTop,'Etapa','#F0EEE8');
    g+=drawRuns(compRuns,headTop+grpH,'Componente','#F6F4EF');
    g+=`<rect x="${X0}" y="${actY}" width="${padL}" height="${actH}" fill="#FAF9F6" stroke="#E5E2DB"/><text x="${X0+8}" y="${actY+actH-7}" style="font-size:10px;font-weight:700;fill:#6B7280;font-family:system-ui,Arial">Factor \\ Actividad</text>`;
    acts.forEach((a,i)=>{const x=colX(i);g+=`<rect x="${x}" y="${actY}" width="${colW}" height="${actH}" fill="#FAF9F6" stroke="#E5E2DB"/>`;
      const tx=x+colW/2+3,ty=actY+actH-6;g+=`<text x="${tx}" y="${ty}" transform="rotate(-90 ${tx} ${ty})" text-anchor="start" style="font-size:10px;fill:#3A3F45;font-family:system-ui,Arial">${esc(trunc(a.name,Math.floor((actH-10)/5.6)))}</text>`;});
    g+=`<rect x="${colX(nC)}" y="${actY}" width="${sumW}" height="${actH}" fill="#FAF9F6" stroke="#E5E2DB"/><text x="${colX(nC)+sumW/2}" y="${actY+actH-7}" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#6B7280;font-family:system-ui,Arial">Σ</text>`;
    let y=bodyTop;
    rows.forEach(r=>{
      g+=`<rect x="${X0}" y="${y}" width="${padL}" height="${rowH}" fill="#ffffff" stroke="#E5E2DB"/><text x="${X0+8}" y="${y+rowH/2+3}" style="font-size:10px;fill:#1B1E22;font-family:system-ui,Arial">${esc(trunc(r.label,Math.floor((padL-14)/5.6)))}</text>`;
      r.cells.forEach((c,i)=>{const x=colX(i);const k=c.kind?kind[c.kind]:null;g+=`<rect x="${x}" y="${y}" width="${colW}" height="${rowH}" fill="${k?k.bg:'#ffffff'}" stroke="#E5E2DB"/>`;
        if(c.val!=='')g+=`<text x="${x+colW/2}" y="${y+rowH/2+3}" text-anchor="middle" style="font-size:10px;font-weight:700;fill:${k?k.fg:'#4A4F56'};font-family:system-ui,Arial">${esc(c.val)}</text>`;});

const CM_BG={compat:'#2E7D46',moder:'#F2C010',sever:'#E8842B',critic:'#C0392B',pos:'#2F86B4',neu:'#9AA0A6'};
const CM_FG={compat:'#ffffff',moder:'#1a1a1a',sever:'#ffffff',critic:'#ffffff',pos:'#ffffff',neu:'#ffffff'};

const ClassMatrix={
  _ord(f){let mi=99,ci=999;if(f.medium){const m=CATALOG.medios.findIndex(x=>x.c===f.medium);if(m>=0)mi=m;}if(f.component){const idx=CATALOG.componentes.findIndex(x=>x.n===f.component);if(idx>=0)ci=idx;}return {mi,ci,comp:f.component||'',fac:String(Data.factorLabel(f))};},
  data(){
    const M=getMethod(); const acts=Data.activitiesOrdered();
    const runsBy=(arr,keyFn,labelFn)=>{const r=[];arr.forEach((a,idx)=>{const k=keyFn(a);const last=r[r.length-1];if(last&&last.k===k){last.span++;}else r.push({k,span:1,label:labelFn(a),start:idx});});return r;};
    const colStage=runsBy(acts,a=>{const s=Data.stageOf(a);return s?s.id:'__';},a=>{const s=Data.stageOf(a);return s?s.name:'(sin etapa)';});
    const colComp=runsBy(acts,a=>{const c=Data.componentOf(a);return c?c.id:'__';},a=>{const c=Data.componentOf(a);return c?c.name:'(sin componente)';});
    const facts=DB.factors.slice().sort((a,b)=>{const ka=this._ord(a),kb=this._ord(b);return ka.mi-kb.mi||ka.ci-kb.ci||ka.comp.localeCompare(kb.comp)||ka.fac.localeCompare(kb.fac);});
    const medioRuns=runsBy(facts,f=>f.medium||'__',f=>Catalog.medioLabel(f.medium)||'(sin medio)');
    const compRuns=runsBy(facts,f=>(f.medium||'')+'|'+(f.component||'__'),f=>f.component||'(sin componente)');

    const imps=Data.impactsOf(a.id,f.id).map(i=>({i,as:Data.initialAssess(i.id)})).filter(x=>x.as&&x.as.complete);

    imps.sort((x,y)=>(y.as.abs||0)-(x.as.abs||0));

    let bucket=(top.i.nature==='POS'||cls==='pos')?'pos':(cls||'neu'); if(!CM_CODE[bucket])bucket='neu';

    g+=`<rect x="${X0+wMed}" y="${actY}" width="${wComp}" height="${actH}" fill="#EEF0F2" stroke="#C9CDD3"/><text x="${X0+wMed+wComp/2}" y="${actY+actH-8}" text-anchor="middle" style="font-size:9.5px;font-weight:700;fill:#4A4F56;font-family:system-ui,Arial">Componente ambiental</text>`;
    g+=`<rect x="${X0+wMed+wComp}" y="${actY}" width="${wFac}" height="${actH}" fill="#EEF0F2" stroke="#C9CDD3"/><text x="${X0+wMed+wComp+8}" y="${actY+actH-8}" style="font-size:9.5px;font-weight:700;fill:#4A4F56;font-family:system-ui,Arial">Factor ambiental</text>`;
    acts.forEach((a,i)=>{const x=colX(i);g+=`<rect x="${x}" y="${actY}" width="${colW}" height="${actH}" fill="#EEF0F2" stroke="#C9CDD3"/>`;const tx=x+colW/2+3,ty=actY+actH-6;g+=`<text x="${tx}" y="${ty}" transform="rotate(-90 ${tx} ${ty})" text-anchor="start" style="font-size:9.5px;fill:#3A3F45;font-family:system-ui,Arial">${esc(trunc(a.name,Math.floor((actH-10)/5.4)))}</text>`;});
    const drawSpan=(runs,x,w,vertical)=>{runs.forEach(r=>{const y=bodyTop+r.start*rowH,hh=r.span*rowH;g+=`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="#F3F4F6" stroke="#C9CDD3"/>`;const cxp=x+w/2,cyp=y+hh/2;if(vertical){g+=`<text x="${cxp}" y="${cyp}" transform="rotate(-90 ${cxp} ${cyp})" text-anchor="middle" style="font-size:9px;font-weight:700;fill:#333;font-family:system-ui,Arial">${esc(trunc(r.label,Math.floor((hh-6)/5.4)))}</text>`;}else{g+=`<text x="${x+5}" y="${cyp+3}" style="font-size:9px;font-weight:700;fill:#333;font-family:system-ui,Arial">${esc(trunc(r.label,Math.floor((w-8)/5.2)))}</text>`;}});};

/* ============================================================
   13. CONTROL DE CALIDAD (checklist antes de reportar)
   ============================================================ */
function qualityCheck(){
  const M=getMethod(); const issues=[];
  if(!DB.project.name) issues.push({lvl:'warn',t:'El proyecto no tiene nombre.'});
  DB.impacts.forEach(i=>{
    if(M.usesNature!==false && !i.nature) issues.push({lvl:'err',t:`Impacto sin naturaleza: ${i.name}`});
    const as=Data.initialAssess(i.id);
    if(!as||!as.complete){ issues.push({lvl:'warn',t:`Impacto sin valoración completa: ${i.name}`}); return; }
    M.criteria.forEach(c=>{const e=as.criteria[c.code]||{}; if(!e.justification||!e.justification.trim()) issues.push({lvl:'info',t:`Sin justificación en ${c.code} · ${i.name}`});});
    if(!as.evaluator) issues.push({lvl:'info',t:`Sin evaluador registrado: ${i.name}`});
    if(isNeg(i,as,M)&&(M.severeIds||[]).includes(as.cls)&&!Data.measuresOf(i.id).length)
      issues.push({lvl:'warn',t:`Impacto ${M.clsInfo(as.cls).label.toLowerCase()} sin medidas: ${i.name}`});
    const res=Data.residualAssess(i.id);
    if(res&&res.complete){M.criteria.forEach(c=>{const e0=(as.criteria[c.code]||{}),e1=(res.criteria[c.code]||{});
      if(((e0.value||0)+(e0.modifier||0))!==((e1.value||0)+(e1.modifier||0))&&(!e1.justification||!e1.justification.trim()))
        issues.push({lvl:'info',t:`Residual ${c.code} cambió sin nueva justificación · ${i.name}`});});}
  });
  // Interacciones marcadas sin impactos (celdas colgadas)
  DB.interactions.filter(x=>x.exists).forEach(x=>{
    if(!Data.impactsOf(x.activity_id,x.factor_id).length){
      const a=Data.activity(x.activity_id),f=Data.factor(x.factor_id);
      issues.push({lvl:'warn',t:`Interacción marcada sin impactos: ${a?a.name:'?'} → ${f?f.name:'?'} (quítala o agrega un impacto)`});
    }
  });
  return issues;
}

      <div class="rc-sub">Identificación, caracterización y valoración de impactos ambientales</div>
      <table class="rc-meta"><tbody>
        ${[['Clave / expediente',p.code],['Promovente',p.promoter],['Sector / subsector',[p.sector,p.subsector].filter(Boolean).join(' · ')],
           ['Tipo de obra',p.type],['Modalidad',p.modality],['Ubicación',[p.locality,p.municipality,p.state].filter(Boolean).join(', ')],
           ['Coordenadas',(p.latitude&&p.longitude)?`${p.latitude}, ${p.longitude} (${p.crs})`:''],['Sistema ambiental',p.environmental_system],
           ['Área del proyecto',p.project_area?p.project_area+' ha':''],['Área de influencia',p.influence_area?p.influence_area+' ha':''],
           ['Responsable de la evaluación',p.responsible],['Cédula profesional',p.cedula],['Método de evaluación',`${M.name} · ${M.id} v${M.version}`],['Fecha de emisión',dt]]
          .filter(r=>r[1]).map(r=>`<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
  },
  _method(M){
    const fmtR=(v)=> v===Infinity?'∞':(v===-Infinity?'−∞':(Number.isInteger(v)?v:Number(v).toFixed(2)));
    const scaleTxt=(c)=> c.scale.length>6 ? `${c.scale[0].v}–${c.scale[c.scale.length-1].v} (ordinal)` : c.scale.map(sc=>sc.l+'='+sc.v).join('; ')+(c.modifier?'; +crítico='+c.modifier.v:'');
    const critLbl = M.family==='conesa'?'Atributo':'Criterio';
    return `<section class="rblock">${Report._h('1','Metodología de evaluación')}
      <p>${M.reportIntro||('Método '+esc(M.name)+'.')} <span class="muted">(Perfil ${esc(M.id)}, versión ${M.version}.)</span></p>
      <div class="rformula">${esc(M.equation)}</div>
      <p>${M.reportWeighting||''}</p>
      <table class="rtbl"><thead><tr><th>${critLbl}</th><th>Descripción</th><th>Escala (valor)</th></tr></thead><tbody>
        ${M.criteria.map(c=>`<tr><td><b>${c.code}</b> · ${esc(c.name)}${c.group?` <span class="muted">(${esc(c.group)})</span>`:''}</td><td>${esc(c.help.ev)}</td><td class="rmono">${esc(scaleTxt(c))}</td></tr>`).join('')}
        ${M.family==='bojorquez'?`<tr><td><b>T</b> · Mitigación</td><td>Eficacia de las medidas (0–9). G = I·(1−T/9).</td><td class="rmono">0–9 (ordinal)</td></tr>`:''}
      </tbody></table>
      <table class="rtbl" style="margin-top:10px"><thead><tr><th>Significancia</th><th>${esc(M.rangeLabel||M.scoreLabel||'Valor')}</th></tr></thead>
        <tbody>${M.classes.map(c=>`<tr><td><span class="chip ${c.cls}">${esc(c.label)}</span></td><td class="rmono">${fmtR(c.min)} – ${fmtR(c.max)}</td></tr>`).join('')}</tbody></table>
      <p class="rnote">Nota metodológica: ${esc(M.name)} es un método semicuantitativo; el valor de ${esc(M.scoreLabel||'I')} resulta de juicios expertos sobre criterios ordinales debidamente justificados, no de una medición instrumental. Cada valoración conserva su justificación, fuente y versión metodológica para garantizar reproducibilidad. Fuente: ${esc(M.source)}</p>
    </section>`;
  },
  _actions(){
    const stages=DB.stages.slice().sort((a,b)=>(a.sequence||0)-(b.sequence||0));
    return `<section class="rblock">${Report._h('2','Identificación de acciones del proyecto')}
      <p>El proyecto se estructuró en ${stages.length} etapa(s), organizadas por componente del proyecto (subetapa) y sus actividades susceptibles de generar impactos ambientales:</p>
      ${stages.map(st=>{const comps=Data.componentsOf(st.id);return `<div class="rsubh">${esc(st.name)}</div>
        ${comps.length? comps.map(c=>{const acts=Data.activitiesOfComponent(c.id);
          return `<div class="rcomp"><span class="rtag">${esc(c.name)}</span></div>
          ${acts.length?`<table class="rtbl"><thead><tr><th style="width:34%">Actividad</th><th>Descripción</th><th style="width:110px">Dimensión</th></tr></thead><tbody>
            ${acts.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.description||'—')}</td><td class="rmono">${(a.affected_area!=null&&a.affected_area!=='')?esc(a.affected_area)+' '+esc(a.affected_unit||''):'—'}</td></tr>`).join('')}</tbody></table>`:'<p class="rnote">Sin actividades.</p>'}`;
        }).join('') : '<p class="rnote">Sin componentes registrados.</p>'}`;}).join('')}
    </section>`;
  },
  _factors(){
    const byMed={};DB.factors.forEach(f=>{const k=(MEDIA.find(m=>m.id===f.medium)||{}).label||'Sin clasificar';(byMed[k]=byMed[k]||[]).push(f);});
    return `<section class="rblock">${Report._h('3','Factores ambientales considerados')}
      <p>Se identificaron ${DB.factors.length} factor(es) ambiental(es), organizados por medio y componente:</p>
      <table class="rtbl"><thead><tr><th style="width:130px">Medio</th><th style="width:150px">Componente</th><th>Factor</th><th style="width:150px">Indicador</th></tr></thead><tbody>
        ${Object.entries(byMed).map(([med,fs])=>fs.map((f,i)=>`<tr>${i===0?`<td rowspan="${fs.length}"><b>${esc(med)}</b></td>`:''}<td>${esc(f.component||'—')}</td><td>${esc(f.name)}</td><td>${esc(f.indicator||'—')}</td></tr>`).join('')).join('')}
      </tbody></table>
    </section>`;
  },
  _interactionMatrix(){
    if(!DB.activities.length||!DB.factors.length)return '';
    const acts=(Data.activitiesOrdered?Data.activitiesOrdered():DB.activities);
    const cell=(a,f)=>{
      const imps=Data.impactsOf(a.id,f.id); if(!imps.length){const it=Data.interaction(a.id,f.id);return it&&it.exists?`<td class="on">✓</td>`:`<td></td>`;}
      let hasN=false,hasP=false; imps.forEach(im=>im.nature==='POS'?hasP=true:hasN=true);
      const ncls=hasN&&hasP?'n-mix':hasP?'n-pos':'n-neg';
      return `<td class="${ncls}">${imps.length}</td>`;
    };
    const colSum={}; acts.forEach(a=>colSum[a.id]=0); let grand=0;
    const bodyRows=DB.factors.map(f=>{
      let rowSum=0;
      const tds=acts.map(a=>{const n=Data.impactsOf(a.id,f.id).length;rowSum+=n;colSum[a.id]+=n;return cell(a,f);}).join('');
      grand+=rowSum;
      return `<tr><th>${esc(Data.factorLabel(f))}</th>${tds}<td class="rsum">${rowSum||''}</td></tr>`;
    }).join('');
    const sumRow=`<tr class="rsumrow"><th>Σ actividad</th>${acts.map(a=>`<td>${colSum[a.id]||''}</td>`).join('')}<td class="rgrand">${grand||''}</td></tr>`;
    return `<section class="rblock rland">${Report._h('4','Matriz de identificación de interacciones')}
      <p>Cada celda marcada indica una interacción actividad–factor de la que deriva al menos un impacto ambiental identificado; el número es la cantidad de impactos y el color, su naturaleza. Las columnas y filas Σ suman los impactos por actividad y por factor.</p>
      <div class="rmatrix-legend"><span><span class="sw" style="background:#F1D7D7"></span>Negativo</span><span><span class="sw" style="background:#D7E3EF"></span>Positivo</span><span><span class="sw" style="background:#E1D8EC"></span>Mixto (naturalezas distintas)</span></div>
      <table class="rmatrix"><thead><tr><th class="rcorner">Factor \\ Actividad</th>${acts.map(a=>`<th><div class="rvert">${esc(a.name)}</div></th>`).join('')}<th class="rsumhd">Σ</th></tr></thead>
      <tbody>${bodyRows}${sumRow}</tbody></table>
      <p class="rnote">La celda se marca únicamente cuando existe al menos un impacto caracterizado; el número indica cuántos y el color su naturaleza (rojo negativo, azul positivo, morado mixto). El gran total coincide con el número de impactos identificados.</p>
    </section>`;
  },
  _causal(M){
    if(!DB.causalNodes||DB.causalNodes.length<2)return '';
    Causal.prune();
    const lvl=Causal.levels();
    const ordLabel=(L)=> L<=1?'Directo':(L===2?'Indirecto':'Orden superior');
    const rows=DB.impacts.map(im=>{const inn=Causal.find('IMPACT',im.id);if(!inn)return null;const L=lvl[inn.id]||1;return {name:im.name,L};}).filter(Boolean);
    const indir=rows.filter(r=>r.L>=2).length;
    return `<section class="rblock rland">${Report._h('6','Red causa–efecto')}
      <p>Representación de las cadenas causales del proyecto (actividad → impacto → factor), incluyendo impactos indirectos y nodos intermedios de presión o cambio. El <i>orden causal</i> corresponde a la longitud de la cadena más larga que llega a cada impacto (1 = directo; 2 = indirecto; ≥3 = orden superior). Este análisis apoya la trazabilidad y la justificación de sinergias y acumulación; no modifica el valor de las valoraciones.</p>
      <div style="text-align:center;margin:12px 0;overflow-x:auto">${Causal.svg({bg:true})}</div>
      <table class="rtbl"><thead><tr><th>Impacto</th><th>Orden causal</th><th>Tipo</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="rmono">${r.L}</td><td>${ordLabel(r.L)}</td></tr>`).join('')}
      </tbody></table>
      <p class="rnote">La red contiene ${DB.causalNodes.length} nodos y ${DB.causalEdges.length} relaciones causales${indir?`, con ${indir} impacto(s) de carácter indirecto o de orden superior`:''}.</p>
      ${(()=>{const crit=Causal.criticalNodes();return crit.length?`<p><b>Nodos causales relevantes:</b> ${crit.map(c=>esc(Causal._label(c.node))).join(', ')}. Concentran múltiples rutas causales (convergencia/divergencia) y constituyen puntos estratégicos para el diseño de medidas. Este indicador es análisis complementario y no modifica la significancia.</p>`:'';})()}
      ${(()=>{const rc=Causal.mitigationReach().filter(r=>r.direct.length);return rc.length?`<p><b>Alcance de las medidas de mitigación.</b> Al actuar sobre la cadena causal, una medida puede beneficiar impactos adicionales aguas abajo:</p>
        <table class="rtbl"><thead><tr><th>Medida</th><th>Impactos atendidos</th><th>Impactos beneficiados aguas abajo</th></tr></thead><tbody>
        ${rc.map(r=>`<tr><td>${esc(r.measure)}</td><td>${r.direct.map(esc).join(', ')||'—'}</td><td>${r.downstream.map(esc).join(', ')||'—'}</td></tr>`).join('')}
        </tbody></table>`:'';})()}
    </section>`;
  },
  _impactMatrix(M,s){
    return `<section class="rblock rland">${Report._h('5','Matriz de caracterización y valoración de impactos')}
      <p>Caracterización de los ${s.valuedN} impactos valorados según los ${M.criteria.length} criterios del método ${esc(M.name)}.${M.family==='conesa'?' El valor mostrado por atributo incluye su modificador crítico cuando aplica.':''}</p>
      <table class="rtbl rsmall"><thead><tr><th>ID</th><th>Impacto</th><th>Etapa</th><th>N</th>${M.criteria.map(c=>`<th title="${esc(c.name)}">${c.code}</th>`).join('')}<th>${esc(M.scoreLabel||'I')}</th><th>Signif.</th></tr></thead><tbody>
        ${s.valued.sort((a,b)=>b.as.abs-a.as.abs).map(x=>{const a=Data.activity(x.imp.activity_id),st=a?Data.stageOf(a):null,ci=M.clsInfo(x.as.cls);
          return `<tr><td class="rmono">${esc(x.imp.id.slice(-6))}</td><td>${esc(x.imp.name)}</td><td>${esc(st?st.name:'—')}</td>
            <td class="rmono">${M.usesNature===false?(x.as.score>0?'+':(x.as.score<0?'−':'0')):(x.imp.nature==='POS'?'+':'−')}</td>
            ${M.criteria.map(c=>{const e=x.as.criteria[c.code]||{};return `<td class="rmono">${(e.value||0)+(e.modifier||0)}</td>`;}).join('')}
            <td class="rmono"><b>${fmtScore(M,x.as.score)}</b></td><td>${Report.fmtCls(x.as.cls)}</td></tr>`;}).join('')}
      </tbody></table>
    </section>`;
  },
  _sheets(M){
    const valued=DB.impacts.map(i=>({imp:i,as:Data.initialAssess(i.id)})).filter(x=>x.as&&x.as.complete).sort((a,b)=>b.as.abs-a.as.abs);
    return `<section class="rblock">${Report._h('6','Fichas de impacto y memoria de cálculo')}
      <p>Cada ficha documenta el impacto, su mecanismo causal, la sustitución algebraica que produce el valor de importancia y la justificación de cada atributo.</p>
      ${valued.map(x=>{const i=x.imp,as=x.as;const a=Data.activity(i.activity_id),f=Data.factor(i.factor_id),st=a?Data.stageOf(a):null;
        const r=M.calculate(as.criteria,i.nature);const ci=M.clsInfo(r.cls);
        return `<div class="rsheet">
          <div class="rsheet-hd"><div><span class="rmono rsmall">${esc(i.id.slice(-8))}</span><h3>${esc(i.name)}</h3></div>
            <div class="rsheet-score"><span class="rmono">${fmtScore(M,r.score)}</span>${Report.fmtCls(r.cls)}</div></div>
          <table class="rkv"><tbody>
            <tr><th>Etapa</th><td>${esc(st?st.name:'—')}</td><th>Actividad</th><td>${esc(a?a.name:'—')}</td></tr>
            <tr><th>Factor</th><td>${esc(f?f.name:'—')}</td>${M.usesNature!==false?`<th>Naturaleza</th><td>${i.nature==='POS'?'Positivo (+1)':'Negativo (−1)'}</td>`:(M.categories?`<th>Categoría</th><td>${esc(as.category||'—')}${as.category?' · '+esc((M.categories.find(c=>c.c===as.category)||{}).n||''):''}</td>`:`<th>Naturaleza</th><td>${(as.score!=null&&as.score<0)?'Adverso (M negativa)':((as.score!=null&&as.score>0)?'Benéfico (M positiva)':'—')}</td>`)}</tr>
            ${i.aspect_name?`<tr><th>Aspecto ambiental</th><td colspan="3">${esc(i.aspect_name)}${i.aspect_family?` <span class="muted">· ${esc(i.aspect_family)}</span>`:''}</td></tr>`:''}
            ${i.receptor?`<tr><th>Receptor</th><td colspan="3">${esc(i.receptor)}</td></tr>`:''}
            ${i.description?`<tr><th>Descripción</th><td colspan="3">${esc(i.description)}</td></tr>`:''}
            ${i.causal_mechanism?`<tr><th>Mecanismo causal</th><td colspan="3">${esc(i.causal_mechanism)}</td></tr>`:''}
          </tbody></table>
          <div class="rmemory">
            <div class="rmem-t">Memoria de cálculo</div>
            <div class="rmono">${esc(M.scoreLabel||'I')} = ${esc(M.equation.replace(/^[A-Za-z]+\s*=\s*/,''))}</div>
            ${r.memory.lines.map(l=>`<div class="rmono">${esc(l)}</div>`).join('')}
            <div class="rmono"><b>${esc(r.memory.result)}</b> → ${ci.label.toUpperCase()}</div>
          </div>
          <table class="rtbl rsmall" style="margin-top:8px"><thead><tr><th>Atr.</th><th>Cat.</th><th>Val.</th><th>Justificación</th><th>Fuente</th></tr></thead><tbody>
            ${M.criteria.map(c=>{const e=as.criteria[c.code]||{};return `<tr><td><b>${c.code}</b></td><td>${esc(e.category||'—')}</td><td class="rmono">${(e.value||0)+(e.modifier||0)}</td><td>${esc(e.justification||'—')}</td><td>${esc(e.source||'—')}</td></tr>`;}).join('')}
          </tbody></table>
        </div>`;}).join('')}
    </section>`;
  },
  _results(M,s){
    const pct=(n)=>s.valuedN?Math.round(n/s.valuedN*100):0;
    return `<section class="rblock">${Report._h('7','Resultados globales')}
      <p>De un total de ${s.total} impacto(s) identificados, ${s.valuedN} fueron valorados: ${s.neg} negativo(s) y ${s.pos} positivo(s). La distribución por significancia es:</p>
      <table class="rtbl"><thead><tr><th>Significancia</th><th>Cantidad</th><th>Porcentaje</th></tr></thead><tbody>
        ${M.classes.filter(c=>(s.byCls[c.id]||0)>0).map(c=>`<tr><td>${esc(c.label)}</td><td class="rmono">${s.byCls[c.id]}</td><td class="rmono">${pct(s.byCls[c.id])}%</td></tr>`).join('')}
        <tr class="rtot"><td><b>Total valorados</b></td><td class="rmono"><b>${s.valuedN}</b></td><td class="rmono">100%</td></tr>
      </tbody></table></section>`;
  },
  _priority(M){
    const sev=M.severeIds||[];
    const pri=DB.impacts.map(i=>({imp:i,as:Data.initialAssess(i.id)})).filter(x=>x.as&&x.as.complete&&isNeg(x.imp,x.as,M)&&sev.includes(x.as.cls)).sort((a,b)=>b.as.abs-a.as.abs);
    if(!pri.length)return `<section class="rblock">${Report._h('8','Impactos prioritarios')}<p>No se identificaron impactos negativos de mayor significancia que requieran atención prioritaria.</p></section>`;
    return `<section class="rblock">${Report._h('8','Impactos prioritarios')}
      <p>Los siguientes impactos negativos, por su mayor significancia, constituyen la prioridad para el diseño de medidas ambientales:</p>
      <table class="rtbl"><thead><tr><th>Impacto</th><th>Actividad</th><th>Factor</th><th>${esc(M.scoreLabel||'I')}</th><th>Significancia</th></tr></thead><tbody>
        ${pri.map(x=>{const a=Data.activity(x.imp.activity_id),f=Data.factor(x.imp.factor_id);return `<tr><td>${esc(x.imp.name)}</td><td>${esc(a?a.name:'—')}</td><td>${esc(f?f.name:'—')}</td><td class="rmono">${fmtScore(M,x.as.score)}</td><td>${Report.fmtCls(x.as.cls)}</td></tr>`;}).join('')}
      </tbody></table></section>`;
  },
  _measures(M){
    if(!DB.measures.length)return `<section class="rblock">${Report._h('9','Medidas ambientales')}<p>No se han registrado medidas ambientales.</p></section>`;
    return `<section class="rblock">${Report._h('9','Medidas ambientales')}
      <p>Se proponen ${DB.measures.length} medida(s) para prevenir, mitigar, corregir o compensar los impactos identificados:</p>
      ${DB.measures.map(m=>{const t=(MEASURE_TYPES.find(x=>x[0]===m.type)||[])[1]||'Medida';const imps=(m.impact_ids||[]).map(id=>Data.impact(id)).filter(Boolean);
        return `<div class="rmeasure"><div class="rsubh">${esc(m.name)} <span class="rtag">${t}</span></div>
          <table class="rkv"><tbody>
            ${m.description?`<tr><th>Descripción</th><td colspan="3">${esc(m.description)}</td></tr>`:''}
            ${m.objective?`<tr><th>Objetivo</th><td>${esc(m.objective)}</td><th>Indicador</th><td>${esc(m.indicator||'—')}</td></tr>`:''}
            ${m.responsible?`<tr><th>Responsable</th><td colspan="3">${esc(m.responsible)}</td></tr>`:''}
            <tr><th>Impactos atendidos</th><td colspan="3">${imps.map(i=>esc(i.name)).join('; ')||'—'}</td></tr>
          </tbody></table></div>`;}).join('')}
    </section>`;
  },
  _residual(M){
    const withRes=DB.impacts.map(i=>({i,init:Data.initialAssess(i.id),res:Data.residualAssess(i.id)})).filter(x=>x.init&&x.init.complete&&x.res&&x.res.complete);
    if(!withRes.length)return '';
    return `<section class="rblock">${Report._h('10','Evaluación de impactos residuales')}
      <p>Tras la aplicación de las medidas, se recaracterizaron los impactos. La comparación inicial–residual es:</p>
      <table class="rtbl"><thead><tr><th>Impacto</th><th>${esc(M.scoreLabel||'I')} inicial</th><th>Significancia</th><th>${esc(M.scoreLabel||'I')} residual</th><th>Significancia</th><th>Δ|${esc(M.scoreLabel||'I')}|</th></tr></thead><tbody>
        ${withRes.map(x=>`<tr><td>${esc(x.i.name)}</td><td class="rmono">${fmtScore(M,x.init.score)}</td><td>${Report.fmtCls(x.init.cls)}</td><td class="rmono">${fmtScore(M,x.res.score)}</td><td>${Report.fmtCls(x.res.cls)}</td><td class="rmono">${Math.abs(x.init.score)-Math.abs(x.res.score)>1e-9?'−'+fmtMag(M,Math.abs(x.init.score)-Math.abs(x.res.score)):'0'}</td></tr>`).join('')}
      </tbody></table></section>`;
  },
  _conclusions(M,s){
    const sev=M.severeIds||[];
    let dom='—',domN=-1; M.classes.forEach(c=>{const n=s.byCls[c.id]||0;if(n>domN){domN=n;dom=c.label;}});
    const distr=M.classes.filter(c=>(s.byCls[c.id]||0)>0).map(c=>`${s.byCls[c.id]} ${c.label}`).join(', ')||'sin valoraciones';
    const pri=DB.impacts.map(i=>({imp:i,as:Data.initialAssess(i.id)})).filter(x=>x.as&&x.as.complete&&isNeg(x.imp,x.as,M)&&sev.includes(x.as.cls)).length;
    return `<section class="rblock">${Report._h('11','Conclusiones')}
      <p>La evaluación mediante ${esc(M.name)} identificó ${s.total} impacto(s), de los cuales ${s.valuedN} fueron valorados: ${s.neg} negativo(s), ${s.pos} positivo(s)${s.neu?' y '+s.neu+' neutro(s)':''}. La distribución por significancia es: ${distr}. La clase predominante es ${dom.toLowerCase()}.</p>
      <p>${pri?`Se identificaron ${pri} impacto(s) negativo(s) de significancia severa o crítica que concentran las medidas ambientales propuestas.`:'No se identificaron impactos negativos severos o críticos.'} ${DB.measures.length?`Se proponen ${DB.measures.length} medida(s) ambiental(es) para el manejo de los impactos.`:''} El presente análisis conserva la trazabilidad completa de cada valoración —dato, criterio, justificación, evidencia y versión metodológica— conforme a los requisitos de un estudio de impacto ambiental reproducible.</p>
      <div class="rsign"><div class="rsign-line">${esc(DB.project.responsible||'')}</div><div class="rsign-lbl">Responsable de la evaluación ambiental${DB.project.cedula?`<br>Cédula profesional: ${esc(DB.project.cedula)}`:''}</div></div>
    </section>`;
  }
};

function boot(){
  Method.populateSelector();
  const saved=Persist.restore();
  if(saved && saved.impacts && (saved.impacts.length || (saved.project&&saved.project.name))){
    DB=migrate(saved); ACTIVE_METHOD=DB.method||'CONESA-STD-01'; recalcAll();
    Nav.render(); Router.go('project');
    Toast.show('Se restauró tu último proyecto en curso','info',4000);
  } else {
    DB=blankProject(); Nav.render(); Router.go('project');
  }
  // input de archivo
  $('#fileInput').addEventListener('change',(e)=>{ if(e.target.files[0]) Persist.loadFile(e.target.files[0]); });
  // atajo guardar
  document.addEventListener('keydown',(e)=>{ if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();Persist.save();} });
}
document.addEventListener('DOMContentLoaded',boot);
</script>
