      const xi0=cx+inner*Math.cos(a0),yi0=cy+inner*Math.sin(a0),xi1=cx+inner*Math.cos(a1),yi1=cy+inner*Math.sin(a1);
      const large=(a1-a0)>Math.PI?1:0;
      return `<path d="M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1} L${xi1} ${yi1} A${inner} ${inner} 0 ${large} 0 ${xi0} ${yi0} Z" fill="${d.color}"><title>${d.label}: ${d.value}</title></path>`;
    }).join('');
    return `<div class="chart"><svg viewBox="0 0 ${size} ${size}" width="${size}">${CHART_CSS}${arcs}<text x="${cx}" y="${cy-4}" text-anchor="middle" class="val" style="font-size:22px">${total}</text><text x="${cx}" y="${cy+13}" text-anchor="middle" class="lbl" style="font-size:9px">impactos</text></svg></div>`;
  },
  // Versión SVG autónoma del pastel (con leyenda dentro) para exportar a PNG
  pieFigureSVG(title,data){
    const pd=180,r=pd/2-4,cx=16+pd/2,cyTop=34,cy=cyTop+pd/2;
    const total=data.reduce((a,d)=>a+(d.value||0),0)||1; let ang=-Math.PI/2; let slices='';

      const large=(a1-a0)>Math.PI?1:0,mid=(a0+a1)/2,lr=r*0.6,lx=cx+lr*Math.cos(mid),ly=cy+lr*Math.sin(mid),pct=Math.round(frac*100);
      slices+=`<path d="M${cx} ${cy} L${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1} Z" fill="${d.color}" stroke="#fff" stroke-width="1.5"/>`;

    const legend=data.map(d=>{const pct=Math.round((d.value/total)*100);const s=`<rect x="${legX}" y="${ly}" width="12" height="12" rx="2" fill="${d.color}"/><text x="${legX+18}" y="${ly+10}" style="font-size:11px;fill:#3A3F45;font-family:system-ui,Arial">${esc(d.label)} — ${d.value} · ${pct}%</text>`;ly+=20;return s;}).join('');
    const W=legX+legW+16,H=Math.max(cyTop+pd+16,ly+8);

  },
  // Histograma por bandas (columnas verticales, orden fijo, color por banda) — para RIAM
  histogram(bands,opt={}){ // bands:[{label,value,color}] en orden −E … +E
    const w=opt.w||520,h=opt.h||236,padL=30,padR=10,padT=16,padB=28;
    const plotW=w-padL-padR,plotH=h-padT-padB,baseY=padT+plotH;

      `<text class="lbl" x="${padL-6}" y="${baseY+3}" text-anchor="end">0</text>`+

        `<rect x="${x}" y="${baseY-2}" width="${bw}" height="2" rx="1" fill="#E4E0D8"></rect>`)+

    const plotW=w-padL-padR,plotH=h-padT-padB,x0=padL,y0=padT,baseY=padT+plotH,rightX=padL+plotW;

    // Puntos (radio por nº de interacciones coincidentes)

        (p.count>1?`<text x="${cx}" y="${cy+3}" text-anchor="middle" style="font-size:9px;font-weight:700;fill:#fff">${p.count}</text>`:'');
    }).join('');
    return `<div class="chart"><svg viewBox="0 0 ${w} ${h}">${CHART_CSS}${shade}${grid}${frame}${labels}${pts}</svg></div>`;
  },
  // SVG de la matriz final de importancias (para exportar como imagen nítida)
  matrixSVG(){
    const M=getMethod(); const s=computeStats();
    const rows=s.valued.slice().sort((a,b)=>b.as.abs-a.as.abs);
    const clsHex={compat:'#3B8C4E',moder:'#B98700',sever:'#CF611B',critic:'#B02730'};

    const totalW=cols.reduce((a,c)=>a+c.w,0);
    const rowH=22,headH=26,pad=14,titleH=24;
    const W=totalW+pad*2, H=titleH+headH+Math.max(rows.length,1)*rowH+pad*2;
    const xs=[]; let x0=pad; cols.forEach(c=>{xs.push(x0);x0+=c.w;});
    const tr=(s,n)=>{s=s||'';return s.length>n?s.slice(0,n-1)+'…':s;};
    let y=titleH+pad;
    let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
      <style>text{font-family:system-ui,-apple-system,Arial,sans-serif;font-size:10px;fill:#1B1E22}.h{font-weight:700;fill:#4A4F56}.m{font-family:ui-monospace,'DejaVu Sans Mono',monospace}</style>
      <rect width="${W}" height="${H}" fill="#ffffff"/>

      <rect x="${pad}" y="${y}" width="${totalW}" height="${headH}" fill="#FAF9F6"/>`;
    cols.forEach((c,i)=>{const tx=c.a==='middle'?xs[i]+c.w/2:xs[i]+4;svg+=`<text class="h" x="${tx}" y="${y+17}" text-anchor="${c.a}">${esc(c.t)}</text>`;});
    y+=headH;
    rows.forEach((r,ri)=>{
      if(ri%2)svg+=`<rect x="${pad}" y="${y}" width="${totalW}" height="${rowH}" fill="#FAF9F6"/>`;
      const a=Data.activity(r.imp.activity_id),st=a?Data.stageOf(a):null,ci=M.clsInfo(r.as.cls);
      cols.forEach((c,i)=>{
        const tx=c.a==='middle'?xs[i]+c.w/2:xs[i]+4;
        if(c.k==='cls'){
          svg+=`<rect x="${xs[i]}" y="${y+3}" width="${c.w-5}" height="${rowH-6}" rx="7" fill="${clsLite[ci.cls]}"/>`;
          svg+=`<text x="${xs[i]+(c.w-5)/2}" y="${y+15}" text-anchor="middle" style="font-size:9px;font-weight:700;fill:${clsHex[ci.cls]}">${esc(ci.label)}</text>`;
          return;
        }
        let val,mono='';
        if(c.k==='imp')val=tr(r.imp.name,32);
        else if(c.k==='stage')val=tr(st?st.name:'—',17);
        else if(c.k==='N'){val=r.imp.nature==='POS'?'+':'−';mono='m';}
        else if(c.k==='I'){val=String(r.as.score);mono='m';}
        else{const e=r.as.criteria[c.k]||{};val=String((e.value||0)+(e.modifier||0));mono='m';}
        svg+=`<text ${mono?'class="m"':''} x="${tx}" y="${y+15}" text-anchor="${c.a}">${esc(val)}</text>`;
      });
      y+=rowH;
    });
    return svg+'</svg>';
  }
};

const ImgExport={
  SCALE:2.6,
  // Envuelve una gráfica (Chart.bar/stacked) con título, leyenda y fondo blanco -> SVG autónomo
  figure(title,chartHtml,legendCats){
    const svg=(chartHtml.match(/<svg[\s\S]*?<\/svg>/)||[chartHtml])[0];
    const vb=(svg.match(/viewBox="([^"]+)"/)||[])[1]||'0 0 460 300';
    const prt=vb.split(/[ ,]+/).map(Number); const cw=prt[2],ch=prt[3];
    const pad=16,titleH=26,legH=(legendCats&&legendCats.length)?24:0;
    const W=cw+pad*2,H=titleH+ch+legH+pad;
    let leg='';
    if(legendCats&&legendCats.length){let x=pad;const yy=titleH+ch+8;
      leg=legendCats.map(c=>{const seg=`<rect x="${x}" y="${yy}" width="12" height="12" rx="2" fill="${c.color}"/><text x="${x+16}" y="${yy+10}" style="font-size:11px;fill:#4A4F56;font-family:system-ui,Arial,sans-serif">${esc(c.label)}</text>`;x+=30+esc(c.label).length*6.2;return seg;}).join('');}
    const inner=svg.replace('<svg ',`<svg x="${pad}" y="${titleH}" width="${cw}" height="${ch}" `);
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="#ffffff"/><text x="${pad}" y="17" style="font-family:Georgia,serif;font-size:14px;font-weight:600;fill:#0A4744">${esc(title)}</text>${inner}${leg}</svg>`;
  },
  svgToPngBlob(svgString,scale){
    return new Promise((resolve,reject)=>{
      scale=scale||ImgExport.SCALE;
      if(!/xmlns=/.test(svgString)) svgString=svgString.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ');
      const vb=(svgString.match(/viewBox="([^"]+)"/)||[])[1]||'0 0 800 600';
      const p=vb.split(/[ ,]+/).map(Number); const w=p[2],h=p[3];
      const img=new Image();
      img.onload=()=>{try{
        const cv=document.createElement('canvas'); cv.width=Math.round(w*scale); cv.height=Math.round(h*scale);
        const ctx=cv.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,cv.width,cv.height);
        ctx.drawImage(img,0,0,cv.width,cv.height);
        cv.toBlob(b=>b?resolve(b):reject(new Error('toBlob')),'image/png');
      }catch(e){reject(e);}};
      img.onerror=()=>reject(new Error('SVG no pudo renderizarse'));
      img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgString);
    });
  },
  downloadBlob(blob,name){const a=el('a',{href:URL.createObjectURL(blob),download:name});document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();},100);},
  async downloadSvgAsPng(svgString,name){try{const b=await ImgExport.svgToPngBlob(svgString);ImgExport.downloadBlob(b,name);Toast.show('Imagen descargada: '+name);}catch(e){Toast.show('No se pudo generar la imagen','err');}}
};
// Empaquetador ZIP mínimo (método STORE, sin compresión) — sin librerías externas
const Zip={
  _crcTab:(function(){const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})(),
  crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=Zip._crcTab[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;},
  build(files){ // files:[{name,data:Uint8Array}]
    const enc=new TextEncoder();
    const u16=n=>[n&0xFF,(n>>8)&0xFF], u32=n=>[n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>24)&0xFF];
    let parts=[],central=[],offset=0;
    files.forEach(f=>{
      const nm=enc.encode(f.name),data=f.data,crc=Zip.crc32(data),sz=data.length;
      const lh=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(sz),u32(sz),u16(nm.length),u16(0));
      const la=new Uint8Array(lh.length+nm.length+sz); la.set(lh,0); la.set(nm,lh.length); la.set(data,lh.length+nm.length);
      parts.push(la);
      const cd=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(sz),u32(sz),u16(nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
      const ca=new Uint8Array(cd.length+nm.length); ca.set(cd,0); ca.set(nm,cd.length);
      central.push(ca); offset+=la.length;
    });
    const cdSize=central.reduce((a,c)=>a+c.length,0);
    const end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cdSize),u32(offset),u16(0)));
    return new Blob([...parts,...central,end],{type:'application/zip'});
  }
};

/* ---------- 08 · RESULTADOS ---------- */
function computeStats(){
  const M=getMethod();
  const valued=DB.impacts.map(i=>({imp:i,as:Data.initialAssess(i.id)})).filter(x=>x.as&&x.as.complete);
  const byCls={}; M.classes.forEach(c=>byCls[c.id]=0);
  let neg=0,pos=0,neu=0,sumAbs=0;
  valued.forEach(x=>{
    if(byCls[x.as.cls]==null)byCls[x.as.cls]=0; byCls[x.as.cls]++;
    // signo por método: RIAM por el score; Conesa/Bojórquez por la naturaleza del impacto
    const sign = M.usesNature===false ? Math.sign(x.as.score) : (x.imp.nature==='POS'?1:(x.imp.nature==='NEG'?-1:0));
    if(sign>0)pos++; else if(sign<0)neg++; else neu++;
    sumAbs+=x.as.abs;
  });
  return {M,valued,total:DB.impacts.length,valuedN:valued.length,byCls,neg,pos,neu,sumAbs};
}

    const clsCats=M.classes.map(c=>({key:c.id,label:c.label,color:c.color||({compat:Chart.colors.compat,moder:Chart.colors.moder,sever:Chart.colors.sever,critic:Chart.colors.critic,pos:Chart.colors.pos,gray:'#9AA0A6'})[c.cls]||Chart.colors.brand}));

    // Todas las bandas en orden (−E … +E) para el histograma RIAM
    const bandData=M.classes.slice().reverse().map(c=>({label:c.id,value:s.byCls[c.id]||0,color:c.color||({compat:Chart.colors.compat,moder:Chart.colors.moder,sever:Chart.colors.sever,critic:Chart.colors.critic,pos:Chart.colors.pos,gray:'#9AA0A6'})[c.cls]||Chart.colors.brand}));

      scatterData=Object.values(agg).map(p=>({...p,color:clsHex[(M.clsInfo(p.cls)||{}).cls]||Chart.colors.brand}));

    return {s,clsCats,clsData,stageRows,medRows,actData,bandData,scatterData,canonCats,canonDist,stageRowsC,medRowsC,sigPie,compDist};
  },
  /* ---- Tablas resumen cruzadas (por etapa / por componente ambiental) ---- */
  summaryRows(groupFn){

      const g=groupFn(x); if(!g)return;
      let b=map[g.key]; if(!b){b=map[g.key]={label:g.label,order:(g.order==null?999:g.order),c:0,m:0,s:0,cr:0,p:0,neu:0};}
      const cls=(M.clsInfo(x.as.cls)||{}).cls;
      if(x.imp.nature==='POS'||cls==='pos')b.p++;
      else if(cls==='compat')b.c++;
      else if(cls==='moder')b.m++;
      else if(cls==='sever')b.s++;
      else if(cls==='critic')b.cr++;
      else b.neu++;
    });
    return Object.values(map).sort((a,b)=>a.order-b.order||((b.c+b.m+b.s+b.cr+b.p+b.neu)-(a.c+a.m+a.s+a.cr+a.p+a.neu)));
  },
  _sumStyle:'<style>.sumtbl{border-collapse:collapse;width:100%;font-size:13px}.sumtbl th,.sumtbl td{border:1px solid var(--line);padding:6px 9px;text-align:center}.sumtbl .lhead{background:#f1f3f5;text-align:left;vertical-align:middle;min-width:140px}.sumtbl .ghead{color:#fff;background:#5f6b7a;font-weight:700}.sumtbl .ghead.sumh,.sumtbl td.sumc{background:#eef1f4;color:var(--ink);font-weight:700}.sumtbl td.rlabel{text-align:left;font-weight:600;color:var(--ink-2)}.sumtbl tr.totrow td{background:#f1f3f5;font-weight:700}</style>',

  _gComp(){ return (x)=>{const f=Data.factor(x.imp.factor_id);const name=(f&&f.component)?f.component:'Sin componente ambiental';let order=999;if(f&&f.component){const comp=CATALOG.componentes.find(c=>c.n===f.component);if(comp){const mi=CATALOG.medios.findIndex(m=>m.c===comp.m);order=(mi<0?9:mi)*100+CATALOG.componentes.indexOf(comp);}}return {key:name,label:name,order};}; },

    const W=pad*2+tableW, bodyY=titleH+grpH+subH, H=bodyY+(rows.length+1)*rowH+pad;

    s+=box(gx,titleH,wNum,grpH,'#5f6b7a')+txt(gx+wNum/2,titleH+grpH/2,'POSITIVO',{fg:'#fff',fw:700,fs:9});
    s+=box(sumX,titleH,wSum,grpH+subH,'#eef1f4')+txt(sumX+wSum/2,titleH+(grpH+subH)/2,'SUMA',{fw:700});
    // sub-cabecera de columnas con color
    cols.forEach((c,i)=>{const x=startX+i*wNum;s+=box(x,titleH+grpH,wNum,subH,c.bg)+txt(x+wNum/2,titleH+grpH+subH/2,c.t,{fg:c.fg,fw:700});});
    // filas
    rows.forEach((r,ri)=>{const y=bodyY+ri*rowH;
      s+=box(pad,y,wLabel,rowH,'#fff')+txt(pad,y+rowH/2,r.label,{align:'left',fw:600,fg:'#3A3F45'});

    cols.forEach((c,i)=>{const x=startX+i*wNum;s+=box(x,yt,wNum,rowH,'#f1f3f5')+txt(x+wNum/2,yt+rowH/2,tot[c.k],{fw:700});});
    s+=box(sumX,yt,wSum,rowH,'#e7ecf1')+txt(sumX+wSum/2,yt+rowH/2,rs(tot),{fw:700});

    const F=(field,val,ph,ta)=> ta
      ? `<textarea oninput="PMA.set('${m.id}','${field}',this.value)" placeholder="${ph||''}">${esc(val||'')}</textarea>`
      : `<input type="text" value="${esc(val||'')}" oninput="PMA.set('${m.id}','${field}',this.value)" placeholder="${ph||''}">`;
    const sec=(t)=>`<div class="muted small" style="text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px;border-top:1px solid var(--line);padding-top:10px">${t}</div>`;
    const body=`
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px">
        <span class="chip ${PMA.outClass(m.out)}" id="fichaOut">${PMA.outNum(m)} · ${CatalogMed.outLabel(m.out)}</span>
        <span class="mono small muted">${esc(m.id.slice(-8))}</span>
        ${m.measure_code?`<span class="chip gray" title="Medida de la biblioteca">${esc(m.measure_code)}${m.adapted?' · adaptada':''}</span>`:'<span class="chip gray">medida propia</span>'}
      </div>
      ${sec('Identificación')}
      <div class="field"><label>Nombre de la medida</label>${F('name',m.name,'Nombre corto y claro')}</div>
      <div class="grid2">
        <div class="field"><label>Categoría (jerarquía de manejo)</label><select onchange="PMA.setCat('${m.id}',this.value)">${cats}</select>
          <div class="hint">Se traduce automáticamente a la categoría de salida (P/M/C/R) de SEMARNAT.</div></div>
        <div class="field"><label>Programa</label><select onchange="PMA.set('${m.id}','program_id',this.value)">${progs}</select></div>
      </div>
      <div class="field"><label>Impactos atendidos</label><div class="pill-row">${imps.map(i=>`<span class="chip gray">${esc(i.name)}</span>`).join('')||'<span class="muted small">Sin impactos enlazados</span>'}</div></div>
      ${sec('Aplicación')}
      <div class="grid2">
        <div class="field"><label>Etapa</label>${F('stage',m.stage,'Etapa del proyecto')}</div>
        <div class="field"><label>Responsable</label>${F('responsible',m.responsible,'Rol o puesto')}</div>
        <div class="field"><label>Receptor</label>${F('receptor',m.receptor,'Elemento sobre el que actúa')}</div>
        <div class="field"><label>Ubicación (si aplica)</label>${F('location',m.location,'Sitio / polígono / coordenadas')}</div>
      </div>
      ${sec('Diseño de la medida')}
      <div class="field"><label>Objetivo</label>${F('objective',m.objective,'Qué se busca lograr',true)}</div>
      <div class="field"><label>Descripción / procedimiento</label>${F('procedure',m.procedure,'Cómo se ejecuta',true)}</div>
      <div class="field"><label>Materiales / criterios técnicos</label>${F('materials',m.materials,'Equipo, insumos, criterios',true)}</div>
      ${sec('Programación')}
      <div class="grid2">
        <div class="field"><label>Inicio</label>${F('start',m.start,'Cuándo inicia')}</div>
        <div class="field"><label>Periodicidad</label>${F('periodicity',m.periodicity,'p. ej. durante toda la etapa')}</div>
        <div class="field"><label>Frecuencia</label><select onchange="PMA.set('${m.id}','frequency',this.value)">${freqs}</select></div>
        <div class="field"><label>Plazo / duración</label>${F('term',m.term,'Duración de aplicación')}</div>
      </div>
      ${sec('Recursos')}
      <div class="grid2">
        <div class="field"><label>Costo estimado</label>${F('cost',m.cost,'$ estimado')}</div>
        <div class="field"><label>Unidad / base del costo</label>${F('cost_unit',m.cost_unit,'p. ej. $/mes, $/ha')}</div>
      </div>
      ${sec('Control — indicadores (cumplimiento y eficacia separados)')}
      <div class="grid2">
        <div class="field"><label>Indicador de cumplimiento</label>${F('ic',m.ic,'¿La medida se ejecutó?',true)}</div>
        <div class="field"><label>Meta de cumplimiento</label>${F('icm',m.icm,'p. ej. ≥95%')}</div>
        <div class="field"><label>Indicador de eficacia</label>${F('ie',m.ie,'¿El impacto se evitó/redujo?',true)}</div>
        <div class="field"><label>Meta de eficacia</label>${F('iem',m.iem,'p. ej. 0 cárcavas activas')}</div>
      </div>
      <div class="field"><label>Método de verificación</label>${F('verification',m.verification,'Cómo se mide/comprueba',true)}</div>
      <div class="grid2">
        <div class="field"><label>Evidencia</label><select onchange="PMA.set('${m.id}','evidence',this.value)">${evis}</select></div>
        <div class="field"><label>Umbral de acción</label>${F('threshold',m.threshold,'Cuándo se activa una corrección')}</div>
      </div>
      ${sec('Respuesta')}
      <div class="field"><label>Acción correctiva sugerida</label>${F('corrective',m.corrective,'Qué hacer si no se cumple',true)}</div>
      <div class="field"><label>Medida alternativa / emergente</label>${F('alternative',m.alternative,'Si persiste el incumplimiento',true)}</div>
      ${sec('Trazabilidad')}
      <div class="grid2">
        <div class="field"><label>Fuente técnica / normativa</label>${F('source',m.source,'Norma, guía o referencia')}</div>
        <div class="field"><label>Observaciones</label>${F('note',m.note,'Notas del especialista')}</div>
      </div>`;
    const footer=`<button class="btn ghost danger" onclick="PMA.discard('${m.id}')">Quitar del PMA</button>
      <button class="btn" onclick="Modal.close();Router.refresh()">Guardar y cerrar</button>`;
    Modal.open('Ficha de medida', body, footer, true);
  }
};

Screens.pma=function(){
  const M=getMethod();
  if(!CatalogMed.ok()){
    return `<div class="page-head"><div class="titles"><div class="step-tag">Paso 11 · Manejo</div><h2>Plan de Manejo</h2></div></div>
      <div class="card"><div class="bd"><div class="empty"><div class="ic">❖</div><h4>Biblioteca de medidas no disponible</h4></div></div></div>`;
  }
  const toManage=Reco.impactsToManage();
  const withMeasure=new Set(); DB.measures.forEach(m=>(m.impact_ids||[]).forEach(id=>withMeasure.add(id)));
  const sinMedida=toManage.filter(im=>!withMeasure.has(im.id));
  const sig=toManage.filter(im=>Reco.significant(im));
  const totalEval=DB.impacts.filter(im=>{const a=Data.initialAssess(im.id);return a&&a.complete;}).length;
  const openCA=(DB.corrective||[]).filter(c=>!c.closed).length;
  const tabs=[['impactos','Impactos'],['medidas','Medidas'],['programas','Programas'],['vigilancia','Vigilancia (PVA)'],['acciones','Acciones correctivas'],['residual','Residual'],['exportar','Exportar']];
  const tabBar=`<div class="rowbtns" style="gap:6px;margin-bottom:14px;flex-wrap:wrap">${tabs.map(([k,l])=>`<button class="btn ${PMA._tab===k?'':'ghost'} sm" onclick="PMA.tab('${k}')">${l}${k==='medidas'&&DB.measures.length?` (${DB.measures.length})`:''}${k==='acciones'&&openCA?` <span class="chip critic" style="margin-left:4px">${openCA}</span>`:''}</button>`).join('')}</div>`;

  const head=`<div class="page-head"><div class="titles"><div class="step-tag">Paso 11 · Manejo</div><h2>Plan de Manejo</h2>
    <div class="sub">Continuación de la evaluación: recomienda, selecciona y documenta medidas. Biblioteca v${esc(CatalogMed.version())} · ${CatalogMed.measures().length} medidas.</div></div></div>
    <div class="stats">
      <div class="stat brand"><span class="bar"></span><div class="v">${totalEval}</div><div class="l">Impactos evaluados</div></div>
      <div class="stat brand"><span class="bar"></span><div class="v">${toManage.length}</div><div class="l">Requieren manejo</div></div>
      <div class="stat sever"><span class="bar"></span><div class="v">${sig.length}</div><div class="l">Significativos</div></div>
      <div class="stat critic"><span class="bar"></span><div class="v">${sinMedida.length}</div><div class="l">Sin medida</div></div>
    </div>${tabBar}`;

  if(!toManage.length && !DB.measures.length){
    return head+`<div class="card"><div class="bd"><div class="empty"><div class="ic">❖</div><h4>Sin impactos que requieran manejo</h4><p>Valora impactos negativos para que aparezcan aquí con medidas sugeridas.</p><button class="btn" onclick="Router.go('assess')">Ir a valoración</button></div></div></div>`;
  }

  if(PMA._tab==='impactos'){
    const rows=toManage.map(im=>{
      const a=Data.initialAssess(im.id); const ci=a?M.clsInfo(a.cls):null;
      const act=Data.activity(im.activity_id), f=Data.factor(im.factor_id), st=act?Data.stageOf(act):null;
      const applied=PMA.measuresOfImpact(im.id);
      const sugg=Reco.suggest(im);
      const suggBtns=sugg.principales.filter(x=>!applied.some(am=>am.measure_code===x.measure.c)).map(x=>{
        const out=CatalogMed.outCode(x.measure.tipo);
        return `<button class="btn ghost sm" style="margin:2px 3px 0 0" title="${esc(x.measure.obj||'')}" onclick="PMA.apply('${im.id}','${x.measure.c}')"><span class="chip ${PMA.outClass(out)}" style="margin-right:4px">${out}</span>${esc(x.measure.n)}</button>`;
      }).join('');
      const appliedChips=applied.map(am=>`<span class="chip ${PMA.outClass(am.out)}" style="cursor:pointer" onclick="PMA.ficha('${am.id}')" title="Abrir ficha">✓ ${PMA.outNum(am)} · ${esc(am.name)}</span>`).join(' ');
      return `<tr>
        <td><div class="mono small muted">${esc(im.impact_code||'—')}</div><b>${esc(im.name)}</b>
          <div class="small muted">${esc(st?st.name:'—')} › ${esc(act?act.name:'—')} · ${esc(f?f.name:'—')}${im.receptor?' · '+esc(im.receptor):''}</div></td>
        <td style="text-align:center">${ci?`<span class="chip ${ci.cls}">${ci.label}</span>`:'—'}</td>
        <td>
          ${appliedChips?`<div style="margin-bottom:6px">${appliedChips}</div>`:''}
          ${suggBtns||(applied.length?'':'<span class="muted small">Sin coincidencias en la biblioteca.</span>')}
          <div style="margin-top:6px"><button class="btn ghost sm" onclick="PMA.addCustom('${im.id}')">＋ Medida propia</button>
          ${sugg.alternativas.length?` <button class="btn ghost sm" onclick="PMA._showAlt('${im.id}')">Ver ${sugg.alternativas.length} alternativas</button>`:''}</div>
        </td>
      </tr>`;
    }).join('');
    return head+`<div class="card"><div class="hd"><h3>Impactos a manejar</h3><span class="desc">Aplica una medida recomendada o crea una propia</span></div><div class="bd" style="padding:0">
      <table class="tbl"><thead><tr><th style="width:42%">Impacto</th><th style="width:11%;text-align:center">Significancia</th><th>Medidas</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="3" class="muted small" style="padding:14px">Todos los impactos negativos ya tienen medida o no requieren manejo.</td></tr>'}</tbody></table>
    </div></div>
    <div class="small muted">El motor pondera coincidencia exacta de impacto, factor, receptor y etapa; respeta la naturaleza y eleva prioridad en impactos significativos o receptores sensibles.</div>`;
  }

  if(PMA._tab==='medidas'){
    if(!DB.measures.length) return head+`<div class="card"><div class="bd"><div class="empty"><div class="ic">⛨</div><h4>Aún no seleccionas medidas</h4><p>Ve a la pestaña Impactos y aplica medidas recomendadas, o crea una propia.</p><button class="btn" onclick="PMA.tab('impactos')">Ir a impactos</button></div></div></div>`;
    const rows=DB.measures.slice().sort((a,b)=>(a.seq||0)-(b.seq||0)).map(m=>{
      const imps=(m.impact_ids||[]).map(id=>Data.impact(id)).filter(Boolean);
      const prog=m.program_id?CatalogMed.program(m.program_id):null;
      const complete=m.name&&m.responsible&&m.ic&&m.ie;
      return `<tr>
        <td><span class="chip ${PMA.outClass(m.out)}">${PMA.outNum(m)}</span></td>
        <td><b>${esc(m.name||'(sin nombre)')}</b><div class="small muted">${esc(m.cat)}${m.measure_code?' · '+esc(m.measure_code)+(m.adapted?' adaptada':''):' · propia'}${prog?' · '+esc(prog.c):''}</div>
          <div class="pill-row" style="margin-top:3px">${imps.map(i=>`<span class="chip gray">${esc(i.name)}</span>`).join('')||'<span class="muted small">sin impacto</span>'}</div></td>
        <td style="text-align:center">${complete?'<span class="chip compat">Completa</span>':'<span class="chip moder">Falta info</span>'}</td>
        <td style="text-align:center"><button class="btn ghost sm" onclick="PMA.ficha('${m.id}')">Abrir ficha</button></td>
      </tr>`;
    }).join('');
    return head+`<div class="card"><div class="hd"><h3>Medidas del proyecto</h3><button class="btn ghost sm" onclick="PMA.addCustom()">＋ Medida propia</button></div><div class="bd" style="padding:0">
      <table class="tbl"><thead><tr><th style="width:70px">Código</th><th>Medida</th><th style="width:110px;text-align:center">Estado</th><th style="width:120px;text-align:center">Ficha</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div></div>
    <div class="small muted">Una medida "Completa" tiene nombre, responsable y los dos indicadores (cumplimiento y eficacia). El código P/M/C/R se numera automáticamente.</div>`;
  }

  if(PMA._tab==='vigilancia'){
    const withInd=DB.measures.filter(m=>m.ic||m.ie);
    const st=k=>PVA.stateInfo[k]||PVA.stateInfo[''];
    let c={CUMPLE:0,PARCIAL:0,NOCUMPLE:0,'':0};
    withInd.forEach(m=>{const s=PVA.latestState(m.id);c[s]=(c[s]||0)+1;});
    if(!withInd.length) return head+`<div class="card"><div class="bd"><div class="empty"><div class="ic">◎</div><h4>Sin indicadores que vigilar</h4><p>Define medidas con indicadores de cumplimiento y eficacia en la pestaña Medidas para darles seguimiento aquí.</p><button class="btn" onclick="PMA.tab('medidas')">Ir a medidas</button></div></div></div>`;
    const rows=withInd.map(m=>{
      const evs=PVA.events(m.id); const last=evs[0]; const s=st(PVA.latestState(m.id));
      return `<tr>
        <td><span class="chip ${PMA.outClass(m.out)}">${PMA.outNum(m)}</span> <b>${esc(m.name||'(sin nombre)')}</b>
          <div class="small muted">${m.frequency?esc(m.frequency)+' · ':''}${m.responsible?'Resp.: '+esc(m.responsible):'sin responsable'}</div></td>
        <td class="small">${m.ie?`<div><b>Eficacia:</b> ${esc(m.ie)} ${m.iem?`<span class="muted">(meta ${esc(m.iem)})</span>`:''}</div>`:''}${m.ic?`<div><b>Cumplim.:</b> ${esc(m.ic)} ${m.icm?`<span class="muted">(meta ${esc(m.icm)})</span>`:''}</div>`:''}</td>
        <td style="text-align:center"><span class="chip ${s.c}">${s.l}</span>${evs.length?`<div class="small muted" style="margin-top:3px">${evs.length} evento(s)</div>`:''}</td>
        <td class="small">${last?`${esc(last.date||'—')}: ${esc((last.result||'').slice(0,40))}`:'<span class="muted">Sin registros</span>'}</td>
        <td style="text-align:center"><button class="btn ghost sm" onclick="PVA.register('${m.id}')">Registrar</button></td>
      </tr>`;
    }).join('');
    return head+`<div class="stats">
        <div class="stat compat"><span class="bar"></span><div class="v">${c.CUMPLE||0}</div><div class="l">Cumple</div></div>
        <div class="stat moder"><span class="bar"></span><div class="v">${c.PARCIAL||0}</div><div class="l">Parcial</div></div>
        <div class="stat critic"><span class="bar"></span><div class="v">${c.NOCUMPLE||0}</div><div class="l">No cumple</div></div>
        <div class="stat"><span class="bar"></span><div class="v">${c['']||0}</div><div class="l">Sin dato</div></div>
      </div>
      <div class="card"><div class="hd"><h3>Matriz de seguimiento (PVA)</h3><span class="desc">Indicador · meta · resultado · semáforo</span></div><div class="bd" style="padding:0">
      <table class="tbl"><thead><tr><th style="width:30%">Medida</th><th>Indicadores y metas</th><th style="width:110px;text-align:center">Estado</th><th>Último resultado</th><th style="width:110px;text-align:center">Acción</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>
      <div class="small muted">El semáforo refleja el último resultado registrado. Registrar "No cumple" genera automáticamente una acción correctiva; "Parcial" genera una observación. El color no reemplaza el juicio técnico.</div>`;
  }

  if(PMA._tab==='acciones'){
    const cas=(DB.corrective||[]).slice().sort((a,b)=>(a.closed?1:0)-(b.closed?1:0)||(b.created_at||'').localeCompare(a.created_at||''));
    if(!cas.length) return head+`<div class="card"><div class="bd"><div class="empty"><div class="ic">⚑</div><h4>Sin acciones correctivas</h4><p>Se crean automáticamente cuando un evento de vigilancia no cumple la meta.</p><button class="btn" onclick="PMA.tab('vigilancia')">Ir a vigilancia</button></div></div></div>`;
    const sevChip={obligatoria:'critic',observacion:'moder',persistente:'critic'};
    const rows=cas.map(ca=>{
      const m=PMA.measure(ca.measure_id);
      return `<tr class="${ca.closed?'':''}">
        <td><b>${m?esc(m.name):'(medida)'}</b> ${m?`<span class="chip ${PMA.outClass(m.out)}">${PMA.outNum(m)}</span>`:''}
          <div class="small">${esc(ca.action||'—')}</div>${ca.note?`<div class="small muted">${esc(ca.note)}</div>`:''}</td>
        <td class="small">${ca.responsible?esc(ca.responsible):'<span class="muted">sin responsable</span>'}${ca.due?`<div class="muted">vence: ${esc(ca.due)}</div>`:''}</td>
        <td style="text-align:center"><span class="chip ${sevChip[ca.severity]||'moder'}">${ca.severity==='observacion'?'Observación':ca.severity==='persistente'?'Persistente':'Obligatoria'}</span></td>
        <td style="text-align:center">${ca.closed?`<span class="chip compat">Cerrada</span>${ca.closed_date?`<div class="small muted">${esc(ca.closed_date)}</div>`:''}`:'<span class="chip moder">Abierta</span>'}</td>
        <td style="text-align:center"><button class="btn ghost sm" onclick="PVA.editCA('${ca.id}')">Editar</button>${ca.closed?`<button class="btn ghost sm" onclick="PVA.reopenCA('${ca.id}')">Reabrir</button>`:`<button class="btn ghost sm" onclick="PVA.closeCA('${ca.id}')">Cerrar</button>`}</td>
      </tr>`;
    }).join('');
    return head+`<div class="card"><div class="hd"><h3>Acciones correctivas</h3><span class="desc">${cas.filter(c=>!c.closed).length} abierta(s) · ${cas.length} total</span></div><div class="bd" style="padding:0">
      <table class="tbl"><thead><tr><th style="width:40%">Medida / acción</th><th>Responsable</th><th style="width:120px;text-align:center">Tipo</th><th style="width:120px;text-align:center">Estado</th><th style="width:150px;text-align:center">Gestión</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>
      <div class="small muted">Asigna responsable y plazo, y cierra la acción con evidencia. Si un incumplimiento persiste tras la corrección, se marca "Persistente" para sugerir una medida alternativa.</div>`;
  }

  if(PMA._tab==='residual'){
    const clsIdx=(cls)=>M.classes.findIndex(c=>c.id===cls);
    const list=DB.impacts.filter(i=>{const a=Data.initialAssess(i.id);return a&&a.complete&&Reco.natureOf(i)==='NEG';})
      .sort((x,y)=>{const ax=Data.initialAssess(x.id),ay=Data.initialAssess(y.id);return (ay?ay.abs:0)-(ax?ax.abs:0);});
    if(!list.length) return head+`<div class="card"><div class="bd"><div class="empty"><div class="ic">↻</div><h4>Sin impactos negativos evaluados</h4><p>La evaluación residual re-caracteriza los impactos negativos tras aplicar las medidas.</p><button class="btn" onclick="Router.go('assess')">Ir a valoración</button></div></div></div>`;
    let done=0,reduced=0,pending=0;
    const rows=list.map(i=>{
      const init=Data.initialAssess(i.id), res=Data.residualAssess(i.id);
      const ci=M.clsInfo(init.cls); const hasRes=res&&res.complete; const cr=hasRes?M.clsInfo(res.cls):null;
      if(hasRes){done++; if(clsIdx(res.cls)<clsIdx(init.cls))reduced++;} else pending++;
      const ms=DB.measures.filter(m=>(m.impact_ids||[]).includes(i.id));
      const delta=hasRes?(Math.abs(res.score)<Math.abs(init.score)?`<span style="color:var(--compat);font-weight:600">↓ ${fmtMag(M,Math.abs(init.score)-Math.abs(res.score))}</span>`:(Math.abs(res.score)>Math.abs(init.score)?`<span style="color:var(--critic)">↑</span>`:'—')):'';
      const clsChange=hasRes&&clsIdx(res.cls)<clsIdx(init.cls)?`<div class="small" style="color:var(--compat)">baja de severidad</div>`:'';
      return `<tr>
        <td><b>${esc(i.name)}</b><div class="pill-row" style="margin-top:3px">${ms.map(m=>`<span class="chip ${PMA.outClass(m.out)}" style="cursor:pointer" onclick="PMA.ficha('${m.id}')">${PMA.outNum(m)}</span>`).join('')||'<span class="muted small">sin medida — el residual quedaría igual al inicial</span>'}</div></td>
        <td class="center"><span class="chip ${ci.cls}">${fmtScore(M,init.score)} · ${ci.label}</span></td>
        <td class="center">${hasRes?`<span class="chip ${cr.cls}">${fmtScore(M,res.score)} · ${cr.label}</span>${clsChange}`:'<span class="chip gray">Pendiente</span>'}</td>
        <td class="center">${delta}</td>
        <td class="center"><button class="btn ghost sm" onclick="Assess.type='RESIDUAL';Assess.edit('${i.id}','RESIDUAL')">${hasRes?'Editar':'Evaluar'}</button>${hasRes?` <button class="btn ghost sm" onclick="Screens._compareResidual('${i.id}')">Comparar</button>`:''}</td>
      </tr>`;
    }).join('');
    return head+`<div class="stats">
        <div class="stat brand"><span class="bar"></span><div class="v">${list.length}</div><div class="l">Impactos a re-evaluar</div></div>
        <div class="stat compat"><span class="bar"></span><div class="v">${done}</div><div class="l">Residual hecho</div></div>
        <div class="stat compat"><span class="bar"></span><div class="v">${reduced}</div><div class="l">Bajan de severidad</div></div>
        <div class="stat moder"><span class="bar"></span><div class="v">${pending}</div><div class="l">Pendientes</div></div>
      </div>
      <div class="card"><div class="hd"><h3>Evaluación residual (inicial → residual)</h3><span class="desc">Re-caracterización tras medidas</span></div><div class="bd" style="padding:0">
      <table class="tbl"><thead><tr><th style="width:38%">Impacto y medidas</th><th class="center">Inicial</th><th class="center">Residual</th><th class="center">Δ|${esc(M.scoreLabel||'I')}|</th><th class="center" style="width:170px">Acción</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>
      <div class="small muted">El residual <b>no</b> se obtiene reduciendo un porcentaje: se vuelven a caracterizar los criterios que las medidas modifican. La importancia/relevancia del receptor puede permanecer alta aunque baje la magnitud.</div>`;
  }

  if(PMA._tab==='exportar'){
    const nM=DB.measures.length, nInd=DB.measures.filter(m=>m.ic||m.ie).length;
    const card=(title,desc,btns)=>`<div class="card"><div class="hd"><h3>${title}</h3><span class="desc">${desc}</span></div><div class="bd"><div class="rowbtns">${btns}</div></div></div>`;
    const w=(fn,l)=>`<button class="btn ghost sm" onclick="PMAExport.${fn}()">▤ ${l}</button>`;
    return head+`<div class="alert" style="margin-bottom:16px;background:var(--surface-2)"><span class="ai">▤</span><span>Los formatos Word (.doc) y Excel (.xls) se generan sin conexión y se abren nativamente en Office o LibreOffice. El perfil de salida es SEMARNAT (P/M/C/R); la estructura es genérica y adaptable a otras guías.</span></div>
    ${card('Tabla del Capítulo IV (SEMARNAT)','Impactos + caracterización + medidas + parámetros de verificación',w('cap4Word','Word')+w('cap4Xls','Excel'))}
    ${card('Fichas de medidas',`${nM} medida(s) · ficha completa por medida`,w('fichasWord','Word'))}
    ${card('Programa de Vigilancia Ambiental (PVA)',`${nInd} medida(s) con indicadores · matriz de seguimiento`,w('pvaWord','Word')+w('pvaXls','Excel'))}
    ${card('Cronograma','Medidas por etapa del proyecto',w('cronoWord','Word')+w('cronoXls','Excel'))}
    ${card('Valoración económica','Costos de las medidas y total',w('costWord','Word')+w('costXls','Excel'))}
    ${card('Comparativo inicial → residual','Efectividad de las medidas por impacto',w('residualWord','Word')+w('residualXls','Excel'))}
    <div class="card" style="border-color:var(--brand)"><div class="hd"><h3>Plan de Manejo completo</h3><span class="desc">Todas las secciones en un documento</span></div><div class="bd"><div class="rowbtns"><button class="btn" onclick="PMAExport.fullWord()">▤ Descargar Word completo</button></div></div></div>`;
  }

  // programas (editable) — mover medidas entre programas y crear programas propios
  const groups={}; DB.measures.forEach(m=>{const k=m.program_id||'';(groups[k]=groups[k]||[]).push(m);});
  const rowMove=(m)=>`<tr>
      <td><span class="chip ${PMA.outClass(m.out)}" style="cursor:pointer" onclick="PMA.ficha('${m.id}')" title="Abrir ficha">${PMA.outNum(m)}</span> ${esc(m.name||'(sin nombre)')}</td>
      <td style="width:250px;text-align:right"><select onchange="PMA.setProgram('${m.id}',this.value)" style="max-width:240px">${PMA.progOptions(m.program_id)}</select></td>
    </tr>`;
  const progCards=Object.keys(groups).filter(k=>k).sort().map(pid=>{
    const p=PMA.program(pid); const code=p?(p.c||p.code||pid):pid; const name=p?(p.n||p.name||''):'(programa desconocido)';
    const obj=p?(p.obj||p.objective||''):''; const custom=!!(p&&(p.custom||!CatalogMed.program(pid)));
    return `<div class="card"><div class="hd"><h3>${esc(code)} · ${esc(name)}</h3>
      <div style="display:flex;gap:8px;align-items:center"><span class="desc">${groups[pid].length} medida(s)</span>${custom?`<button class="iconbtn" title="Editar programa propio" onclick="PMA.editProgram('${pid}')">✎</button>`:''}</div></div>
      <div class="bd" style="padding:8px 14px">${obj?`<p class="small muted" style="margin-top:0">${esc(obj)}</p>`:''}
        <table class="tbl"><tbody>${groups[pid].map(rowMove).join('')}</tbody></table></div></div>`;
  }).join('');
  const noProg=groups[''];
  const noProgCard=noProg&&noProg.length?`<div class="card"><div class="hd"><h3>Sin programa asignado</h3><span class="desc">${noProg.length}</span></div>
    <div class="bd" style="padding:8px 14px"><table class="tbl"><tbody>${noProg.map(rowMove).join('')}</tbody></table></div></div>`:'';
  return head+`<div class="rowbtns" style="margin-bottom:12px"><button class="btn ghost sm" onclick="PMA.addProgram()">＋ Programa propio</button></div>`+
    (progCards||'<div class="card"><div class="bd"><p class="muted small">Aún no hay medidas agrupadas. Al aplicar medidas desde la biblioteca se agrupan solas por programa; también puedes crear un programa propio y mover medidas con el selector de la derecha.</p></div></div>')+
    noProgCard;
};
Screens._pmaShowAltHolder=1;
// ---- Fase 5: programas (biblioteca + propios) ----
PMA.program=function(id){ if(!id)return null; return CatalogMed.program(id)||(DB.pma_programs||[]).find(p=>p.id===id||p.code===id)||null; };
PMA.progOptions=function(sel){
  const lib=CatalogMed.programs().map(p=>`<option value="${esc(p.c)}" ${sel===p.c?'selected':''}>${esc(p.c)} · ${esc(p.n)}</option>`).join('');
  const cust=(DB.pma_programs||[]).map(p=>`<option value="${esc(p.id)}" ${sel===p.id?'selected':''}>${esc(p.code||'PMA-*')} · ${esc(p.name)} · propio</option>`).join('');
  return `<option value="">— Sin programa —</option>`+lib+cust;
};
PMA.setProgram=function(mid,pid){ const m=PMA.measure(mid); if(!m)return; m.program_id=pid; if(m.measure_code)m.adapted=true; touch(); Router.refresh(); };
PMA.addProgram=function(){
  Modal.open('Nuevo programa propio',
    `<div class="field"><label>Código</label><input id="pgCode" placeholder="p. ej. PMA-13"></div>
     <div class="field"><label>Nombre</label><input id="pgName" placeholder="Nombre del programa"></div>
     <div class="field"><label>Objetivo / alcance</label><textarea id="pgObj" placeholder="Propósito del programa"></textarea></div>`,
    `<button class="btn ghost" onclick="Modal.close()">Cancelar</button><button class="btn" onclick="PMA.saveProgram()">Crear</button>`);
};
PMA.editProgram=function(id){
  const p=(DB.pma_programs||[]).find(x=>x.id===id); if(!p)return;
  Modal.open('Editar programa propio',
    `<div class="field"><label>Código</label><input id="pgCode" value="${esc(p.code||'')}"></div>
     <div class="field"><label>Nombre</label><input id="pgName" value="${esc(p.name||'')}"></div>
     <div class="field"><label>Objetivo / alcance</label><textarea id="pgObj">${esc(p.objective||'')}</textarea></div>`,
    `<button class="btn ghost danger" onclick="PMA.delProgram('${id}')">Eliminar</button><button class="btn" onclick="PMA.saveProgram('${id}')">Guardar</button>`);
};
PMA.saveProgram=function(id){
  const code=(($('#pgCode')||{}).value||'').trim(); const name=(($('#pgName')||{}).value||'').trim(); const obj=(($('#pgObj')||{}).value||'').trim();
  if(!name){ Toast.show('Escribe el nombre del programa','warn'); return; }
  if(id){ const p=(DB.pma_programs||[]).find(x=>x.id===id); if(p){p.code=code;p.name=name;p.objective=obj;} }
  else { DB.pma_programs.push({id:UID('PRG'),code:code||'PMA-*',name,objective:obj,custom:true}); }
  touch(); Modal.close(); Router.refresh();
};
PMA.delProgram=function(id){
  confirmBox('¿Eliminar este programa propio? Las medidas que contiene quedarán sin programa (no se borran).',()=>{
    DB.measures.forEach(m=>{ if(m.program_id===id) m.program_id=''; });
    DB.pma_programs=(DB.pma_programs||[]).filter(p=>p.id!==id);
    touch(); Modal.close(); Router.refresh();
  },'Eliminar',true);
};

/* ---- Fase 6: Programa de Vigilancia Ambiental (PVA) ---- */
const PVA={
  stateInfo:{ CUMPLE:{c:'compat',l:'Cumple'}, PARCIAL:{c:'moder',l:'Parcial'}, NOCUMPLE:{c:'critic',l:'No cumple'}, NOAPLICA:{c:'gray',l:'No aplica'}, '':{c:'gray',l:'Sin dato'} },
  events(mid){ return (DB.monitoring||[]).filter(e=>e.measure_id===mid).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created_at||'').localeCompare(a.created_at||'')); },
  latestState(mid){ const e=this.events(mid)[0]; return e?e.state:''; },
  correctivesOf(mid){ return (DB.corrective||[]).filter(c=>c.measure_id===mid); },
  register(mid){
    const m=PMA.measure(mid); if(!m)return;
    const evs=PVA.events(mid);
    const hist=evs.length?`<div class="muted small" style="text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px;border-top:1px solid var(--line);padding-top:10px">Historial (${evs.length})</div>
      <div style="max-height:150px;overflow:auto">${evs.map(e=>{const s=PVA.stateInfo[e.state]||PVA.stateInfo[''];return `<div class="small" style="padding:4px 0;border-bottom:1px solid var(--line-2)"><span class="chip ${s.c}">${s.l}</span> <b>${esc(e.date||'—')}</b> · ${esc(e.indicator==='IE'?'Eficacia':'Cumplimiento')} · ${esc(e.result||'')}</div>`;}).join('')}</div>`:'';
    const body=`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span class="chip ${PMA.outClass(m.out)}">${PMA.outNum(m)}</span><b>${esc(m.name)}</b></div>
      <div class="grid2">
        <div class="field"><label>Indicador</label><select id="evInd">
          ${m.ie?`<option value="IE">Eficacia — ${esc(m.ie)}${m.iem?' (meta '+esc(m.iem)+')':''}</option>`:''}
          ${m.ic?`<option value="IC">Cumplimiento — ${esc(m.ic)}${m.icm?' (meta '+esc(m.icm)+')':''}</option>`:''}
        </select></div>
        <div class="field"><label>Fecha</label><input type="date" id="evDate" value="${nowISO().slice(0,10)}"></div>
      </div>
      <div class="field"><label>Resultado observado</label><input type="text" id="evResult" placeholder="Valor o condición medida"></div>
      <div class="grid2">
        <div class="field"><label>Estado</label><select id="evState">
          <option value="CUMPLE">Cumple — meta alcanzada</option>
          <option value="PARCIAL">Parcial — cumplimiento incompleto</option>
          <option value="NOCUMPLE">No cumple — meta no alcanzada</option>
          <option value="NOAPLICA">No aplica</option>
        </select></div>
        <div class="field"><label>&nbsp;</label><label class="opt" style="justify-content:flex-start;gap:8px"><input type="checkbox" id="evCrit"> Umbral crítico superado</label></div>
      </div>
      <div class="field"><label>Evidencia</label><input type="text" id="evEvi" placeholder="Foto, bitácora, análisis, plano…"></div>
      <div class="field"><label>Observaciones</label><textarea id="evNote" placeholder="Notas del seguimiento"></textarea></div>
      ${hist}`;
    Modal.open('Registrar seguimiento', body,
      `<button class="btn ghost" onclick="Modal.close()">Cancelar</button><button class="btn" onclick="PVA.saveEvent('${mid}')">Registrar</button>`, true);
  },
  saveEvent(mid){
    const m=PMA.measure(mid); if(!m)return;
    const g=id=>($('#'+id)||{}).value||'';
    const state=g('evState')||'CUMPLE';
    const critical=(($('#evCrit')||{}).checked)===true;
    const ev={ id:UID('MON'), measure_id:mid, indicator:g('evInd')||'IE', date:g('evDate'), result:g('evResult'),
      state, critical, evidence:g('evEvi'), note:g('evNote'), created_at:nowISO() };
    DB.monitoring.push(ev); audit('monitoring',m.name,state);
    // Respuesta automática (spec tabla 18)
    let msg='Seguimiento registrado.';
    if(state==='NOCUMPLE' || critical || state==='PARCIAL'){
      const prior=PVA.correctivesOf(mid);
      const persistente=(state==='NOCUMPLE') && prior.some(c=>c.closed);
      const severity = state==='PARCIAL' && !critical ? 'observacion' : (persistente?'persistente':'obligatoria');
      const ca={ id:UID('CA'), monitoring_id:ev.id, measure_id:mid, action:(m.corrective||''), responsible:'', due:'',
        closed:false, severity, note: persistente?'Incumplimiento persistente tras corrección previa — considerar medida alternativa/complementaria.':(critical?'Umbral crítico superado.':''), created_at:nowISO() };
      DB.corrective.push(ca);
      msg = severity==='observacion' ? 'Registrado. Se creó una observación (corrección menor) en Acciones.' : 'Registrado. Se generó una acción correctiva obligatoria en Acciones.';
    } else if(state==='CUMPLE'){ msg='Registrado. Meta alcanzada; mantener medida y frecuencia.'; }
    touch(); Modal.close(); Router.refresh(); Toast.show(msg, state==='NOCUMPLE'?'warn':'ok');
  },
  editCA(id){
    const ca=(DB.corrective||[]).find(c=>c.id===id); if(!ca)return; const m=PMA.measure(ca.measure_id);
    Modal.open('Acción correctiva',
      `${m?`<div style="margin-bottom:8px"><span class="chip ${PMA.outClass(m.out)}">${PMA.outNum(m)}</span> <b>${esc(m.name)}</b></div>`:''}
       <div class="field"><label>Acción correctiva</label><textarea id="caAction">${esc(ca.action||'')}</textarea></div>
       <div class="grid2">
         <div class="field"><label>Responsable</label><input type="text" id="caResp" value="${esc(ca.responsible||'')}" placeholder="Quién la ejecuta/verifica"></div>
         <div class="field"><label>Fecha de nueva verificación</label><input type="date" id="caDue" value="${esc(ca.due||'')}"></div>
       </div>
       <div class="field"><label>Nota</label><textarea id="caNote">${esc(ca.note||'')}</textarea></div>`,
      `<button class="btn ghost" onclick="Modal.close()">Cancelar</button><button class="btn" onclick="PVA.saveCA('${id}')">Guardar</button>`);
  },
  saveCA(id){
    const ca=(DB.corrective||[]).find(c=>c.id===id); if(!ca)return; const g=x=>($('#'+x)||{}).value||'';
    ca.action=g('caAction'); ca.responsible=g('caResp'); ca.due=g('caDue'); ca.note=g('caNote');
    touch(); Modal.close(); Router.refresh();
  },
  closeCA(id){
    const ca=(DB.corrective||[]).find(c=>c.id===id); if(!ca)return;
    Modal.open('Cerrar acción correctiva',
      `<p class="small muted" style="margin-top:0">Registra la evidencia de que la desviación fue corregida.</p>
       <div class="field"><label>Evidencia / resultado de cierre</label><textarea id="caClose" placeholder="Qué se hizo y cómo se verificó"></textarea></div>`,
      `<button class="btn ghost" onclick="Modal.close()">Cancelar</button><button class="btn" onclick="PVA._doClose('${id}')">Cerrar acción</button>`);
  },
  _doClose(id){
    const ca=(DB.corrective||[]).find(c=>c.id===id); if(!ca)return;
    const ev=(($('#caClose')||{}).value||'').trim();
    ca.closed=true; ca.closed_date=nowISO().slice(0,10); ca.closure=ev;
    touch(); Modal.close(); Router.refresh(); Toast.show('Acción correctiva cerrada.');
  },
  reopenCA(id){ const ca=(DB.corrective||[]).find(c=>c.id===id); if(!ca)return; ca.closed=false; ca.closed_date=''; touch(); Router.refresh(); }
};

/* ---- Fase 8: Exportadores del Plan de Manejo (Word/Excel offline) ---- */
const PMAExport={
  _proj(){ return DB.project||{}; },
  _date(){ return (nowISO()||'').slice(0,10); },
  _esc(s){ return esc(s==null?'':String(s)); },
  _word(title,body){
    return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${PMAExport._esc(title)}</title>
<style>@page{size:A4 landscape;margin:1.6cm} body{font-family:Calibri,Arial,sans-serif;font-size:10.5pt;color:#1b1e22} h1{font-size:15pt;margin:0 0 2px} h2{font-size:12pt;border-bottom:1px solid #999;padding-bottom:3px;margin:16px 0 8px} table{border-collapse:collapse;width:100%;font-size:8.5pt;margin:6px 0} th,td{border:1px solid #7a7a7a;padding:4px 6px;vertical-align:top;text-align:left} th{background:#e9e6df;font-weight:bold} .muted{color:#666;font-size:9pt} .tag{font-weight:bold}</style></head><body>${body}</body></html>`;
  },
  _xls(name,tableHTML){
    return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>${PMAExport._esc(name).slice(0,28)}</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--><style>table{border-collapse:collapse}td,th{border:1px solid #999;padding:3px 6px;font-family:Calibri,Arial;font-size:10pt;vertical-align:top}th{background:#e9e6df;font-weight:bold}</style></head><body>${tableHTML}</body></html>`;
  },
  _hdr(section){ const p=PMAExport._proj(); return `<h1>${PMAExport._esc(p.name||'Proyecto')}</h1><div class="muted">Plan de Manejo Ambiental · ${PMAExport._esc(section)} · ${PMAExport._date()}${p.responsible?' · '+PMAExport._esc(p.responsible):''}</div>`; },
  _tbl(headers,rows){
    return `<table><thead><tr>${headers.map(h=>`<th>${PMAExport._esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${PMAExport._esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  },
  _dlWord(fname,section,inner){ Export._dl(Export._base()+'_'+fname+'.doc', PMAExport._word(section,PMAExport._hdr(section)+inner), 'application/msword'); },
  _dlXls(fname,name,tableHTML){ Export._dl(Export._base()+'_'+fname+'.xls', PMAExport._xls(name,tableHTML), 'application/vnd.ms-excel'); },
  // ---- datos derivados ----
  _managed(){ const M=getMethod(); return DB.impacts.filter(i=>{const a=Data.initialAssess(i.id);return a&&a.complete;})
    .sort((x,y)=>{const sx=(Data.stageOf(Data.activity(x.activity_id)||{})||{}).sequence||0,sy=(Data.stageOf(Data.activity(y.activity_id)||{})||{}).sequence||0; if(sx!==sy)return sx-sy; const ax=Data.initialAssess(x.id),ay=Data.initialAssess(y.id); return (ay?ay.abs:0)-(ax?ax.abs:0);}); },
  _caract(imp){ const M=getMethod(); const a=Data.initialAssess(imp.id); if(!a||!a.complete)return imp.aspect_name||''; const ci=M.clsInfo(a.cls); const nat=Reco.natureOf(imp)==='NEG'?'adverso':'benéfico'; return `${nat}, ${ci.label.toLowerCase()} (${M.scoreLabel||'I'}=${fmtScore(M,a.score)})`+(imp.aspect_name?` · aspecto: ${imp.aspect_name}`:''); },
  _efecto(imp){ return imp.rel_type==='I'?'Indirecto':'Directo'; },
  _tipoMedida(m){ return PMA.outNum(m)+' · '+CatalogMed.outLabel(m.out); },
  _descMedida(m){ return `${m.name||''}. Objetivo: ${m.objective||'—'}. Periodicidad: ${m.periodicity||m.frequency||'—'}. Plazo: ${m.term||'—'}.`; },
  _params(m){ return `Cumplimiento: ${m.ic||'—'}${m.icm?' (meta '+m.icm+')':''}. Eficacia: ${m.ie||'—'}${m.iem?' (meta '+m.iem+')':''}.`; },
  _loc(imp){ const act=Data.activity(imp.activity_id); const st=act?Data.stageOf(act):null; const comp=act?Data.component(act.component_id):null; const f=Data.factor(imp.factor_id);
    return { etapa:st?st.name:'—', obra:act?act.name:'—', comp:(comp?comp.name:'')+(f?' · '+f.name:''), factor:f?f.name:'—' }; },
  // ---- CAP IV (SEMARNAT) ----
  cap4Rows(){
    const H=['Etapa','Obra o actividad','Componente y subcomponente','Impacto ambiental','Caracterización (tipo, duración, extensión, intensidad)','Efectos','Tipo de Medida','Descripción de la medida (nombre, objetivo, periodicidad, plazo)','Parámetros de verificación (cumplimiento y eficacia)'];
    const rows=[];
    PMAExport._managed().forEach(imp=>{
      const L=PMAExport._loc(imp); const car=PMAExport._caract(imp); const ef=PMAExport._efecto(imp);
      const ms=DB.measures.filter(m=>(m.impact_ids||[]).includes(imp.id));
      if(ms.length) ms.forEach(m=>rows.push([L.etapa,L.obra,L.comp,imp.name,car,ef,PMAExport._tipoMedida(m),PMAExport._descMedida(m),PMAExport._params(m)]));
      else rows.push([L.etapa,L.obra,L.comp,imp.name,car,ef,'—','(sin medida asignada)','—']);
    });
    return {H,rows};
  },
  cap4Word(){ const {H,rows}=PMAExport.cap4Rows(); PMAExport._dlWord('cap4_semarnat','Capítulo IV · Impactos y medidas', PMAExport._tbl(H,rows)); },
  cap4Xls(){ const {H,rows}=PMAExport.cap4Rows(); PMAExport._dlXls('cap4_semarnat','Cap IV', PMAExport._tbl(H,rows)); },
  // ---- Fichas de medida ----
  fichasWord(){
    if(!DB.measures.length){Toast.show('Aún no hay medidas','warn');return;}
    const body=DB.measures.slice().sort((a,b)=>(a.seq||0)-(b.seq||0)).map(m=>{
      const imps=(m.impact_ids||[]).map(id=>Data.impact(id)).filter(Boolean).map(i=>i.name).join('; ');
      const prog=PMA.program(m.program_id); const rows=[
        ['Código',PMAExport._tipoMedida(m)],['Nombre',m.name],['Categoría',m.cat],['Programa',prog?((prog.c||prog.code)+' · '+(prog.n||prog.name)):'—'],
        ['Impactos atendidos',imps||'—'],['Etapa',m.stage],['Responsable',m.responsible],['Receptor',m.receptor],['Ubicación',m.location],
        ['Objetivo',m.objective],['Descripción / procedimiento',m.procedure],['Materiales / criterios',m.materials],
        ['Periodicidad',m.periodicity],['Frecuencia',m.frequency],['Plazo',m.term],['Costo',(m.cost||'')+(m.cost_unit?' '+m.cost_unit:'')],
        ['Indicador de cumplimiento',(m.ic||'')+(m.icm?' — meta '+m.icm:'')],['Indicador de eficacia',(m.ie||'')+(m.iem?' — meta '+m.iem:'')],
        ['Método de verificación',m.verification],['Evidencia',m.evidence],['Umbral de acción',m.threshold],
        ['Acción correctiva',m.corrective],['Medida alternativa',m.alternative],['Fuente',m.source],['Observaciones',m.note]
      ];
      return `<h2>${PMAExport._esc(PMAExport._tipoMedida(m)+' · '+(m.name||''))}</h2>${PMAExport._tbl(['Campo','Contenido'],rows)}`;
    }).join('');
    PMAExport._dlWord('fichas_medidas','Fichas de medidas',body);
  },
  // ---- PVA ----
  pvaRows(){
    const H=['Código','Medida','Indicador de eficacia','Meta eficacia','Indicador de cumplimiento','Meta cumplimiento','Frecuencia','Método de verificación','Evidencia','Umbral de acción','Responsable','Acción correctiva'];
    const rows=DB.measures.filter(m=>m.ic||m.ie).map(m=>[PMA.outNum(m),m.name,m.ie,m.iem,m.ic,m.icm,m.frequency,m.verification,m.evidence,m.threshold,m.responsible,m.corrective]);
    return {H,rows};
  },
  pvaWord(){ const {H,rows}=PMAExport.pvaRows(); if(!rows.length){Toast.show('Define indicadores en las medidas','warn');return;} PMAExport._dlWord('pva','Programa de Vigilancia Ambiental (PVA)',PMAExport._tbl(H,rows)); },
  pvaXls(){ const {H,rows}=PMAExport.pvaRows(); if(!rows.length){Toast.show('Define indicadores en las medidas','warn');return;} PMAExport._dlXls('pva','PVA',PMAExport._tbl(H,rows)); },
  // ---- Cronograma (medidas × etapas) ----
  cronoData(){
    const stages=DB.stages.slice().sort((a,b)=>(a.sequence||0)-(b.sequence||0));
    const H=['Código','Medida',...stages.map(s=>s.name)];
    const rows=DB.measures.slice().sort((a,b)=>(a.seq||0)-(b.seq||0)).map(m=>{
      const stIds=new Set((m.impact_ids||[]).map(id=>{const im=Data.impact(id);const a=im?Data.activity(im.activity_id):null;const st=a?Data.stageOf(a):null;return st?st.id:null;}).filter(Boolean));
      return [PMA.outNum(m),m.name,...stages.map(s=>stIds.has(s.id)?'X':'')];
    });
    return {H,rows};
  },
  cronoWord(){ const {H,rows}=PMAExport.cronoData(); if(!rows.length){Toast.show('Aún no hay medidas','warn');return;} PMAExport._dlWord('cronograma','Cronograma de medidas por etapa',PMAExport._tbl(H,rows)); },
  cronoXls(){ const {H,rows}=PMAExport.cronoData(); if(!rows.length){Toast.show('Aún no hay medidas','warn');return;} PMAExport._dlXls('cronograma','Cronograma',PMAExport._tbl(H,rows)); },
  // ---- Costos ----
  costRows(){
    const H=['Código','Medida','Tipo','Costo','Unidad / base'];
    let total=0; const rows=DB.measures.slice().sort((a,b)=>(a.seq||0)-(b.seq||0)).map(m=>{const v=parseFloat(String(m.cost||'').replace(/[^0-9.\-]/g,''));if(!isNaN(v))total+=v;return [PMA.outNum(m),m.name,m.cat,m.cost,m.cost_unit];});
    rows.push(['','TOTAL (suma de costos numéricos)','',total?total.toLocaleString('es-MX'):'','']);
    return {H,rows};
  },
  costWord(){ const {H,rows}=PMAExport.costRows(); PMAExport._dlWord('costos','Valoración económica de medidas',PMAExport._tbl(H,rows)); },
  costXls(){ const {H,rows}=PMAExport.costRows(); PMAExport._dlXls('costos','Costos',PMAExport._tbl(H,rows)); },
  // ---- Comparativo residual ----
  residualRows(){
    const M=getMethod(); const H=['Impacto','Inicial ('+(M.scoreLabel||'I')+' · clase)','Residual','Δ|'+(M.scoreLabel||'I')+'|','Medidas'];
    const rows=DB.impacts.filter(i=>{const a=Data.initialAssess(i.id);return a&&a.complete&&Reco.natureOf(i)==='NEG';}).map(i=>{
      const init=Data.initialAssess(i.id),res=Data.residualAssess(i.id); const ci=M.clsInfo(init.cls);
      const ms=DB.measures.filter(m=>(m.impact_ids||[]).includes(i.id)).map(m=>PMA.outNum(m)).join(', ');
      if(res&&res.complete){const cr=M.clsInfo(res.cls);return [i.name,fmtScore(M,init.score)+' · '+ci.label,fmtScore(M,res.score)+' · '+cr.label,fmtMag(M,Math.abs(init.score)-Math.abs(res.score)),ms];}
      return [i.name,fmtScore(M,init.score)+' · '+ci.label,'pendiente','',ms];
    });
    return {H,rows};
  },
  residualWord(){ const {H,rows}=PMAExport.residualRows(); if(!rows.length){Toast.show('Sin impactos negativos','warn');return;} PMAExport._dlWord('residual','Comparativo inicial → residual',PMAExport._tbl(H,rows)); },
  residualXls(){ const {H,rows}=PMAExport.residualRows(); if(!rows.length){Toast.show('Sin impactos negativos','warn');return;} PMAExport._dlXls('residual','Residual',PMAExport._tbl(H,rows)); },
  // ---- Documento completo ----
  fullWord(){
    const c4=PMAExport.cap4Rows(), pva=PMAExport.pvaRows(), cr=PMAExport.cronoData(), rs=PMAExport.residualRows(), co=PMAExport.costRows();
    const body=`<h2>Capítulo IV · Identificación de impactos y medidas</h2>${PMAExport._tbl(c4.H,c4.rows)}
      <h2>Programa de Vigilancia Ambiental (PVA)</h2>${pva.rows.length?PMAExport._tbl(pva.H,pva.rows):'<p class="muted">Sin indicadores definidos.</p>'}
      <h2>Cronograma de medidas por etapa</h2>${cr.rows.length?PMAExport._tbl(cr.H,cr.rows):'<p class="muted">Sin medidas.</p>'}
      <h2>Valoración económica</h2>${PMAExport._tbl(co.H,co.rows)}
      <h2>Comparativo inicial → residual</h2>${rs.rows.length?PMAExport._tbl(rs.H,rs.rows):'<p class="muted">Sin impactos negativos.</p>'}`;
    PMAExport._dlWord('plan_de_manejo','Plan de Manejo Ambiental (completo)',body);
  }
};

/* ============================================================
   12. REVISIÓN (apoyo de consistencia y buenas prácticas) — motor determinista
   Cada hallazgo: {sev:'alta'|'media'|'baja', cat, msg, where, fix}
   ============================================================ */
const Review={
  _sevRank:{alta:0,media:1,baja:2},
  clsIdx(M,cls){ return (M.classes||[]).findIndex(c=>c.id===cls); },
  isSig(M,a){ return a&&a.complete && ((M.severeIds||[]).includes(a.cls)||a.cls==='MODERADO'||a.cls==='MODERADA'); },
  run(){
    const M=getMethod(); const H=[];
    const add=(sev,cat,msg,where,fix)=>H.push({sev,cat,msg,where:where||'',fix:fix||''});
    const impacts=DB.impacts||[], measures=DB.measures||[];
    const negEval=impacts.filter(i=>{const a=Data.initialAssess(i.id);return a&&a.complete&&Reco.natureOf(i)==='NEG';});
    const withMeasure=id=>measures.some(m=>(m.impact_ids||[]).includes(id));

    // ---- A. COBERTURA / COMPLETITUD ----
    // impactos sin valorar
    impacts.forEach(i=>{ const a=Data.initialAssess(i.id); if(!a||!a.complete) add('media','Cobertura',`Impacto sin valoración completa.`,i.name,'Ábrelo en Valoración y completa los criterios del método.'); });
    // significativos sin medida
    negEval.forEach(i=>{ const a=Data.initialAssess(i.id); if(Review.isSig(M,a)&&!withMeasure(i.id)) add('alta','Cobertura',`Impacto ${M.clsInfo(a.cls).label.toLowerCase()} sin medida asignada.`,i.name,'Asigna al menos una medida en el Plan de Manejo (paso 11).'); });
    // criterios sin justificación
    let sinJust=0;
    DB.assessments.filter(a=>a.type==='INITIAL'&&a.method===M.id).forEach(a=>{
      const cr=a.criteria||{}; const faltan=Object.keys(cr).filter(k=>cr[k]&&(cr[k].justification==null||cr[k].justification==='')).length;
      if(faltan>0) sinJust++;
    });
    if(sinJust>0) add('baja','Trazabilidad',`${sinJust} impacto(s) con criterios sin justificación documentada.`,'', 'Agrega la justificación en cada criterio para sustentar la valoración.');

    // ---- B. CONSISTENCIA DE LA VALORACIÓN (reglas del motor) ----
    DB.assessments.filter(a=>a.type==='INITIAL'&&a.method===M.id&&a.complete).forEach(a=>{
      const imp=Data.impact(a.impact_id); if(!imp)return;
      let flags=[]; try{ flags=M.consistency(a.criteria,imp)||[]; }catch(e){}
      flags.filter(fl=>fl.lvl==='warn').forEach(fl=>{ add('media','Consistencia',fl.t,imp.name,'Revisa la combinación de criterios y su justificación.'); });
    });
    // recomputar score: verificar que el guardado coincide con el recálculo
    let desfases=0;
    DB.assessments.filter(a=>a.method===M.id&&a.complete).forEach(a=>{
      try{ const r=M.calculate(a.criteria,a.nature); if(r&&a.score!=null&&r.score!==a.score) desfases++; }catch(e){}
    });
    if(desfases>0) add('media','Consistencia',`${desfases} valoración(es) con score distinto al recálculo del motor.`,'','Reabre y guarda de nuevo esas valoraciones para recalcularlas.');

    // ---- C. PLAN DE MANEJO ----
    measures.forEach(m=>{
      const nm=(typeof PMA!=='undefined'?PMA.outNum(m)+' · ':'')+(m.name||'(sin nombre)');
      if(!m.name) add('media','Ficha','Medida sin nombre.',nm,'Nómbrala en su ficha.');
      if(!m.responsible) add('media','Ficha','Medida sin responsable.',nm,'Asigna un responsable de ejecución/verificación.');
      if(!m.ic&&!m.ie) add('alta','Ficha','Medida sin indicadores de cumplimiento ni eficacia.',nm,'Define al menos un indicador con su meta.');
      else{
        if(m.ic&&!m.icm) add('baja','Ficha','Indicador de cumplimiento sin meta.',nm,'Agrega la meta cuantificable de cumplimiento.');
        if(m.ie&&!m.iem) add('baja','Ficha','Indicador de eficacia sin meta.',nm,'Agrega la meta cuantificable de eficacia.');
      }
      if(!m.term&&!m.periodicity&&!m.frequency) add('baja','Ficha','Medida sin periodicidad/plazo.',nm,'Indica cuándo y por cuánto tiempo se aplica.');
      if(!(m.impact_ids||[]).length) add('media','Enlace','Medida sin impacto enlazado.',nm,'Vincúlala al impacto que atiende.');
      // enlaces rotos
      (m.impact_ids||[]).forEach(id=>{ if(!Data.impact(id)) add('media','Enlace','Medida enlazada a un impacto inexistente.',nm,'Corrige el vínculo de la medida.'); });
    });

    // ---- D. JERARQUÍA DE MANEJO ----
    // impacto crítico atendido SOLO con compensación
    negEval.forEach(i=>{ const a=Data.initialAssess(i.id); if(!a)return;
      if((M.severeIds||[]).includes(a.cls)){
        const ms=measures.filter(m=>(m.impact_ids||[]).includes(i.id));
        if(ms.length && ms.every(m=>m.out==='C')) add('media','Jerarquía',`Impacto ${M.clsInfo(a.cls).label.toLowerCase()} atendido solo con compensación.`,i.name,'Prioriza evitar/prevenir/mitigar antes de compensar (jerarquía de manejo).');
      }
    });
    // categoría interna vs código de salida
    measures.forEach(m=>{ if(m.cat){ const exp=CatalogMed.outCode(m.cat); if(m.out&&exp&&m.out!==exp) add('baja','Jerarquía',`El código de salida (${m.out}) no corresponde a la categoría "${m.cat}".`,(PMA.outNum(m))+' · '+(m.name||''),'Verifica la categoría o el perfil de salida.'); } });

    // ---- E. RECEPTORES SENSIBLES (ANP / Ramsar / manglar) ----
    const sensImp=impacts.filter(i=>i.receptor_code==='REC-AIA'||/ramsar|manglar|humedal|ANP/i.test((i.receptor||'')+' '+(i.name||'')));
    sensImp.forEach(i=>{
      if(!withMeasure(i.id)) add('alta','Receptor sensible','Impacto sobre receptor sensible (ANP/Ramsar/manglar) sin medida.',i.name,'Asigna medida de protección específica y seguimiento dirigido.');
      else{
        const ms=measures.filter(m=>(m.impact_ids||[]).includes(i.id));
        const tieneSeguimiento=ms.some(m=>m.cat==='Seguimiento'||m.out==='V'||/seguimiento|monitoreo/i.test(m.name||''));
        if(!tieneSeguimiento) add('media','Receptor sensible','Receptor sensible sin medida de seguimiento/monitoreo dirigido.',i.name,'Añade una medida de vigilancia específica para el receptor.');
      }
    });

    // ---- F. RESIDUAL ----
    negEval.forEach(i=>{ const init=Data.initialAssess(i.id), res=Data.residualAssess(i.id); if(!init)return;
      if((M.severeIds||[]).includes(init.cls)&&!(res&&res.complete)) add('media','Residual',`Impacto ${M.clsInfo(init.cls).label.toLowerCase()} sin evaluación residual.`,i.name,'Re-caracteriza el residual tras las medidas (paso 11 › Residual).');
      if(res&&res.complete){
        // baja de clase sin medida
        if(Review.clsIdx(M,res.cls)<Review.clsIdx(M,init.cls) && !withMeasure(i.id)) add('media','Residual','El residual baja de severidad sin medida que lo justifique.',i.name,'Asocia la(s) medida(s) que producen la reducción, o revisa el residual.');
        // reducción implausible: todos los criterios al mínimo
        const cr=res.criteria||{}; const keys=Object.keys(cr); const min=keys.length&&keys.every(k=>{const vals=(M.criteria.find(c=>c.code===k)||{}).scale||[];const mn=Math.min(...vals.map(s=>s.v));return cr[k]&&cr[k].value===mn;});
        if(min) add('media','Residual','Residual con todos los criterios en el mínimo (reducción posiblemente implausible).',i.name,'La importancia/relevancia del receptor no suele anularse; revisa la re-caracterización.');
      }
    });

    // ---- G. PVA / ACCIONES CORRECTIVAS ----
    const today=nowISO().slice(0,10);
    (DB.corrective||[]).forEach(ca=>{ if(!ca.closed){ const m=(typeof PMA!=='undefined')?PMA.measure(ca.measure_id):null;
      if(ca.due&&ca.due<today) add('alta','PVA',`Acción correctiva vencida sin cerrar (venció ${ca.due}).`,m?m.name:'',' Ejecútala y ciérrala con evidencia, o reprograma.');
      if(!ca.responsible) add('baja','PVA','Acción correctiva sin responsable asignado.',m?m.name:'','Asigna responsable y fecha de verificación.');
    }});
    // Nota: la cobertura de seguimiento del PVA se evalúa en el propio módulo de Vigilancia,
    // no se penaliza aquí porque depende de la etapa (el PVA corre en operación).

    // ---- Resumen / puntaje ----
    const counts={alta:0,media:0,baja:0}; H.forEach(h=>counts[h.sev]++);
    H.sort((a,b)=>Review._sevRank[a.sev]-Review._sevRank[b.sev]);
    // puntaje 0-100: penalización absoluta y gradual (los hallazgos bajos casi no restan)
    const penal=counts.alta*7 + counts.media*2 + counts.baja*0.5;
    const score=Math.max(0,Math.round(100-penal));
    const grade= score>=85?'Sólido': score>=65?'Aceptable con observaciones': score>=40?'Requiere trabajo':'Incompleto';
    return {H,counts,score,grade,stats:{impacts:impacts.length,measures:measures.length,negEval:negEval.length,method:M.name}};
  },
  // ---- Paquete de revisión para IA externa (texto pegable) ----
  packageText(){
    const M=getMethod(); const r=Review.run(); const p=DB.project||{}; const L=[];
    L.push('# PAQUETE DE REVISIÓN — VALIA');
    L.push('Eres un revisor técnico de Manifestaciones de Impacto Ambiental (MIA, México). Revisa el siguiente proyecto como APOYO de consistencia y buenas prácticas (no sustituyes al responsable técnico). Devuelve observaciones priorizadas y accionables sobre la valoración y el plan de manejo, señalando qué ajustar y por qué.');
    L.push('');
    L.push('## Proyecto');
    L.push(`- Nombre: ${p.name||'—'}`);
    L.push(`- Ubicación: ${(p.municipality||'')} ${(p.entity||'')}`.trim());
    L.push(`- Método de valoración: ${M.name} (${M.equation||''})`);
    L.push(`- Descripción: ${(p.description||'—')}`);
    L.push('');
    L.push('## Resumen cuantitativo');
    const dist={}; DB.impacts.forEach(i=>{const a=Data.initialAssess(i.id);if(a&&a.complete){const l=M.clsInfo(a.cls).label;dist[l]=(dist[l]||0)+1;}});
    L.push(`- Impactos: ${DB.impacts.length} · Medidas: ${DB.measures.length} · Programas: ${new Set(DB.measures.map(m=>m.program_id).filter(Boolean)).size}`);
    L.push(`- Distribución de significancia: ${Object.entries(dist).map(([k,v])=>k+': '+v).join(' · ')||'—'}`);
    L.push(`- Salud del expediente (revisor determinista): ${r.score}/100 (${r.grade}) — hallazgos: ${r.counts.alta} altos, ${r.counts.media} medios, ${r.counts.baja} bajos`);
    L.push('');
    L.push('## Impactos y su manejo');
    DB.impacts.forEach(i=>{
      const a=Data.initialAssess(i.id), res=Data.residualAssess(i.id);
      const ci=a&&a.complete?M.clsInfo(a.cls).label:'sin valorar';
      const ms=DB.measures.filter(m=>(m.impact_ids||[]).includes(i.id)).map(m=>PMA.outNum(m)+' '+(m.name||'')).join('; ');
      const loc=(()=>{const act=Data.activity(i.activity_id);const st=act?Data.stageOf(act):null;const f=Data.factor(i.factor_id);return `${st?st.name:''}/${act?act.name:''}/${f?f.name:''}`;})();
      L.push(`- [${i.impact_code||'—'}] ${i.name} | ${i.nature==='POS'?'POSITIVO':'negativo'} | ${loc} | receptor: ${i.receptor||'—'} | inicial: ${a&&a.complete?fmtScore(M,a.score)+' ('+ci+')':'—'}${res&&res.complete?' | residual: '+fmtScore(M,res.score)+' ('+M.clsInfo(res.cls).label+')':''} | medidas: ${ms||'ninguna'}`);
    });
    L.push('');
    L.push('## Hallazgos del revisor determinista');
    if(!r.H.length) L.push('- (sin hallazgos automáticos)');
    r.H.forEach(h=>L.push(`- [${h.sev.toUpperCase()}] (${h.cat}) ${h.msg}${h.where?' → '+h.where:''} | sugerencia: ${h.fix}`));
    L.push('');
    L.push('## Lo que se te pide');
    L.push('1. Valida la coherencia de la valoración (criterios entre sí y significancias resultantes).');
    L.push('2. Revisa el plan de manejo: cobertura, jerarquía de manejo (evitar/prevenir/mitigar/restaurar/compensar), fichas e indicadores.');
    L.push('3. Presta atención especial a receptores sensibles (ANP/Ramsar/manglar/humedal) y a impactos indirectos/acumulativos.');
    L.push('4. Señala vacíos, incongruencias y mejoras concretas, priorizadas. No inventes datos que no estén aquí.');
    return L.join('\n');
  }
};
PMA._showAlt=function(impId){
  const im=Data.impact(impId); if(!im)return; const sugg=Reco.suggest(im);
  const applied=PMA.measuresOfImpact(impId);
  const list=sugg.alternativas.filter(x=>!applied.some(am=>am.measure_code===x.measure.c));
  const body=`<p class="small muted" style="margin-top:0">Alternativas de la biblioteca para <b>${esc(im.name)}</b>. Aplica la que corresponda al criterio del especialista.</p>
    <div class="opts" style="flex-direction:column;gap:8px">${list.map(x=>{const out=CatalogMed.outCode(x.measure.tipo);
      return `<button class="btn ghost" style="justify-content:flex-start;text-align:left" onclick="Modal.close();PMA.apply('${impId}','${x.measure.c}')"><span class="chip ${PMA.outClass(out)}" style="margin-right:6px">${out}</span>${esc(x.measure.c)} · ${esc(x.measure.n)}</button>`;
    }).join('')||'<span class="muted small">Sin más alternativas.</span>'}</div>`;
  Modal.open('Medidas alternativas', body);
};

Screens.review=function(){

  const r=Review.run();
  const gradeCls=r.score>=85?'compat':r.score>=65?'moder':r.score>=40?'sever':'critic';
  const sevCls={alta:'critic',media:'sever',baja:'moder'};
  const sevLbl={alta:'Alta',media:'Media',baja:'Baja'};

      <td class="small">${esc(h.fix)}</td>

    <div class="sub">Auditoría automática del expediente (valoración + plan de manejo). Es un apoyo técnico; no sustituye el criterio del responsable que firma la MIA.</div></div>
    <div class="rowbtns"><button class="btn" onclick="Review.copyPackage()">⧉ Copiar paquete para IA externa</button><button class="btn ghost sm" onclick="Review.downloadPackage()">↧ Descargar .txt</button></div></div>

  <div class="stats">
    <div class="stat ${gradeCls}"><span class="bar"></span><div class="v">${r.score}</div><div class="l">Salud del expediente</div></div>
    <div class="stat critic"><span class="bar"></span><div class="v">${r.counts.alta}</div><div class="l">Hallazgos altos</div></div>
    <div class="stat sever"><span class="bar"></span><div class="v">${r.counts.media}</div><div class="l">Medios</div></div>
    <div class="stat moder"><span class="bar"></span><div class="v">${r.counts.baja}</div><div class="l">Bajos</div></div>
  </div>
  <div class="card"><div class="bd" style="padding:12px 16px"><b>Diagnóstico:</b> <span class="chip ${gradeCls}">${esc(r.grade)}</span>
    <span class="muted small">· ${r.stats.impacts} impactos · ${r.stats.measures} medidas · método ${esc(r.stats.method)}</span></div></div>

  ${r.H.length?`<div class="card"><div class="hd"><h3>Hallazgos (${r.H.length})</h3><span class="desc">Ordenados por severidad</span></div><div class="bd" style="padding:0">
    <table class="tbl"><thead><tr><th style="width:80px;text-align:center">Severidad</th><th style="width:130px">Categoría</th><th>Hallazgo</th><th style="width:34%">Sugerencia</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`
  :`<div class="card"><div class="bd"><div class="empty"><div class="ic">✓</div><h4>Sin hallazgos automáticos</h4><p>El expediente pasa las reglas deterministas. Puedes enriquecer la revisión con el paquete para IA externa.</p></div></div></div>`}

  <div class="card"><div class="hd"><h3>Revisión con IA externa</h3></div><div class="bd">
    <p class="small muted" style="margin-top:0">Para no depender de conexión ni exponer datos automáticamente, VALIA arma un <b>paquete de revisión</b> (resumen estructurado del proyecto + estos hallazgos) que puedes pegar en un asistente como Claude para obtener una revisión redactada y con matiz. Tú decides qué compartir.</p>

const Export={
  menu(){
    Modal.open('Exportar datos',
      `<p class="small muted" style="margin-top:0">Los formatos abiertos permiten integrar los resultados en otras herramientas. El reporte completo para la MIA se genera desde la pantalla <b>Reporte</b>.</p>
       <div class="opts" style="flex-direction:column">
