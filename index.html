    const out=[];DB.activities.forEach(a=>{ if(!a.firma||!a.firma.length)return; const st=Data.stageOf(a);
      a.firma.forEach(([mc,inten])=>{if(inten==='nula')return;const m=VCORE_LIB.mec[mc];if(!m)return;
        m.r.forEach(([medio,comp,fac])=>{const key=medio+'|'+comp;if(ausentes.has(key))return;let flag=null;if(sr[key]&&(m.s||[]).includes(sr[key]))flag=sr[key];
          out.push({actId:a.id,act:a.name,fase:st?st.name:'',mec:mc,mecNom:m.n,medio,componente:comp,factor:fac,intensidad:inten,naturaleza:m.p?'positivo':'negativo',flag});});});});
    return out;},
  stats(){const c=this.derive();const conFirma=DB.activities.filter(a=>a.firma&&a.firma.length).length;
    return {cand:c.length,flag:c.filter(x=>x.flag).length,exp:c.filter(x=>this.route(x)==='EXPERTA').length,asi:c.filter(x=>this.route(x)==='ASISTIDA').length,auto:c.filter(x=>this.route(x)==='AUTO').length,
      totalAct:DB.activities.length,conFirma,sinFirma:DB.activities.length-conFirma};},
  // Siembra: crea SOLO factores, interacciones e impactos (las actividades ya existen)
  seed(preval){
    const cands=this.derive();
    if(!cands.length){Toast.show('Ninguna actividad tiene firma. Asigna firma (o usa "sugerir") a al menos una actividad.','warn');return;}
    const facMap={};
    const ensureFactor=(medio,comp,fac)=>{
      // 1) Resolver contra la Base Maestra: factor alineado a catálogo (código, componente y nombre canónicos).
      const code=VCORE_LIB.catCode(medio,comp,fac);
      if(code){
        let f=DB.factors.find(x=>x.code===code);   // dedup por código de catálogo
        if(!f){const x=Catalog.factor(code),cc=x?Catalog.component(x.comp):null;
          f={id:UID('FAC'),medium:x?x.m:medio,component:cc?cc.n:comp,component_code:x?x.comp:'',name:x?x.n:fac,code:code,tipo:x?x.t:'',indicator:'',unit:'',sensitivity:''};
          DB.factors.push(f);}
        facMap[f.id]=1;return f.id;
      }
      // 2) Sin mapeo: al menos alinear el componente por nombre; el factor queda como "Otro" (texto libre).
      const cc=Catalog.componentByName(medio,comp);
      let f=DB.factors.find(x=>x.medium===medio&&x.component===(cc?cc.n:comp)&&x.name===fac);
      if(!f){f={id:UID('FAC'),medium:medio,component:cc?cc.n:comp,component_code:cc?cc.c:'',name:fac,code:'',indicator:'',unit:'',sensitivity:''};DB.factors.push(f);}
      facMap[f.id]=1;return f.id;};
    let nInt=0,nImp=0,nVal=0; const actSet=new Set();
    cands.forEach(c=>{const aid=c.actId; actSet.add(aid); const fid=ensureFactor(c.medio,c.componente,c.factor);
      const fObj=Data.factor(fid); const rec=fObj&&fObj.code?Catalog.receptorOfFactor(fObj.code):null;
      let it=Data.interaction(aid,fid); if(!it){it={id:UID('INT'),activity_id:aid,factor_id:fid,exists:true};DB.interactions.push(it);nInt++;}
      const dup=DB.impacts.find(im=>im.activity_id===aid&&im.factor_id===fid&&im.vcore_mec===c.mec);
      if(!dup){const nombre=c.mecNom+' → '+(fObj?fObj.component:c.componente);
        const imp={id:UID('IMP'),interaction_id:it.id,activity_id:aid,factor_id:fid,name:nombre,description:'',
          aspect_code:'',aspect_name:c.mecNom,aspect_family:'',causal_mechanism:c.act+' → '+c.mecNom+' → '+(fObj?fObj.name:c.factor),
          nature:c.naturaleza==='positivo'?'POS':'NEG',receptor:rec?rec.s:(fObj?fObj.component:c.componente),receptor_code:rec?rec.c:'',rel_type:'D',impact_code:'',status:'DRAFT',seq:DB.impacts.length+1,
          vcore_mec:c.mec,vcore_safeguard:c.flag||'',vcore_route:this.route(c)};
        DB.impacts.push(imp);nImp++;
        if(preval){const Ai=c.intensidad==='alta'?4:c.intensidad==='media'?3:2,Ri=c.flag?5:3;
          DB.assessments.push({id:UID('ASM'),impact_id:imp.id,method:'VALIA-CORE-01',type:'INITIAL',parent_id:null,nature:imp.nature,
            criteria:{A:{value:Ai},R:{value:Ri},C:{value:2},SV:{value:c.flag?2:1},Q:{value:3}},evaluator:DB.project.responsible||'',date:todayStr()});nVal++;}
      }
    });
    if(preval){ACTIVE_METHOD='VALIA-CORE-01';DB.method='VALIA-CORE-01';}
    audit('vcore','matriz',`sembradas ${nInt} interacciones, ${nImp} impactos`); recalcAll(); touch();
    Nav.render(); Router.go('matrix');
    Toast.show(`Matriz sembrada: ${actSet.size} actividades con firma · ${Object.keys(facMap).length} factores · ${nInt} interacciones · ${nImp} impactos`+(preval?` · ${nVal} pre-valorados con VALIA`:''));
  },
  // --- edición de firma sobre la ACTIVIDAD real ---
  ensureFirma(actId){const a=Data.activity(actId);if(a&&!Array.isArray(a.firma))a.firma=[];return a;},
  suggest(actId){const a=this.ensureFirma(actId);const s=this.suggestFirma(a.name);if(!s){Toast.show('No encontré una firma sugerida para "'+(a.name||'')+'". Añade mecanismos manualmente.','info');return;}a.firma=s.firma;touch();Router.refresh();Toast.show('Firma sugerida aplicada ('+s.code+')');},
  suggestAll(){let n=0;DB.activities.forEach(a=>{if(a.firma&&a.firma.length)return;const s=this.suggestFirma(a.name);if(s){a.firma=s.firma;n++;}});touch();Router.refresh();Toast.show(n?`Firma sugerida aplicada a ${n} actividad(es) sin firma`:'No hubo coincidencias para las actividades sin firma');},
  clearFirma(actId){const a=Data.activity(actId);if(a){a.firma=[];touch();Router.refresh();}},
  setInt(actId,i,val){const a=Data.activity(actId);if(a&&a.firma&&a.firma[i]){a.firma[i][1]=val;touch();Router.refresh();}},
  rmMec(actId,i){const a=Data.activity(actId);if(a&&a.firma){a.firma.splice(i,1);touch();Router.refresh();}},
  addMec(actId){const a=this.ensureFirma(actId);const mc=$('#vc-addmec-'+actId).value;if(a&&!a.firma.some(f=>f[0]===mc)){a.firma.push([mc,'media']);touch();Router.refresh();}},
  addSalv(){const tipo=$('#vc-svtipo').value,rec=$('#vc-svrec').value.split('|');DB.vcore.salvaguardas.push({tipo,medio:rec[0],componente:rec[1]});touch();Router.refresh();},
  rmSalv(i){DB.vcore.salvaguardas.splice(i,1);touch();Router.refresh();},
  toggleRec(key){const arr=DB.vcore.ausentes;const i=arr.indexOf(key);if(i>=0)arr.splice(i,1);else arr.push(key);touch();Router.refresh();}
};
Screens.vcore=function(){
  const v=DB.vcore; const st=VCore.stats();
  const mecLine=(a,f,i)=>{const m=VCORE_LIB.mec[f[0]];return `<div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-top:1px dashed var(--line-2)">
    <span style="flex:1;font-size:12px">${esc(m?m.n:f[0])}${m&&m.p?' <span class="chip pos" style="padding:0 5px">+</span>':''}</span>
    <select onchange="VCore.setInt('${a.id}',${i},this.value)" style="width:auto;padding:2px 6px;font-size:12px">${VCORE_LIB.intensidades.map(x=>`<option ${f[1]===x?'selected':''}>${x}</option>`).join('')}</select>
    <button class="btn ghost sm" style="padding:1px 7px" onclick="VCore.rmMec('${a.id}',${i})">✕</button></div>`;};
  const actCard=a=>{const hasF=a.firma&&a.firma.length;const nc=hasF?VCore.derive().filter(c=>c.actId===a.id).length:0;
    return `<div class="card" style="margin-bottom:10px;${hasF?'':'opacity:.92'}"><div class="bd">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px">
      <span style="flex:2;min-width:180px;font-weight:600">${esc(a.name||'(sin nombre)')}</span>
      ${hasF?`<span class="chip gray">${nc} candidatas</span>`:'<span class="chip" style="background:#F6EED8;color:#8a6400;border-color:transparent">sin firma</span>'}
      <button class="btn ghost sm" onclick="VCore.suggest('${a.id}')">✧ Sugerir firma</button>
      ${hasF?`<button class="btn ghost sm" onclick="VCore.clearFirma('${a.id}')">Limpiar</button>`:''}
    </div>
    ${hasF?`<div class="muted small" style="font-weight:700;margin:2px 0 2px">Firma ambiental (mecanismos)</div>${a.firma.map((f,i)=>mecLine(a,f,i)).join('')}`:'<div class="muted small">Sin mecanismos. Usa “Sugerir firma” o añade uno abajo. Las actividades sin firma no se siembran.</div>'}
    <div style="margin-top:6px"><select id="vc-addmec-${a.id}" style="width:auto;font-size:12px">${Object.entries(VCORE_LIB.mec).map(([k,m])=>`<option value="${k}">${k} · ${esc(m.n)}</option>`).join('')}</select>
      <button class="btn ghost sm" onclick="VCore.addMec('${a.id}')">＋ mecanismo</button></div>
    </div></div>`;};
  // actividades reales agrupadas por etapa › componente
  let actsHTML='';
  if(!DB.activities.length){
    actsHTML=`<div class="empty"><div class="ic">▦</div><h4>Aún no hay actividades en el proyecto</h4>
      <p>El generador pone firma a las actividades reales de tu obra. Defínelas primero en <b>Etapas y actividades</b> —a mano o con una plantilla sectorial— y vuelve aquí.</p>
      <div class="rowbtns" style="justify-content:center">
        <button class="btn" onclick="Router.go('stages')">▦ Ir a Etapas y actividades</button>
        <button class="btn ghost" onclick="Screens._loadTemplate&&Screens._loadTemplate()">⊕ Cargar plantilla sectorial</button>
      </div></div>`;
  } else {
    DB.stages.forEach(s=>{const acts=Data.activitiesOf(s.id);if(!acts.length)return;
      actsHTML+=`<div class="muted small" style="text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin:14px 0 6px;color:var(--brand-d)">${esc(s.name)}</div>`;
      // agrupar por componente
      const byComp={};acts.forEach(a=>{const c=Data.componentOf(a);const cn=c?c.name:'General';(byComp[cn]=byComp[cn]||[]).push(a);});
      Object.keys(byComp).forEach(cn=>{actsHTML+=`<div class="muted small" style="font-weight:600;margin:4px 0 4px">${esc(cn)}</div>`+byComp[cn].map(actCard).join('');});
    });
    // actividades sin etapa/componente resuelto (por si acaso)
    const orphan=DB.activities.filter(a=>!Data.stageOf(a));
    if(orphan.length)actsHTML+=`<div class="muted small" style="font-weight:700;margin:14px 0 6px">Sin etapa asignada</div>`+orphan.map(actCard).join('');
  }
  const recs=VCORE_LIB.receptores();const ausentes=new Set(v.ausentes||[]);
  const byMedio={};recs.forEach(r=>{(byMedio[r.medio]=byMedio[r.medio]||[]).push(r);});
  const recHTML=Object.keys(byMedio).map(md=>`<div style="margin-bottom:8px"><div class="muted small" style="font-weight:700">${esc(VCORE_LIB.medios[md])}</div>
    ${byMedio[md].map(r=>{const key=r.medio+'|'+r.componente;const on=!ausentes.has(key);return `<span class="chip ${on?'brand':'gray'}" style="cursor:pointer;margin:2px" onclick="VCore.toggleRec('${esc(key)}')">${on?'✓ ':'✕ '}${esc(r.componente)}</span>`;}).join('')}</div>`).join('');
  return `<div class="page-head"><div class="titles"><div class="step-tag">Paso 0A · VALIA-Core A/B</div><h2>Generador de matriz por firma ambiental</h2>
    <div class="sub">Pon la <b>firma</b> (mecanismos que emite) a las actividades reales de tu obra. El generador deriva las interacciones (reglas A-01…A-06) y <b>siembra la matriz</b> del Paso 04. <b>Solo se siembran las actividades con firma.</b></div></div>
    <div class="rowbtns"><button class="btn ghost sm" onclick="Router.go('stages')">▦ Editar actividades</button>${st.sinFirma?`<button class="btn ghost sm" onclick="VCore.suggestAll()">✧ Sugerir firma a las ${st.sinFirma} sin firma</button>`:''}</div></div>

  <div class="alert" style="margin-bottom:16px;background:var(--surface-2)"><span class="ai">✦</span><span>El generador <b>no crea actividades</b>: usa las de tu proyecto. Al sembrar crea solo factores, interacciones e impactos para las actividades con firma. Las <b>salvaguardas</b> viajan con cada impacto y, si pre-valoras con VALIA, imponen su piso automáticamente.</span></div>

  <div class="card"><div class="hd"><h3>Actividades del proyecto y su firma</h3><span class="desc">${st.conFirma}/${st.totalAct} con firma</span></div>
    <div class="bd">${actsHTML}</div>
  </div>

  <div class="card"><div class="hd"><h3>Salvaguardas del sitio</h3><span class="desc">no compensables</span></div><div class="bd">
    <div class="rowbtns" style="margin-bottom:12px;gap:8px;flex-wrap:wrap;align-items:end">
      <select id="vc-svtipo" style="width:auto">${VCORE_LIB.salvaguardas.map(([t,l])=>`<option value="${t}">${esc(l)}</option>`).join('')}</select>
      <select id="vc-svrec" style="width:auto">${recs.map(r=>`<option value="${r.medio}|${esc(r.componente)}">${esc(VCORE_LIB.medios[r.medio])} · ${esc(r.componente)}</option>`).join('')}</select>
      <button class="btn sm" onclick="VCore.addSalv()">＋ Añadir</button>
    </div>
    ${v.salvaguardas.length?`<table class="tbl" style="width:100%"><thead><tr><th>Tipo</th><th>Receptor</th><th></th></tr></thead><tbody>
      ${v.salvaguardas.map((s,i)=>`<tr><td><span class="chip flag">⚑ ${esc(s.tipo)}</span></td><td>${esc(VCORE_LIB.medios[s.medio]||'')} · ${esc(s.componente||'')}</td><td><button class="btn ghost sm" onclick="VCore.rmSalv(${i})">✕</button></td></tr>`).join('')}
    </tbody></table>`:'<div class="muted small">Sin salvaguardas. Si el sitio tiene manglar, Ramsar, especie protegida o acuífero crítico, decláralas.</div>'}
  </div></div>

  <details class="card"><summary style="padding:14px 18px;cursor:pointer;font-weight:600">Receptores presentes en el sitio (${recs.length-ausentes.size}/${recs.length}) — desmarca los ausentes</summary>
    <div class="bd" style="border-top:1px solid var(--line-2)">${recHTML}</div></details>

  <div class="card"><div class="hd"><h3>Derivación y siembra</h3></div><div class="bd">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <span class="chip brand">${st.cand} candidatas</span>
      <span class="chip" style="background:#F7E0E1;color:#C0392B;border-color:transparent">${st.exp} revisión experta</span>
      <span class="chip" style="background:#E4EEF5;color:#25638F;border-color:transparent">${st.asi} asistidas</span>
      <span class="chip" style="background:#E7F1E9;color:#2E7D46;border-color:transparent">${st.auto} autoevaluables</span>
      <span class="chip flag">${st.flag} con salvaguarda</span>
      ${st.sinFirma?`<span class="chip" style="background:#F6EED8;color:#8a6400;border-color:transparent">${st.sinFirma} actividad(es) sin firma (no se sembrarán)</span>`:''}
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer"><input type="checkbox" id="vc-preval" checked style="width:auto"> Pre-valorar con VALIA-Core (A* de la intensidad, R* de la salvaguarda; editable después)</label>
    <button class="btn" onclick="VCore.seed(document.getElementById('vc-preval').checked)" ${st.cand?'':'disabled style="opacity:.5"'}>✦ Sembrar la matriz (Paso 04)</button>
    ${DB.impacts.length?'<div class="muted small" style="margin-top:8px">La siembra <b>agrega</b> a lo existente (no duplica interacciones ni impactos ya creados por el generador).</div>':''}
  </div></div>`;
};

Screens._loadTemplate=function(){

  }).join('');
  Modal.open('Plantillas sectoriales','<p class="small muted" style="margin-top:0">Las plantillas <b>sugieren</b> la estructura Etapa → Componente del proyecto → Actividad típica del sector. Nunca deciden la valoración: sólo aceleran la captura. Puedes editar todo después.</p><div class="opts" style="flex-direction:column">'+opts+'</div>');
};
Screens._applyTemplate=function(key){
  const lib=SectorLib[key]; if(!lib)return;
  lib.tree.forEach(stg=>{
    let stage=DB.stages.find(s=>s.name===stg.stage);
    if(!stage){ stage={id:UID('STG'),name:stg.stage,sequence:DB.stages.length+1,description:''}; DB.stages.push(stage); }
    stg.components.forEach(comp=>{
      let component=DB.components.find(c=>c.stage_id===stage.id && c.name===comp.name);
      if(!component){ component={id:UID('CMP'),stage_id:stage.id,name:comp.name,sequence:Data.componentsOf(stage.id).length+1,description:''}; DB.components.push(component); }
      comp.activities.forEach(an=>{
        if(!DB.activities.find(a=>a.component_id===component.id && a.name===an))
          DB.activities.push({id:UID('ACT'),component_id:component.id,name:an,description:'',affected_area:'',affected_unit:''});
      });
    });
  });
  audit('template','project',lib.name); touch(); Modal.close(); Router.refresh();
  Toast.show('Plantilla aplicada: '+lib.name+'. Revisa y ajusta en Etapas y actividades.');
};

          ${acts.map(a=>`<tr>

            <td class="num"><input type="number" value="${esc(a.affected_area)}" oninput="Screens._actset('${a.id}','affected_area',this.value)" style="border:none;text-align:right;font-family:var(--mono);padding:4px 0"></td>
            <td><input type="text" list="unitList" value="${esc(a.affected_unit||'')}" oninput="Screens._actset('${a.id}','affected_unit',this.value)" placeholder="unidad" style="border:none;padding:4px 0;font-family:var(--mono);width:100%"></td>
            <td class="center"><button class="iconbtn del" onclick="Screens._delAct('${a.id}')">×</button></td>

        <div class="rowbtns" style="margin-top:8px">
          <button class="btn ghost sm" onclick="Screens._addAct('${c.id}')">＋ Actividad</button>

        </div>
      </div>`;
    }).join('') : '<div class="empty" style="padding:18px"><p class="muted">Esta etapa aún no tiene componentes del proyecto.</p></div>';
    return `<div class="card"><div class="hd">
      <div style="display:flex;align-items:center;gap:10px"><span class="chip stage">Etapa</span>
        <h3 contenteditable="true" onblur="Screens._stageName('${s.id}',this.textContent)" style="outline:none;border-bottom:1px dashed transparent" onfocus="this.style.borderColor='var(--brand)'">${esc(s.name)}</h3></div>
      <div class="rowbtns"><span class="muted small">${comps.length} componente(s) · ${nAct} act.</span>
        <button class="iconbtn del" title="Eliminar etapa" onclick="Screens._delStage('${s.id}')">🗑</button></div>
    </div><div class="bd">
      ${compHTML}
      <div style="margin-top:14px"><button class="btn ghost sm" onclick="Screens._addComponent('${s.id}')">＋ Componente del proyecto</button></div>

    <p>Organiza el proyecto en tres niveles: <b>Etapa → Componente del proyecto → Actividad</b>. Así una misma actividad (p. ej. "Limpieza y retiro de materiales") puede existir en varios componentes con impactos distintos. También puedes cargar una plantilla sectorial desde la pantalla de Proyecto.</p>
    <button class="btn" onclick="Screens._addStage()">＋ Crear primera etapa</button></div></div></div>`;

Screens._addStage=function(){
  const presets=['Preparación del sitio','Construcción','Operación y mantenimiento','Abandono','Clausura','Postclausura'];
  const used=DB.stages.map(s=>s.name);
  const opts=presets.filter(p=>!used.includes(p));
  Modal.open('Nueva etapa',
    `<div class="field"><label>Nombre de la etapa</label><input type="text" id="stgName" placeholder="p. ej. Preparación del sitio"></div>
     ${opts.length?`<div class="muted small" style="margin-bottom:6px">Sugerencias:</div><div class="pill-row">${opts.map(o=>`<button class="btn ghost sm" onclick="document.getElementById('stgName').value='${esc(o)}'">${esc(o)}</button>`).join('')}</div>`:''}`,
    `<button class="btn ghost" onclick="Modal.close()">Cancelar</button><button class="btn" onclick="Screens._saveStage()">Crear etapa</button>`);
  setTimeout(()=>$('#stgName').focus(),50);
};
Screens._saveStage=function(){
  const n=$('#stgName').value.trim(); if(!n){Toast.show('Escribe un nombre','warn');return;}
  DB.stages.push({id:UID('STG'),name:n,sequence:DB.stages.length+1,description:''});
  audit('create','stage',n); touch(); Modal.close(); Router.refresh();
};
Screens._stageName=function(id,v){const s=Data.stage(id);if(s){s.name=v.trim()||s.name;touch();}};
Screens._delStage=function(id){
  const comps=Data.componentsOf(id); const acts=Data.activitiesOf(id);
  confirmBox(`Eliminar esta etapa${comps.length?', sus '+comps.length+' componente(s)':''}${acts.length?' y '+acts.length+' actividad(es)':''}? Las interacciones e impactos asociados también se retirarán.`,()=>{
    const actIds=acts.map(a=>a.id); const compIds=comps.map(c=>c.id);
    DB.impacts=DB.impacts.filter(i=>!actIds.includes(i.activity_id));
    DB.interactions=DB.interactions.filter(x=>!actIds.includes(x.activity_id));
    DB.activities=DB.activities.filter(a=>!compIds.includes(a.component_id));
    DB.components=DB.components.filter(c=>c.stage_id!==id);
    DB.stages=DB.stages.filter(s=>s.id!==id);
    audit('delete','stage',id); touch(); Router.refresh();
  },'Eliminar',true);
};
/* --- componentes del proyecto (subetapas) --- */
Screens._addComponent=function(stageId){
  const presets=['Preliminares','Urbanización','Edificación','Infraestructura','Actividades de operación','Demolición','Restauración','General'];
  const used=Data.componentsOf(stageId).map(c=>c.name);
  const opts=presets.filter(p=>!used.includes(p));
  Modal.open('Nuevo componente del proyecto',
    `<div class="field"><label>Nombre del componente (subetapa)</label><input type="text" id="cmpName" placeholder="p. ej. Urbanización"></div>
     ${opts.length?`<div class="muted small" style="margin-bottom:6px">Sugerencias:</div><div class="pill-row">${opts.map(o=>`<button class="btn ghost sm" onclick="document.getElementById('cmpName').value='${esc(o)}'">${esc(o)}</button>`).join('')}</div>`:''}`,
    `<button class="btn ghost" onclick="Modal.close()">Cancelar</button><button class="btn" onclick="Screens._saveComponent('${stageId}')">Crear componente</button>`);
  setTimeout(()=>$('#cmpName').focus(),50);
};
Screens._saveComponent=function(stageId){
  const n=$('#cmpName').value.trim(); if(!n){Toast.show('Escribe un nombre','warn');return;}
  DB.components.push({id:UID('CMP'),stage_id:stageId,name:n,sequence:Data.componentsOf(stageId).length+1,description:''});
  audit('create','component',n); touch(); Modal.close(); Router.refresh();
};
Screens._compName=function(id,v){const c=Data.component(id);if(c){c.name=v;touch();}};
Screens._delComponent=function(id){
  const acts=Data.activitiesOfComponent(id);
  confirmBox(`Eliminar este componente${acts.length?' y sus '+acts.length+' actividad(es)':''}? Las interacciones e impactos asociados también se retirarán.`,()=>{
    const actIds=acts.map(a=>a.id);
    DB.impacts=DB.impacts.filter(i=>!actIds.includes(i.activity_id));
    DB.interactions=DB.interactions.filter(x=>!actIds.includes(x.activity_id));
    DB.activities=DB.activities.filter(a=>a.component_id!==id);
    DB.components=DB.components.filter(c=>c.id!==id);
    audit('delete','component',id); touch(); Router.refresh();
  },'Eliminar',true);
};
/* --- actividades --- */
Screens._addAct=function(componentId){
  const a={id:UID('ACT'),component_id:componentId,name:'Nueva actividad',description:'',affected_area:'',affected_unit:''};
  DB.activities.push(a); audit('create','activity',a.name); touch(); Router.refresh();
};
Screens._quickAdd=function(componentId){

     <textarea id="qaText" style="min-height:180px" placeholder="Desmonte, despalme y limpieza&#10;Trazo y nivelación&#10;Construcción de bodegas y oficina"></textarea>`,

Screens._saveQuickAdd=function(componentId){
  const lines=$('#qaText').value.split('\n').map(x=>x.trim()).filter(Boolean);

Screens._actset=function(id,k,v){const a=Data.activity(id);if(a){a[k]=v;touch();}};
Screens._delAct=function(id){
  const imps=DB.impacts.filter(i=>i.activity_id===id);
  const doIt=()=>{ DB.impacts=DB.impacts.filter(i=>i.activity_id!==id); DB.interactions=DB.interactions.filter(x=>x.activity_id!==id);
    DB.activities=DB.activities.filter(a=>a.id!==id); audit('delete','activity',id); touch(); Router.refresh(); };
  if(imps.length) confirmBox(`Esta actividad tiene ${imps.length} impacto(s). ¿Eliminar de todos modos?`,doIt,'Eliminar',true); else doIt();
};

/* ---------- 03 · FACTORES AMBIENTALES ---------- */
const MEDIA=CATALOG.medios.map(m=>({id:m.c,label:m.n}));
const SENS=[['VERY_LOW','Muy baja'],['LOW','Baja'],['MEDIUM','Media'],['HIGH','Alta'],['VERY_HIGH','Muy alta']];
Screens.factors=function(){
  const rows = DB.factors.length? DB.factors.map(f=>{
    const mCat=Catalog.medio(f.medium);
    const compObj=mCat?Catalog.componentByName(f.medium,f.component):null;
    const compCustom=f._cComp||!mCat||(f.component&&!compObj);
    const facObj=compObj?CATALOG.factores.find(x=>x.comp===compObj.c&&x.n===f.name):null;
    const facCustom=f._cFac||!compObj||(f.name&&!facObj);
    // Medio
    const medioCell=`<select onchange="Screens._facMedio('${f.id}',this.value)" style="border:none;font-size:12px;width:100%">
      <option value="">— Medio —</option>${CATALOG.medios.map(m=>`<option value="${m.c}" ${f.medium===m.c?'selected':''}>${esc(m.n)}</option>`).join('')}</select>`;
    // Componente
    let compCell;
    if(compCustom){
      compCell=`<div style="display:flex;gap:4px;align-items:center"><input type="text" value="${esc(f.component||'')}" placeholder="Componente" oninput="Screens._facset('${f.id}','component',this.value)" style="border:none;color:var(--ink-2);flex:1">${mCat?`<button class="iconbtn" title="Elegir del catálogo" onclick="Screens._facCompMode('${f.id}',false)" style="width:22px;height:22px;font-size:11px">▾</button>`:''}</div>`;
    } else {
      compCell=`<select onchange="Screens._facComp('${f.id}',this.value)" style="border:none;font-size:12px;width:100%">
        <option value="">— Componente —</option>${Catalog.componentsOfMedio(f.medium).map(c=>`<option value="${c.c}" ${compObj&&compObj.c===c.c?'selected':''}>${esc(c.n)}</option>`).join('')}<option value="__custom__">✎ Otro…</option></select>`;
    }
    // Factor
    let facCell;
    if(facCustom){
      facCell=`<div style="display:flex;gap:4px;align-items:center"><input type="text" value="${esc(f.name||'')}" placeholder="Factor" oninput="Screens._facset('${f.id}','name',this.value)" style="border:none;font-weight:600;flex:1">${compObj?`<button class="iconbtn" title="Elegir del catálogo" onclick="Screens._facFacMode('${f.id}',false)" style="width:22px;height:22px;font-size:11px">▾</button>`:''}</div>`;
    } else {
      facCell=`<select onchange="Screens._facPick('${f.id}',this.value)" style="border:none;font-size:12px;font-weight:600;width:100%">
        <option value="">— Factor —</option>${Catalog.factorsOfComponent(compObj.c).map(x=>`<option value="${x.c}" ${facObj&&facObj.c===x.c?'selected':''}>${esc(x.n)}</option>`).join('')}<option value="__custom__">✎ Otro…</option></select>`;
    }
    return `<tr>
      <td>${medioCell}</td>
      <td>${compCell}</td>
      <td>${facCell}</td>
      <td><input type="text" value="${esc(f.indicator)}" placeholder="p. ej. pH, DBO, ha" oninput="Screens._facset('${f.id}','indicator',this.value)" style="border:none;color:var(--ink-2)"></td>
      <td><select onchange="Screens._facset('${f.id}','sensitivity',this.value)" style="border:none;font-size:12px">
        <option value="">—</option>${SENS.map(s=>`<option value="${s[0]}" ${f.sensitivity===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select></td>
      <td class="center">${f.code?`<span class="chip gray" title="Código de catálogo" style="font-size:10px">${esc(f.code)}</span>`:''}</td>
      <td class="center"><button class="iconbtn del" onclick="Screens._delFactor('${f.id}')">×</button></td>
    </tr>`;
  }).join('') : '';
  return `<div class="page-head"><div class="titles"><div class="step-tag">Paso 03 · Medio ambiente</div><h2>Factores ambientales</h2>
    <div class="sub">Jerarquía <b>Medio → Componente → Factor</b> tomada de la Base Maestra Ambiental (SEMARNAT/LGEEPA): elige en cascada o escribe libremente con <b>✎ Otro</b>. La sensibilidad se guarda como dato (no entra en la fórmula Conesa).</div></div>
    <div class="rowbtns">
      <button class="btn ghost" onclick="Screens._bulkFactors()">⇉ Agregar desde catálogo</button>
      <button class="btn" onclick="Screens._addFactor()">＋ Nuevo factor</button>
    </div></div>
    <div class="card"><div class="bd">
      ${DB.factors.length? `<table class="tbl"><thead><tr><th style="width:150px">Medio</th><th style="width:160px">Componente</th><th>Factor</th><th style="width:150px">Indicador</th><th style="width:100px">Sensibilidad</th><th style="width:56px">Cat.</th><th style="width:44px"></th></tr></thead><tbody>${rows}</tbody></table>`
      : `<div class="empty"><div class="ic">❋</div><h4>Sin factores todavía</h4><p>Registra los factores ambientales que podrían verse modificados. Elígelos del catálogo (208 factores) o agrégalos uno a uno.</p><div class="rowbtns" style="justify-content:center"><button class="btn ghost" onclick="Screens._bulkFactors()">⇉ Agregar desde catálogo</button><button class="btn" onclick="Screens._addFactor()">＋ Agregar factor</button></div></div>`}
    </div></div>
    ${DB.factors.length?`<div class="small muted">Al elegir un factor del catálogo se guarda su código (p. ej. ATM-01), lo que habilita sugerencias de impacto en la matriz. Usa <b>✎ Otro</b> en cualquier nivel para capturar factores no catalogados.</div>`:''}`;
};
Screens._addFactor=function(){ DB.factors.push({id:UID('FAC'),medium:'',component:'',component_code:'',name:'',code:'',indicator:'',unit:'',sensitivity:''}); touch(); Router.refresh(); };
Screens._facMedio=function(id,v){const f=Data.factor(id);if(!f)return;f.medium=v;f.component='';f.component_code='';f.name='';f.code='';f._cComp=false;f._cFac=false;touch();Nav.render();Router.refresh();};
Screens._facComp=function(id,v){const f=Data.factor(id);if(!f)return;
  if(v==='__custom__'){f._cComp=true;f.component='';f.component_code='';f.name='';f.code='';f._cFac=false;}
  else{const c=Catalog.component(v);f.component=c?c.n:'';f.component_code=v;f._cComp=false;f.name='';f.code='';f._cFac=false;}
  touch();Router.refresh();};
Screens._facCompMode=function(id,custom){const f=Data.factor(id);if(!f)return;f._cComp=custom;if(!custom){f.component='';f.component_code='';}touch();Router.refresh();};
Screens._facPick=function(id,v){const f=Data.factor(id);if(!f)return;
  if(v==='__custom__'){f._cFac=true;f.name='';f.code='';}
  else{const x=Catalog.factor(v);if(x){f.name=x.n;f.code=x.c;f.tipo=x.t;f.component_code=x.comp;f._cFac=false;}}
  touch();Nav.render();Router.refresh();};
Screens._facFacMode=function(id,custom){const f=Data.factor(id);if(!f)return;f._cFac=custom;if(!custom){f.name='';f.code='';}touch();Router.refresh();};
Screens._facset=function(id,k,v){const f=Data.factor(id);if(f){f[k]=v;if(k==='component')f.component_code='';if(k==='name')f.code='';touch(); if(k==='medium'||k==='name'||k==='component')Nav.render();}};
Screens._bulkFactors=function(){
  const g={}; CATALOG.medios.forEach(m=>{g[m.c]={name:m.n,comps:{}};});
  CATALOG.componentes.forEach(c=>{if(g[c.m])g[c.m].comps[c.c]={name:c.n,factors:Catalog.factorsOfComponent(c.c)};});
  const body=`<p class="small muted" style="margin-top:0">Marca los factores a agregar. Se guardan con su código de catálogo. Puedes filtrar escribiendo.</p>

    <div id="bulkList" style="max-height:52vh;overflow:auto">
    ${CATALOG.medios.map(m=>`<div class="bulk-medio"><div class="rsubh" style="margin:10px 0 6px">${esc(m.n)}</div>
      ${Object.values(g[m.c].comps).filter(c=>c.factors.length).map(c=>`<div style="margin:4px 0 8px">
        <div class="muted small" style="font-weight:600;margin-bottom:3px">${esc(c.name)}</div>
        <div class="bulk-facs" style="display:flex;flex-wrap:wrap;gap:6px">
          ${c.factors.map(x=>`<label class="bulk-fac" data-name="${esc(x.n.toLowerCase())}" style="display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px">

        </div></div>`).join('')}

};
Screens._bulkFilter=function(q){q=(q||'').toLowerCase();

  $$('#bulkList .bulk-medio').forEach(m=>{const any=$$('.bulk-fac',m).some(l=>l.style.display!=='none');m.style.display=any?'':'none';});

Screens._bulkAdd=function(){

Screens._delFactor=function(id){

    DB.factors=DB.factors.filter(f=>f.id!==id); touch(); Nav.render(); Router.refresh(); };

/* ---------- 04 · MATRIZ DE INTERACCIÓN ---------- */
Screens.matrix=function(){
  if(!DB.activities.length || !DB.factors.length){
    return `<div class="page-head"><div class="titles"><div class="step-tag">Paso 04 · Cruce</div><h2>Matriz de interacción</h2></div></div>
    <div class="card"><div class="bd"><div class="empty"><div class="ic">⊞</div><h4>Faltan actividades o factores</h4>
    <p>La matriz cruza cada actividad con cada factor. Necesitas al menos una actividad (paso 02) y un factor (paso 03).</p>
    <div class="rowbtns" style="justify-content:center">${!DB.activities.length?'<button class="btn ghost" onclick="Router.go(\'stages\')">Ir a actividades</button>':''}${!DB.factors.length?'<button class="btn ghost" onclick="Router.go(\'factors\')">Ir a factores</button>':''}</div></div></div></div>`;
  }
  const acts=Data.activitiesOrdered();
  // Orden estable de la matriz, independiente de cómo se generaron: medio → componente → factor
  const medioOrder=(code)=>{const ix=CATALOG.medios.findIndex(m=>m.c===code);return ix<0?99:ix;};
  const facts=DB.factors.slice().sort((a,b)=>
    (medioOrder(a.medium)-medioOrder(b.medium)) ||
    String(a.component||'').localeCompare(String(b.component||''),'es') ||
    String(a.name||'').localeCompare(String(b.name||''),'es'));
  // Tramos contiguos de medio (para agrupar con rowspan la columna de la izquierda)
  const medioCellFor={}; {let i=0; while(i<facts.length){const code=facts[i].medium;let j=i;while(j<facts.length&&facts[j].medium===code)j++;medioCellFor[facts[i].id]={label:Catalog.medioLabel(code)||'(sin medio)',count:j-i};i=j;}}
  // Agrupadores contiguos (acts ya viene en orden Etapa›Componente›Actividad)
  const COLW=30;
  const runsBy=(keyFn,labelFn)=>{const r=[];acts.forEach(a=>{const k=keyFn(a);const last=r[r.length-1];if(last&&last.k===k)last.span++;else r.push({k,span:1,label:labelFn(a)});});return r;};
  const stageRuns=runsBy(a=>{const s=Data.stageOf(a);return s?s.id:'__';},a=>{const s=Data.stageOf(a);return s?s.name:'(sin etapa)';});
  const compRuns=runsBy(a=>{const c=Data.componentOf(a);return c?c.id:'__';},a=>{const c=Data.componentOf(a);return c?c.name:'(sin componente)';});
  const grpRow=(cls,corner,runs)=>`<tr class="grp ${cls}"><th class="corner mc"></th><th class="corner">${corner}</th>`+
    runs.map(r=>`<th colspan="${r.span}" title="${esc(r.label)}"><div class="grp-lbl" style="width:${r.span*COLW}px">${esc(r.label)}</div></th>`).join('')+`<th class="grp-sum"></th></tr>`;
  let head=grpRow('grp1','Etapa',stageRuns)+grpRow('grp2','Componente',compRuns)+
    `<tr class="acts"><th class="corner mc">Medio</th><th class="corner">Factor ambiental \\ Actividad</th>`+
    acts.map(a=>`<th title="${esc(a.name)}  ·  ${esc(Data.activityPath(a))}"><div class="comp-head">${esc(a.name)}</div></th>`).join('')+
    `<th class="sumcorner" title="Σ impactos del factor (fila)">Σ</th></tr>`;
  const colSum={}; acts.forEach(a=>colSum[a.id]=0); let grand=0;
  let body=facts.map(f=>{
    let rowSum=0;
    const cells=acts.map(a=>{
        const it=Data.interaction(a.id,f.id); const on=it&&it.exists;
        const imps=Data.impactsOf(a.id,f.id);
        rowSum+=imps.length; colSum[a.id]+=imps.length;
        let hasN=false,hasP=false; imps.forEach(im=>{im.nature==='POS'?hasP=true:hasN=true;});
        const ncls=imps.length?(hasN&&hasP?'n-mix':hasP?'n-pos':'n-neg'):(on?'on':'');
        const natTxt=imps.length?(hasN&&hasP?'mixto (±)':hasP?'positivo':'negativo'):'';
        const title=imps.length?`${imps.length} impacto(s) ${natTxt} — clic para ver o quitar`:(on?'Interacción sin impactos — clic para agregar o quitar':'Sin interacción — clic para agregar impactos');
        return `<td><div class="cell ${ncls}" onclick="Screens._toggleCell('${a.id}','${f.id}')" title="${title}">${imps.length?`<span class="imn">${imps.length}</span>`:(on?'✓':'')}</div></td>`;
      }).join('');
    grand+=rowSum;
    const mcell=medioCellFor[f.id]?`<th class="medio-col" rowspan="${medioCellFor[f.id].count}" title="${esc(medioCellFor[f.id].label)}"><div class="medio-rot">${esc(medioCellFor[f.id].label)}</div></th>`:'';
    return `<tr>${mcell}<th title="${esc(f.name)}">${esc(Data.factorLabel(f))}</th>`+cells+`<td class="sumcell" title="Total de la fila">${rowSum||''}</td></tr>`;
  }).join('');
  body+=`<tr class="sumrow"><th class="medio-col"></th><th class="corner">Σ actividad</th>`+acts.map(a=>`<td title="Total de la columna">${colSum[a.id]||''}</td>`).join('')+`<td class="grand" title="Total de impactos">${grand||''}</td></tr>`;
  const nInter=DB.interactions.filter(i=>i.exists).length;
  const nImp=DB.impacts.length;
  return `<div class="page-head"><div class="titles"><div class="step-tag">Paso 04 · Cruce</div><h2>Matriz de interacción</h2>
    <div class="sub">Marca las celdas donde una actividad puede afectar a un factor. Una celda activa puede generar uno o varios impactos. El número en la celda indica cuántos impactos tiene.</div></div>
    <div class="rowbtns"><span class="chip gray">${nInter} interacciones</span><span class="chip gray">${nImp} impactos</span><button class="btn ghost" onclick="Export.matrixPng()">🖼 Imagen (PNG)</button><button class="btn ghost" onclick="Export.matrixXls()">⊞ Excel</button></div></div>
    <div class="card"><div class="bd" style="padding:10px">
      <div class="matrix-wrap" id="mtxScroll" onscroll="Screens._mtxSaveScroll(this)"><table class="matrix"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    </div></div>
    <div class="mtx-legend"><span><span class="sw" style="background:#F1D7D7"></span>Negativo</span><span><span class="sw" style="background:#D7E3EF"></span>Positivo</span><span><span class="sw" style="background:#E1D8EC"></span>Mixto (naturalezas distintas)</span></div>
    <div class="small muted" style="margin-top:6px">El color de cada celda indica la naturaleza de sus impactos; el número, cuántos hay. Encabezados rotados (pasa el cursor para ver la ruta). Los encabezados y factores quedan fijos al desplazarte.</div>`;
};

Screens._toggleCell=function(aid,fid){

Screens._removeInteraction=function(aid,fid){
  const imps=Data.impactsOf(aid,fid);
  const doIt=()=>{
    const ids=imps.map(i=>i.id);
    DB.impacts=DB.impacts.filter(i=>!ids.includes(i.id));
    DB.assessments=DB.assessments.filter(a=>!ids.includes(a.impact_id));
    DB.measures.forEach(m=>m.impact_ids=(m.impact_ids||[]).filter(x=>!ids.includes(x)));
    DB.interactions=DB.interactions.filter(x=>!(x.activity_id===aid&&x.factor_id===fid));
    audit('delete','interaction',aid+'×'+fid); touch(); Modal.close(); Screens._mtxRefresh();
    Toast.show('Interacción quitada');
  };
  if(imps.length) confirmBox(`Al quitar esta interacción se eliminarán también sus ${imps.length} impacto(s) y valoración(es). ¿Continuar?`, doIt, 'Quitar interacción', true);
  else doIt();
};

    `<div class="alert info"><span class="ai">↳</span><span>Cadena: <b>${esc(a?a.name:'—')}</b> → <i>aspecto</i> → <b>${esc(f?f.name:'—')}</b> → impacto. El catálogo filtra aspectos e impactos según el factor${f&&f.code?' ('+esc(f.code)+')':''} y la naturaleza.</span></div>
     <div id="cellImpList">${list}</div>
     <div class="divider"></div>

       <div class="field"><label>Naturaleza</label><div class="opts">
         <label class="opt sel" onclick="Screens._natPick(this,'NEG')" data-n="NEG"><span class="ov">▼</span><span class="ol">Negativo</span></label>
         <label class="opt" onclick="Screens._natPick(this,'POS')" data-n="POS"><span class="ov">▲</span><span class="ol">Positivo</span></label>

Screens._pickedNature='NEG'; Screens._pickedAspect=''; Screens._pickedImpCode=''; Screens._suggList=[];
Screens._natPick=function(elm,n){$$('#overlay .opt[data-n]').forEach(o=>o.classList.remove('sel'));elm.classList.add('sel');Screens._pickedNature=n;
  const w=$('#impSuggestWrap'); if(w)w.innerHTML=Screens._suggestHTML(Screens._cellFid);};

Screens._addImpact=function(aid,fid){
  const name=$('#newImpName').value.trim(); if(!name){Toast.show('Escribe o elige el nombre del impacto','warn');return;}
  const a=Data.activity(aid),f=Data.factor(fid);
  // La marca de la matriz nace aquí: se crea la interacción al registrar el primer impacto.
  let it=Data.interaction(aid,fid);
  if(!it){ it={id:UID('INT'),activity_id:aid,factor_id:fid,exists:true}; DB.interactions.push(it); audit('interaction',aid+'×'+fid,'activada'); }
  const aspCode=(($('#aspSel')||{}).value)||''; const asp=aspCode?Catalog.aspect(aspCode):null;
  const facCode=(f&&f.code)||(f&&Catalog.factorByName(f.name)||{}).c||'';
  const impCode=Screens._pickedImpCode||'';
  // rel_type (Directa/Indirecta) y receptor sugerido desde el catálogo v2
  const relType=(aspCode&&impCode)?Catalog.relType(aspCode,facCode,impCode):'D';
  let recep=impCode?Catalog.receptorOfImpact(impCode):null; if(!recep)recep=Catalog.receptorOfFactor(facCode);
  const imp={id:UID('IMP'),interaction_id:it.id,activity_id:aid,factor_id:fid,name,description:'',
    aspect_code:aspCode,aspect_name:asp?asp.n:'',aspect_family:asp?asp.fam:'',
    causal_mechanism:asp?`${a?a.name:''} → ${asp.n} → ${f?f.name:''}`:'',
    nature:Screens._pickedNature||'NEG',receptor:recep?recep.s:'',receptor_code:recep?recep.c:'',rel_type:relType,impact_code:impCode,status:'DRAFT',seq:DB.impacts.length+1};
  DB.impacts.push(imp); audit('create','impact',name); touch(); Modal.close(); Screens._mtxRefresh();
  Toast.show(recep?`Impacto creado · receptor sugerido: ${recep.s}`:'Impacto creado. Ábrelo en Valoración para caracterizarlo.');
};
Screens._delImpact=function(id,fromModal){
  const imp=Data.impact(id);
  confirmBox('¿Eliminar este impacto y su valoración?',()=>{
    DB.impacts=DB.impacts.filter(i=>i.id!==id);
    DB.assessments=DB.assessments.filter(a=>a.impact_id!==id);
    DB.measures.forEach(m=>m.impact_ids=(m.impact_ids||[]).filter(x=>x!==id));
    // Si la interacción quedó sin impactos, se retira su marca para no dejar celdas vacías.
    if(imp && !Data.impactsOf(imp.activity_id,imp.factor_id).length)
      DB.interactions=DB.interactions.filter(x=>!(x.activity_id===imp.activity_id&&x.factor_id===imp.factor_id));

/* ---------- 05 · IMPACTOS (lista global) ---------- */
Screens.impacts=function(){
  if(!DB.impacts.length){
    return `<div class="page-head"><div class="titles"><div class="step-tag">Paso 05 · Identificación</div><h2>Impactos</h2></div></div>
    <div class="card"><div class="bd"><div class="empty"><div class="ic">◈</div><h4>Sin impactos identificados</h4>
    <p>Los impactos se crean desde la matriz de interacción: activa una celda actividad×factor y registra el impacto que produce.</p>
    <button class="btn" onclick="Router.go('matrix')">Ir a la matriz</button></div></div></div>`;
  }
  const M=getMethod();
  const isValia=M.family==='valia';
  const expertOnly=!!Screens._impExpertOnly;
  const sort=Screens._impSort||'etapa';
  // orden global de actividades (para ordenar por etapa/componente/actividad)
  const ordered=(Data.activitiesOrdered?Data.activitiesOrdered():DB.activities);
  const actOrder={}; ordered.forEach((a,ix)=>actOrder[a.id]=ix);
  const medioIx=(code)=>{ try{ const ix=CATALOG.medios.findIndex(m=>m.c===code); return ix<0?99:ix; }catch(e){ return 99; } };
  // enriquecer impactos con campos derivados
  const rowsData=DB.impacts.map(i=>{
    const a=Data.activity(i.activity_id), f=Data.factor(i.factor_id);
    const st=a?Data.stageOf(a):null, comp=a?Data.componentOf(a):null;
    const as=Data.initialAssess(i.id); const valued=!!(as&&as.complete);
    const clsRank=valued?M.classes.findIndex(c=>c.id===as.cls):-1;
    const ci=valued&&as.cls?M.clsInfo(as.cls):null;
    const flag=isValia?VCore.flagFor(i):{type:'',route:''};
    return { i,a,f,st,comp,as,valued,ci,flag,
      etapa:st?st.name:'Sin etapa', etapaSeq:st?(st.sequence||0):999,
      compObra:comp?comp.name:'Sin componente',
      actName:a?a.name:'Sin actividad', actIx:actOrder[i.activity_id]!=null?actOrder[i.activity_id]:9999,
      medio:f&&f.medium?Catalog.medioLabel(f.medium):'Sin medio', medioOrd:f?medioIx(f.medium):99,
      compAmb:(f&&f.component)?f.component:'Sin componente ambiental',
      factor:f?f.name:'Sin factor',
      impName:i.name||'', aspecto:i.aspect_name||'Sin aspecto',
      score:valued?as.score:null, abs:valued?(as.abs!=null?as.abs:Math.abs(as.score)):-1,
      clsRankV:clsRank };
  });
  // definición de criterios de orden
  const SORTS={
    calificacion:{label:'Calificación (score del método)',mode:'flat',cmp:(a,b)=>(b.valued-a.valued)||(b.abs-a.abs)},
    significancia:{label:'Significancia',mode:'flat',cmp:(a,b)=>(b.valued-a.valued)||(b.clsRankV-a.clsRankV)||(b.abs-a.abs)},
    etapa:{label:'Etapa',mode:'group',keyOf:x=>x.etapa,ord:x=>x.etapaSeq},
    compObra:{label:'Componente (obra)',mode:'group',keyOf:x=>x.compObra,ord:x=>x.etapaSeq*1000+(x.comp?(x.comp.sequence||0):999)},
    actividad:{label:'Actividad',mode:'group',keyOf:x=>x.actName,ord:x=>x.actIx},
    medio:{label:'Medio ambiental',mode:'group',keyOf:x=>x.medio,ord:x=>x.medioOrd},
    compAmb:{label:'Componente ambiental',mode:'group',keyOf:x=>x.compAmb,ord:x=>x.compAmb.toLowerCase()},
    factor:{label:'Factor ambiental',mode:'group',keyOf:x=>x.factor,ord:x=>x.factor.toLowerCase()},
    impacto:{label:'Impacto ambiental (A–Z)',mode:'flat',cmp:(a,b)=>a.impName.localeCompare(b.impName,'es')},
    aspecto:{label:'Aspecto ambiental',mode:'group',keyOf:x=>x.aspecto,ord:x=>x.aspecto.toLowerCase()}
  };
  const S=SORTS[sort]||SORTS.etapa;
  const expertN=isValia?rowsData.filter(r=>r.flag.route==='EXPERTA').length:0;
  const flagN=isValia?rowsData.filter(r=>r.flag.type).length:0;
  let rowsView=rowsData;
  if(isValia&&expertOnly)rowsView=rowsData.filter(r=>r.flag.route==='EXPERTA');
  const rowHTML=(r)=>`<div class="imp-row">
        <span class="idx">${esc(r.i.id.slice(0,10))}</span>
        <div class="info"><div class="nm">${esc(r.i.name)}${isValia&&r.flag.type?` <span class="chip flag" title="Receptor con salvaguarda no compensable">⚑ ${esc(VCore.salvShort(r.flag.type))}</span>`:''}${isValia&&r.flag.route==='EXPERTA'?` <span class="chip" style="background:#F7E0E1;color:#C0392B;border-color:transparent" title="Impacto sobre receptor protegido: requiere revisión por experto">Revisión experta</span>`:''}</div>
          <div class="meta"><span>${esc(r.medio)} › ${esc(r.compAmb)} · ${esc(r.compObra)} · ${esc(r.actName)} → ${esc(r.factor)}${r.aspecto&&r.aspecto!=='Sin aspecto'?' · '+esc(r.aspecto):''}</span><span class="nat-tag ${r.i.nature==='POS'?'p':'n'}">${r.i.nature==='POS'?'▲':'▼'} ${r.i.nature==='POS'?'Positivo':'Negativo'}</span></div></div>
        ${r.valued?`<span class="score" style="color:var(--${clsVar(r.ci.cls)})">${fmtScore(M,r.score)}</span><span class="chip ${r.ci.cls}">${r.ci.label}</span>`:'<span class="chip gray">Sin valorar</span>'}
        <button class="btn ghost sm" onclick="Assess.edit('${r.i.id}')">${r.valued?'Editar':'Evaluar'}</button>
        <button class="iconbtn del" onclick="Screens._delImpact('${r.i.id}')">🗑</button>
      </div>`;
  let listHTML='';
  if(S.mode==='flat'){
    const rs=rowsView.slice().sort(S.cmp);
    listHTML=`<div class="card"><div class="hd"><h3>${esc(S.label)}</h3><span class="desc">${rs.length} impacto(s)</span></div><div class="bd">${rs.map(rowHTML).join('')}</div></div>`;
  } else {
    const groups={};
    rowsView.forEach(r=>{const k=S.keyOf(r); if(!groups[k])groups[k]={ord:S.ord(r),rows:[]}; groups[k].rows.push(r);});
    listHTML=Object.entries(groups).sort((A,B)=>{const oa=A[1].ord,ob=B[1].ord; return (typeof oa==='number'&&typeof ob==='number')?oa-ob:String(oa).localeCompare(String(ob),'es');})
      .map(([k,g])=>`<div class="card"><div class="hd"><h3>${esc(k)}</h3><span class="desc">${g.rows.length} impacto(s)</span></div><div class="bd">${g.rows.map(rowHTML).join('')}</div></div>`).join('');
  }
  const opts=Object.entries(SORTS).map(([k,v])=>`<option value="${k}" ${sort===k?'selected':''}>${esc(v.label)}</option>`).join('');
  const done=DB.impacts.filter(i=>{const as=Data.initialAssess(i.id);return as&&as.complete;}).length;
  const valiaBar=(isValia&&flagN)?`<div class="alert" style="margin-bottom:14px;background:#FBEDED;border-color:#E7C3C3"><span class="ai" style="color:#C0392B">⚑</span><span><b>${flagN} impacto(s) sobre receptores con salvaguarda</b> (no compensable) · <b>${expertN}</b> requieren revisión por experto. VALIA-Core les aplica piso ≥ Alto.
    <button class="btn ghost sm" style="margin-left:8px" onclick="Screens._toggleExpert()">${expertOnly?'Ver todos':'Ver solo revisión experta'}</button></span></div>`:'';
  return `<div class="page-head"><div class="titles"><div class="step-tag">Paso 05 · Identificación</div><h2>Impactos identificados</h2>
    <div class="sub">${DB.impacts.length} impacto(s) · ${done} valorados · ${DB.impacts.length-done} pendientes.${isValia&&expertOnly?` <b>Mostrando solo revisión experta (${expertN}).</b>`:''} Cada impacto es una entidad independiente con su mecanismo causa–efecto.</div></div>
    <div class="rowbtns" style="align-items:center;gap:8px">
      <button class="btn ghost" onclick="Router.go('matrix')">＋ Desde la matriz</button>
      <span class="small muted" style="margin-left:6px">Ordenar por</span>
      <select onchange="Screens._setImpSort(this.value)" style="min-width:210px">${opts}</select>
    </div></div>
    ${valiaBar}
    ${listHTML}`;
};
Screens._setImpSort=function(v){ Screens._impSort=v; Router.refresh(); };
Screens._toggleExpert=function(){ Screens._impExpertOnly=!Screens._impExpertOnly; Router.refresh(); };

/* ============================================================
   10. EDITOR DE VALORACIÓN (motor activo)
   ============================================================ */
const Assess={
  edit(impId,type='INITIAL'){
    currentImpactId=impId; Assess.type=type;
    const M=getMethod();
    let as=type==='RESIDUAL'?Data.residualAssess(impId):Data.initialAssess(impId);
    if(!as){
      const init=Data.initialAssess(impId);
      as={id:UID('ASM'),impact_id:impId,method:M.id,type,parent_id:type==='RESIDUAL'&&init?init.id:null,
          nature:Data.impact(impId).nature,criteria:{},evaluator:DB.project.responsible||'',date:todayStr(),
          confidence_notes:''};
      if(type==='RESIDUAL'&&init){ as.criteria=JSON.parse(JSON.stringify(init.criteria)); } // parte del inicial
      DB.assessments.push(as);
    }
    as.method=M.id;
    // VALIA: preselecciona Salvaguarda=Sí si el receptor está protegido y aún no se ha fijado (no pisa una elección previa)
    if(M.family==='valia'){ const fl=VCore.flagFor(Data.impact(impId));
      if(fl.type && (!as.criteria.SV || as.criteria.SV.value==null)){ as.criteria.SV={value:2,justification:'Auto: receptor con salvaguarda ('+VCore.salvShort(fl.type)+') — no compensable, piso ≥ Alto',source:'',confidence:''}; } }
    Router.current='assess'; Router.refresh();
  }
};
Screens.assess=function(){
  const M=getMethod();
  if(!currentImpactId || !Data.impact(currentImpactId)){
    if(DB.impacts.length){ return Assess._picker(); }
    return `<div class="page-head"><div class="titles"><div class="step-tag">Paso 06 · Caracterización</div><h2>Valoración ${esc(M.name)}</h2></div></div>
      <div class="card"><div class="bd"><div class="empty"><div class="ic">∑</div><h4>Sin impactos que valorar</h4><p>Primero identifica impactos en la matriz.</p><button class="btn" onclick="Router.go('matrix')">Ir a la matriz</button></div></div></div>`;
  }
  const imp=Data.impact(currentImpactId);
  const as=Assess.type==='RESIDUAL'?Data.residualAssess(imp.id):Data.initialAssess(imp.id);
  const a=Data.activity(imp.activity_id),f=Data.factor(imp.factor_id);
  const st=a?Data.stageOf(a):null;

  // criterios
  const critHTML=M.criteria.map(c=>Assess._criterion(c,as)).join('');
  const done=M.criteria.filter(c=>as.criteria[c.code]&&as.criteria[c.code].value!=null).length;

  return `<div class="page-head"><div class="titles"><div class="step-tag">Paso 06 · Caracterización · ${Assess.type==='RESIDUAL'?'RESIDUAL':'INICIAL'}</div>
    <h2>${esc(imp.name)}</h2>
    <div class="pill-row" style="margin-top:5px;gap:6px">${f&&f.medium?`<span class="chip gray" title="Medio ambiental">Medio · ${esc(Catalog.medioLabel(f.medium))}</span>`:''}${f&&f.component?`<span class="chip brand" title="Componente ambiental">Componente · ${esc(f.component)}</span>`:''}</div>
    <div class="sub">${esc(a?Data.activityPath(a):(st?st.name:'—'))} · <b>${esc(a?a.name:'—')}</b> ${imp.aspect_name?'→ <i>'+esc(imp.aspect_name)+'</i> ':''}→ ${esc(f?f.name:'—')}</div></div>
    <div class="rowbtns">
      <button class="btn ghost sm" onclick="Assess._changeImpact()">↔ Cambiar impacto</button>
      ${Assess.type==='INITIAL'?'':'<button class="btn ghost sm" onclick="Assess.type=\'INITIAL\';Router.refresh()">Ver inicial</button>'}
    </div></div>
    ${Assess.type==='RESIDUAL'?(()=>{const ms=DB.measures.filter(m=>(m.impact_ids||[]).includes(imp.id));return `<div class="alert" style="margin-bottom:16px;background:var(--surface-2)"><span class="ai">❖</span><span>${ms.length?`<b>Medidas aplicadas a este impacto:</b> ${ms.map(m=>esc((typeof PMA!=='undefined'?PMA.outNum(m)+' · ':'')+(m.name||''))).join(' · ')}. Recaracteriza los criterios que estas medidas modifican (p. ej. intensidad, extensión, reversibilidad); el residual es una nueva valoración, no una reducción automática.`:'Aún no hay medidas asociadas a este impacto en el Plan de Manejo. El residual debe reflejar medidas concretas.'}</span></div>`;})():''}
    ${(M.family==='valia')?(()=>{const fl=VCore.flagFor(imp);if(!fl.type)return '';return `<div class="alert" style="margin-bottom:16px;background:#FBEDED;border-color:#E7C3C3"><span class="ai" style="color:#C0392B">⚑</span><span><b>Receptor con salvaguarda: ${esc(VCore.salvShort(fl.type))}</b> (no compensable). VALIA-Core aplica un <b>piso ≥ Alto</b> a este impacto${fl.route==='EXPERTA'?' y <b>requiere revisión por experto</b>':''}. El criterio <b>Salvaguarda</b> se preseleccionó en “Sí”; la compensación no reduce su significancia.</span></div>`;})():''}

  <div style="display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start">
    <div>
      <div class="card"><div class="hd"><h3>Identificación del impacto</h3></div><div class="bd">
        <div class="grid2">
          ${M.usesNature!==false?`<div class="field"><label>Naturaleza</label><div class="opts">
            <label class="opt ${imp.nature==='NEG'?'sel':''}" onclick="Assess._setNature('NEG')"><span class="ov">▼</span><span class="ol">Negativo</span></label>
            <label class="opt ${imp.nature==='POS'?'sel':''}" onclick="Assess._setNature('POS')"><span class="ov">▲</span><span class="ol">Positivo</span></label>
          </div></div>`:
          (M.categories?`<div class="field"><label>Categoría ambiental <span class="muted" style="font-weight:400">(RIAM)</span></label>
            <select onchange="Assess._setCat(this.value)">
              <option value="">— Seleccionar —</option>
              ${M.categories.map(c=>`<option value="${c.c}" ${(as.category===c.c)?'selected':''}>${c.c} · ${esc(c.n)}</option>`).join('')}
            </select>
            <div class="hint">El signo (positivo/negativo) lo determina A2, no un selector de naturaleza.</div></div>`:
          `<div class="field"><label>Naturaleza</label><div class="chip gray" style="margin-top:4px">Determinada por el signo de la Magnitud (M)</div>
            <div class="hint">En Leopold, una Magnitud negativa indica efecto adverso y una positiva, benéfico. Asigna el signo al valorar M.</div></div>`)}
          <div class="field"><label>Receptor</label><input type="text" list="recepList" value="${esc(imp.receptor)}" oninput="Assess._impset('receptor',this.value)" placeholder="Elige o escribe el receptor">
            <datalist id="recepList">${Catalog.receptors().map(r=>`<option value="${esc(r.s)}">${esc(r.t)}</option>`).join('')}</datalist></div>
        </div>
        <div class="field"><label>Descripción</label><textarea oninput="Assess._impset('description',this.value)" placeholder="Qué ocurre y dónde">${esc(imp.description)}</textarea></div>
        <div class="field"><label>Mecanismo causa–efecto</label><textarea oninput="Assess._impset('causal_mechanism',this.value)" placeholder="Acción → presión → cambio → receptor → impacto">${esc(imp.causal_mechanism)}</textarea>
          <div class="hint">${imp.aspect_name?`Aspecto: <b>${esc(imp.aspect_name)}</b> · `:''}Requerido cuando el Efecto (EF) es indirecto.</div></div>
      </div></div>

      <div class="card"><div class="hd"><h3>Criterios de caracterización</h3>
        <span class="desc"><span class="mono">${done}/${M.criteria.length}</span> evaluados</span></div>
        <div class="bd">
          <div class="progress" style="margin-bottom:16px"><div class="pf" style="width:${done/M.criteria.length*100}%"></div></div>
          ${critHTML}
        </div>
      </div>
    </div>

    <div class="calc-panel">
      <div class="card" id="calcCard">${Assess._calcPanel(as)}</div>
    </div>
  </div>`;
};
Assess._criterion=function(c,as){
  const e=as.criteria[c.code]||{};
  const isDone=e.value!=null;
  const finalVal=(e.value||0)+(e.modifier||0);
  const opts=c.scale.map(s=>`<label class="opt ${e.value===s.v?'sel':''}" onclick="Assess._pick('${c.code}',${s.v})"><span class="ov">${s.v}</span><span class="ol">${esc(s.l)}</span></label>`).join('');
  const modHTML=c.modifier?`<div class="modext">
    <input type="checkbox" id="mod_${c.code}" ${e.modifier===c.modifier.v?'checked':''} onchange="Assess._mod('${c.code}',this.checked?${c.modifier.v}:0)">
    <label for="mod_${c.code}" style="margin:0;cursor:pointer">${esc(c.modifier.l)}</label></div>`:'';
  return `<div class="crit ${isDone?'done':''}" id="crit_${c.code}">
    <div class="chd" onclick="Assess._toggleCrit('${c.code}')">
      <span class="code">${c.code}</span><span class="cname">${esc(c.name)}</span>
      ${c.weight?`<span class="w">×${c.weight}</span>`:(c.group?`<span class="w">Grupo ${c.group}</span>`:'')}
      <span class="selval">${isDone?finalVal:'—'}</span>
      <span class="chev">›</span>
    </div>
    <div class="cbd">
      <div class="help"><b>Evalúa:</b> ${esc(c.help.ev)}${c.help.no!=='—'?` <span class="no">No evalúa:</span> ${esc(c.help.no)}`:''}</div>
      <div class="opts">${opts}</div>
      ${modHTML}
      <div class="field" style="margin-bottom:8px"><label>Justificación técnica <span class="req">*</span></label>
        <textarea placeholder="Fundamento de la selección (dato, superficie, inventario, referencia…)" oninput="Assess._just('${c.code}',this.value)">${esc(e.justification||'')}</textarea></div>
      <div class="inline">
        <div class="field" style="margin:0"><label>Fuente / evidencia</label><input type="text" value="${esc(e.source||'')}" placeholder="p. ej. Inventario de vegetación 2026" oninput="Assess._src('${c.code}',this.value)"></div>
        <div class="field" style="margin:0;max-width:150px"><label>Nivel de confianza</label><select onchange="Assess._conf('${c.code}',this.value)">
          <option value="">—</option>${['HIGH','MEDIUM','LOW'].map(cf=>`<option value="${cf}" ${e.confidence===cf?'selected':''}>${({HIGH:'Alta',MEDIUM:'Media',LOW:'Baja'})[cf]}</option>`).join('')}</select></div>
      </div>
    </div></div>`;
};
Assess._calcPanel=function(as){
  const M=getMethod();
  const imp=Data.impact(as.impact_id);
  const errs=M.validate(as.criteria);
  const complete=errs.length===0;
  let inner;
  if(!complete){
    const done=M.criteria.filter(c=>as.criteria[c.code]&&as.criteria[c.code].value!=null).length;
    inner=`<div class="hd"><h3>Resultado</h3><span class="desc">provisional</span></div><div class="bd">
      <div class="calc-result"><div class="imp-val" style="color:var(--ink-3)">—</div>
        <div class="muted small" style="margin-top:8px">Faltan ${M.criteria.length-done} criterio(s) por evaluar</div></div>
      <div class="progress"><div class="pf" style="width:${done/M.criteria.length*100}%"></div></div>
    </div>`;
  } else {
    const r=M.calculate(as.criteria,imp.nature);
    const ci=M.clsInfo(r.cls);
    const cons=M.consistency(as.criteria,imp);
    const extra=M.panelExtra?M.panelExtra(as.criteria,r):'';
    inner=`<div class="hd"><h3>Resultado</h3><span class="desc">${esc(M.id)}</span></div><div class="bd">
      <div class="calc-result">
        <div class="imp-val" style="color:var(--${clsVar(ci.cls)})">${fmtScore(M,r.score)}</div>
        <div class="imp-cls"><span class="chip ${ci.cls}" style="font-size:13px;padding:4px 12px">${ci.label}</span></div>
      </div>
      <div class="muted small" style="text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Memoria de cálculo</div>
      <div class="calc-memory">
        <div><span class="op">${esc(M.scoreLabel||'I')}</span> = ${esc(M.equation.replace(/^[A-Za-z]+\s*=\s*/,''))}</div>
        ${r.memory.lines.map(l=>`<div>${esc(l)}</div>`).join('')}
        <div><span class="res">${esc(r.memory.result)}</span> → ${ci.label.toUpperCase()}</div>
      </div>
      <div class="divider"></div>
      ${extra}
      ${cons.length?`<div class="divider"></div><div class="muted small" style="text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Consistencia</div>
        ${cons.map(x=>`<div class="alert ${x.lvl}"><span class="ai">${x.lvl==='err'?'✕':x.lvl==='warn'?'⚠':'ℹ'}</span><span>${esc(x.t)}</span></div>`).join('')}`:''}
      <div class="divider"></div>
      <div class="grid2" style="gap:10px">
        <div class="field" style="margin:0"><label>Evaluador</label><input type="text" value="${esc(as.evaluator||'')}" oninput="Assess._meta('evaluator',this.value)"></div>
        <div class="field" style="margin:0"><label>Fecha</label><input type="date" value="${esc(as.date||todayStr())}" oninput="Assess._meta('date',this.value)"></div>
      </div>
      <div style="margin-top:10px" class="rowbtns">
        ${Assess.type==='INITIAL'?`<button class="btn sm" onclick="Assess._done()">✓ Guardar y volver</button>
          <button class="btn ghost sm" onclick="Router.go('measures')">Definir medidas →</button>`:
          `<button class="btn sm" onclick="Assess._done()">✓ Guardar residual</button>`}
      </div>
    </div>`;
  }
  return inner;
};
// --- setters en vivo ---
Assess._current=function(){return Assess.type==='RESIDUAL'?Data.residualAssess(currentImpactId):Data.initialAssess(currentImpactId);};
Assess._ensure=function(code){const as=Assess._current();if(!as.criteria[code])as.criteria[code]={value:null,modifier:0,justification:'',source:'',confidence:''};return as.criteria[code];};
Assess._pick=function(code,v){const e=Assess._ensure(code);e.value=v;const c=getMethod().criteria.find(x=>x.code===code);e.category=c.scale.find(s=>s.v===v).l;touch();Assess._refreshCrit(code);Assess._refreshCalc();};
Assess._mod=function(code,v){const e=Assess._ensure(code);e.modifier=v;touch();Assess._refreshCrit(code);Assess._refreshCalc();};
Assess._just=function(code,v){Assess._ensure(code).justification=v;touch();};
Assess._src=function(code,v){Assess._ensure(code).source=v;touch();};
Assess._conf=function(code,v){Assess._ensure(code).confidence=v;touch();};
Assess._meta=function(k,v){const as=Assess._current();as[k]=v;touch();};
Assess._setCat=function(v){const as=Assess._current();if(as){as.category=v;touch();}};
Assess._setMit=function(t){const as=Assess._current();if(!as)return;as.criteria=as.criteria||{};as.criteria.T={value:t};touch();Assess._refreshCalc();};
Assess._impset=function(k,v){const imp=Data.impact(currentImpactId);imp[k]=v;touch();};
Assess._setNature=function(n){const imp=Data.impact(currentImpactId);imp.nature=n;const as=Assess._current();as.nature=n;touch();
  $$('.card .opt').forEach(o=>{});Router.refresh();};
Assess._toggleCrit=function(code){$('#crit_'+code).classList.toggle('open');};
Assess._refreshCrit=function(code){
  const M=getMethod();const c=M.criteria.find(x=>x.code===code);const as=Assess._current();const e=as.criteria[code];
  const node=$('#crit_'+code);if(!node)return;
  const wasOpen=node.classList.contains('open');
  const tmp=el('div');tmp.innerHTML=Assess._criterion(c,as);const fresh=tmp.firstElementChild;
  if(wasOpen)fresh.classList.add('open');
  node.replaceWith(fresh);
};
Assess._refreshCalc=function(){
  const as=Assess._current();recalcAll();
  const card=$('#calcCard');if(card)card.innerHTML=Assess._calcPanel(as);
  // progreso encabezado
  const M=getMethod();const done=M.criteria.filter(c=>as.criteria[c.code]&&as.criteria[c.code].value!=null).length;
  const pf=$('.card .progress .pf');if(pf)pf.style.width=(done/M.criteria.length*100)+'%';
  Nav.render();$$('.nav a').forEach(a=>a.classList.remove('active'));const na=$('#nav-assess');if(na)na.classList.add('active');
};
Assess._done=function(){recalcAll();touch();Router.go('impacts');Toast.show('Valoración guardada');};
Assess._changeImpact=function(){ currentImpactId=null; Router.refresh(); };
Assess._picker=function(){
  const M=getMethod();
  const rows=DB.impacts.map(i=>{const as=Data.initialAssess(i.id);const a=Data.activity(i.activity_id),f=Data.factor(i.factor_id);
    return `<div class="imp-row"><div class="info"><div class="nm">${esc(i.name)}</div><div class="meta"><span>${esc(a?a.name:'—')} → ${esc(f?f.name:'—')}</span></div></div>
      ${as&&as.complete?`<span class="chip ${M.clsInfo(as.cls).cls}">${M.scoreLabel||'I'}=${fmtScore(M,as.score)}</span>`:'<span class="chip gray">Sin valorar</span>'}
      <button class="btn ghost sm" onclick="Assess.edit('${i.id}')">Evaluar</button></div>`;}).join('');
  return `<div class="page-head"><div class="titles"><div class="step-tag">Paso 06 · Caracterización</div><h2>Valoración ${esc(M.name)}</h2>
    <div class="sub">Elige un impacto para caracterizarlo con los ${M.criteria.length} criterios del método.</div></div></div>
    <div class="card"><div class="bd">${rows}</div></div>`;
};
/* ---------- 07 · MEDIDAS Y RESIDUAL ---------- */
const MEASURE_TYPES=[['PREVENTION','Prevención'],['MITIGATION','Mitigación'],['CORRECTION','Corrección'],['RESTORATION','Restauración'],['COMPENSATION','Compensación'],['MONITORING','Monitoreo']];
Screens.measures=function(){
  const M=getMethod();
  const priority=DB.impacts.filter(i=>{const as=Data.initialAssess(i.id);return as&&as.complete&&isNeg(i,as,M)&&(M.severeIds||[]).includes(as.cls);});
  const valued=DB.impacts.filter(i=>{const as=Data.initialAssess(i.id);return as&&as.complete;});
  if(!valued.length){
    return `<div class="page-head"><div class="titles"><div class="step-tag">Paso 07 · Gestión</div><h2>Medidas y residual</h2></div></div>
      <div class="card"><div class="bd"><div class="empty"><div class="ic">⛨</div><h4>Aún no hay impactos valorados</h4><p>Primero valora impactos en el paso 06. Los severos y críticos aparecerán aquí como prioritarios para el diseño de medidas.</p><button class="btn" onclick="Router.go('assess')">Ir a valoración</button></div></div></div>`;
  }
  const measuresList = DB.measures.length? DB.measures.map(m=>{
    const imps=(m.impact_ids||[]).map(id=>Data.impact(id)).filter(Boolean);
    const t=MEASURE_TYPES.find(x=>x[0]===m.type);
    return `<div class="card"><div class="hd">
      <div style="display:flex;align-items:center;gap:9px"><span class="chip brand" style="background:var(--brand-l);color:var(--brand-d)">${t?t[1]:'Medida'}</span><h3>${esc(m.name)}</h3></div>
      <button class="iconbtn del" onclick="Screens._delMeasure('${m.id}')">🗑</button></div>
      <div class="bd">
        ${m.description?`<p class="small" style="margin-top:0">${esc(m.description)}</p>`:''}
        <div class="pill-row">${imps.map(i=>`<span class="chip gray">${esc(i.name)}</span>`).join('')||'<span class="muted small">Sin impactos asociados</span>'}</div>
        <div class="rowbtns"><button class="btn ghost sm" onclick="Screens._editMeasure('${m.id}')">Editar</button></div>
      </div></div>`;
  }).join('') : '<div class="empty" style="padding:26px"><p class="muted">Todavía no defines medidas. Empieza por los impactos prioritarios.</p></div>';

  const residualRows = valued.map(i=>{
    const init=Data.initialAssess(i.id),res=Data.residualAssess(i.id);
    const ci=M.clsInfo(init.cls);
    const cr=res&&res.complete?M.clsInfo(res.cls):null;
    return `<tr>
      <td>${esc(i.name)}</td>
      <td class="center"><span class="chip ${ci.cls}">${fmtScore(M,init.score)} · ${ci.label}</span></td>
      <td class="center">${res&&res.complete?`<span class="chip ${cr.cls}">${fmtScore(M,res.score)} · ${cr.label}</span>`:'<span class="muted small">—</span>'}</td>
      <td class="center">${res&&res.complete?(Math.abs(res.score)<Math.abs(init.score)?`<span style="color:var(--compat);font-weight:600">↓ ${fmtMag(M,Math.abs(init.score)-Math.abs(res.score))}</span>`:'—'):''}</td>
      <td class="center"><button class="btn ghost sm" onclick="Assess.type='RESIDUAL';Assess.edit('${i.id}','RESIDUAL')">${res?'Editar':'Evaluar'} residual</button>
      ${res&&res.complete?`<button class="btn ghost sm" onclick="Screens._compareResidual('${i.id}')">Comparar</button>`:''}</td>
    </tr>`;
  }).join('');

  return `<div class="page-head"><div class="titles"><div class="step-tag">Paso 07 · Gestión ambiental</div><h2>Medidas y evaluación residual</h2>
    <div class="sub">Diseña medidas para los impactos y vuelve a caracterizar los criterios que cambian. El residual <b>no</b> se calcula reduciendo un porcentaje: se recaracteriza.</div></div>
    <button class="btn" onclick="Screens._editMeasure()">＋ Nueva medida</button></div>

  ${priority.length?`<div class="alert warn" style="margin-bottom:18px"><span class="ai">⚠</span><span><b>${priority.length} impacto(s) prioritario(s)</b> (negativos severos/críticos) requieren medidas asociadas: ${priority.map(i=>esc(i.name)).join(', ')}.</span></div>`:''}

  <div class="card"><div class="hd"><h3>Medidas definidas</h3><span class="desc">${DB.measures.length} medida(s)</span></div><div class="bd" style="padding:14px">${measuresList}</div></div>

  <div class="card"><div class="hd"><h3>Comparación inicial → residual</h3></div><div class="bd">
    <table class="tbl"><thead><tr><th>Impacto</th><th class="center">Inicial</th><th class="center">Residual</th><th class="center">Δ|${M.scoreLabel||'I'}|</th><th class="center" style="width:230px">Acción</th></tr></thead>
    <tbody>${residualRows}</tbody></table>
  </div></div>`;
};
Screens._editMeasure=function(id){
  const m=id?DB.measures.find(x=>x.id===id):{id:UID('MEA'),name:'',type:'MITIGATION',description:'',objective:'',responsible:'',stage:'',indicator:'',verification:'',impact_ids:[]};
  const valued=DB.impacts.filter(i=>{const as=Data.initialAssess(i.id);return as&&as.complete;});
  Modal.open(id?'Editar medida':'Nueva medida ambiental',
    `<div class="field"><label>Nombre de la medida</label><input type="text" id="m_name" value="${esc(m.name)}" placeholder="p. ej. Rescate y reubicación de flora NOM-059"></div>
     <div class="grid2">
       <div class="field"><label>Tipo</label><select id="m_type">${MEASURE_TYPES.map(t=>`<option value="${t[0]}" ${m.type===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select></div>
       <div class="field"><label>Responsable</label><input type="text" id="m_resp" value="${esc(m.responsible)}"></div>
     </div>
     <div class="field"><label>Descripción</label><textarea id="m_desc" placeholder="En qué consiste la medida">${esc(m.description)}</textarea></div>
     <div class="grid2">
       <div class="field"><label>Objetivo / meta</label><input type="text" id="m_obj" value="${esc(m.objective)}"></div>
       <div class="field"><label>Indicador de éxito</label><input type="text" id="m_ind" value="${esc(m.indicator)}"></div>
     </div>
     <div class="field"><label>Impactos que atiende</label><div class="opts" style="flex-direction:column">
       ${valued.map(i=>`<label class="opt ${(m.impact_ids||[]).includes(i.id)?'sel':''}" style="width:100%;justify-content:flex-start" onclick="this.classList.toggle('sel');this.dataset.on=this.classList.contains('sel')" data-id="${i.id}" data-on="${(m.impact_ids||[]).includes(i.id)}"><span class="ov">${(m.impact_ids||[]).includes(i.id)?'☑':'☐'}</span><span class="ol">${esc(i.name)}</span></label>`).join('')}
     </div></div>`,
    `<button class="btn ghost" onclick="Modal.close()">Cancelar</button><button class="btn" onclick="Screens._saveMeasure('${m.id}',${!!id})">Guardar medida</button>`,true);
};
Screens._saveMeasure=function(mid,isEdit){
  const ids=$$('#overlay .opt[data-id]').filter(o=>o.classList.contains('sel')).map(o=>o.dataset.id);
  const data={name:$('#m_name').value.trim(),type:$('#m_type').value,responsible:$('#m_resp').value,
    description:$('#m_desc').value,objective:$('#m_obj').value,indicator:$('#m_ind').value,impact_ids:ids};
  if(!data.name){Toast.show('Ponle nombre a la medida','warn');return;}
  if(isEdit){const m=DB.measures.find(x=>x.id===mid);Object.assign(m,data);}
  else{DB.measures.push({id:mid,...data});}
  audit(isEdit?'update':'create','measure',data.name);touch();Modal.close();Router.refresh();Toast.show('Medida guardada');
};
Screens._delMeasure=function(id){confirmBox('¿Eliminar esta medida?',()=>{DB.measures=DB.measures.filter(m=>m.id!==id);touch();Router.refresh();},'Eliminar',true);};
Screens._compareResidual=function(impId){
  const M=getMethod();const init=Data.initialAssess(impId),res=Data.residualAssess(impId);
  const rows=M.criteria.map(c=>{const i=init.criteria[c.code]||{},r=res.criteria[c.code]||{};
    const iv=(i.value||0)+(i.modifier||0),rv=(r.value||0)+(r.modifier||0);
    const arrow=rv<iv?'<span style="color:var(--compat)">↓</span>':rv>iv?'<span style="color:var(--critic)">↑</span>':'<span class="muted">—</span>';
    return `<tr><td class="mono">${c.code}</td><td>${esc(c.name)}</td><td class="num">${iv}</td><td class="num">${rv}</td><td class="center">${arrow}</td></tr>`;}).join('');
  const ir=M.calculate(init.criteria,Data.impact(impId).nature),rr=M.calculate(res.criteria,Data.impact(impId).nature);
  Modal.open('Comparación inicial → residual · '+esc(Data.impact(impId).name),
    `<div style="display:flex;gap:20px;justify-content:center;margin-bottom:16px;text-align:center">
      <div><div class="muted small">Inicial</div><div class="mono" style="font-size:30px;color:var(--${clsVar(M.clsInfo(ir.cls).cls)})">${fmtScore(M,ir.score)}</div><span class="chip ${M.clsInfo(ir.cls).cls}">${M.clsInfo(ir.cls).label}</span></div>
      <div style="align-self:center;font-size:24px;color:var(--ink-3)">→</div>
      <div><div class="muted small">Residual</div><div class="mono" style="font-size:30px;color:var(--${clsVar(M.clsInfo(rr.cls).cls)})">${fmtScore(M,rr.score)}</div><span class="chip ${M.clsInfo(rr.cls).cls}">${M.clsInfo(rr.cls).label}</span></div>
    </div>
    <table class="tbl"><thead><tr><th>Cód.</th><th>Criterio</th><th class="num">Inicial</th><th class="num">Residual</th><th class="center">Cambio</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="small muted" style="margin-top:10px">La comparación muestra qué criterios cambian por efecto de las medidas y cuáles permanecen (p. ej., la persistencia de un suelo compactado puede no cambiar aunque sí su recuperabilidad).</div>`,
    `<button class="btn" onclick="Modal.close()">Cerrar</button>`,true);
};

const CHART_CSS='<style>text{font-family:system-ui,-apple-system,Arial,sans-serif}.lbl{font-size:11px;fill:#4A4F56}.val{font-size:11px;font-weight:600;fill:#1B1E22}</style>';
const Chart={
  colors:{compat:'#3B8C4E',moder:'#B98700',sever:'#CF611B',critic:'#B02730',brand:'#0E5E5A',pos:'#25638F'},
  bar(data,opt={}){ // data:[{label,value,color}]
    const rowH=30,padR=54,padT=10,padB=10;
    const longest=Math.max(1,...data.map(d=>String(d.label).length));
    const padL=opt.padL||Math.min(340,Math.max(120,Math.round(longest*6.1)+14));
    const w=opt.w||(padL+(opt.plot||240)+padR);
    const h=padT+padB+data.length*rowH;
    const max=Math.max(1,...data.map(d=>d.value));
    let bars=data.map((d,i)=>{
      const y=padT+i*rowH; const bw=(d.value/max)*(w-padL-padR);
      return `<text class="lbl" x="${padL-8}" y="${y+rowH/2}" text-anchor="end" dominant-baseline="middle">${esc(d.label)}</text>
        <rect x="${padL}" y="${y+5}" width="${Math.max(0,bw)}" height="${rowH-12}" rx="3" fill="${d.color||this.colors.brand}"></rect>
        <text class="val" x="${padL+bw+6}" y="${y+rowH/2}" dominant-baseline="middle">${d.value}</text>`;
    }).join('');
    return `<div class="chart"><svg viewBox="0 0 ${w} ${h}">${CHART_CSS}${bars}</svg></div>`;
  },
  stacked(rows,cats,opt={}){ // rows:[{label,values:{cat:n}}]
    const rowH=32,padR=20,padT=10,padB=10;
    const longest=Math.max(1,...rows.map(r=>String(r.label).length));
    const padL=opt.padL||Math.min(340,Math.max(120,Math.round(longest*6.1)+14));
    const w=opt.w||(padL+(opt.plot||300)+padR);
    const h=padT+padB+rows.length*rowH;
    const totals=rows.map(r=>cats.reduce((a,c)=>a+(r.values[c.key]||0),0));
    const max=Math.max(1,...totals);
    let bars=rows.map((r,i)=>{
      const y=padT+i*rowH; let x=padL; let segs='';
      cats.forEach(c=>{const v=r.values[c.key]||0;if(v>0){const bw=(v/max)*(w-padL-padR);
        segs+=`<rect x="${x}" y="${y+6}" width="${bw}" height="${rowH-14}" fill="${c.color}"><title>${c.label}: ${v}</title></rect>`;
        if(bw>16)segs+=`<text class="val" x="${x+bw/2}" y="${y+rowH/2}" text-anchor="middle" dominant-baseline="middle" fill="#fff" style="font-size:10px">${v}</text>`;
        x+=bw;}});
      return `<text class="lbl" x="${padL-8}" y="${y+rowH/2}" text-anchor="end" dominant-baseline="middle">${esc(r.label)}</text>${segs}`;
    }).join('');
    return `<div class="chart"><svg viewBox="0 0 ${w} ${h}">${CHART_CSS}${bars}</svg></div>`;
  },
  legend(cats){return `<div class="legend">${cats.map(c=>`<div class="li"><span class="sw" style="background:${c.color}"></span>${esc(c.label)}</div>`).join('')}</div>`;},
  pie(data,opt={}){ // data:[{label,value,color}] — pastel con % y leyenda lateral
    const size=opt.size||196,r=size/2-4,cx=size/2,cy=size/2;
    const total=data.reduce((a,d)=>a+(d.value||0),0)||1; let ang=-Math.PI/2;
    const slices=data.filter(d=>d.value>0).map(d=>{
      const frac=d.value/total,a0=ang,a1=ang+frac*Math.PI*2; ang=a1;
      const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
      const large=(a1-a0)>Math.PI?1:0,mid=(a0+a1)/2,lr=r*0.62,lx=cx+lr*Math.cos(mid),ly=cy+lr*Math.sin(mid),pct=Math.round(frac*100);
      const t=frac>=0.05?`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#fff" style="font-size:11px;font-weight:700">${pct}%</text>`:'';
      return `<path d="M${cx} ${cy} L${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1} Z" fill="${d.color}" stroke="#fff" stroke-width="1.5"><title>${esc(d.label)}: ${d.value} (${pct}%)</title></path>${t}`;
    }).join('');
    const svg=`<div class="chart" style="flex:0 0 auto"><svg viewBox="0 0 ${size} ${size}" width="${size}">${CHART_CSS}${slices}</svg></div>`;
    const leg=`<div class="legend" style="flex-direction:column;gap:5px;align-items:flex-start">${data.map(d=>{const pct=Math.round((d.value/total)*100);return `<div class="li"><span class="sw" style="background:${d.color}"></span>${esc(d.label)}<span class="muted" style="margin-left:5px">${d.value} · ${pct}%</span></div>`;}).join('')}</div>`;
    return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">${svg}<div style="flex:1;min-width:170px">${leg}</div></div>`;
  },
  donut(data,opt={}){ // data:[{label,value,color}]
    const size=opt.size||150,r=size/2-6,cx=size/2,cy=size/2,inner=r*0.58;
    const total=data.reduce((a,d)=>a+d.value,0)||1;let ang=-Math.PI/2;
    const arcs=data.filter(d=>d.value>0).map(d=>{
      const a0=ang,a1=ang+ (d.value/total)*Math.PI*2;ang=a1;
